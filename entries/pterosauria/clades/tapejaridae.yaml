id: tapejaridae
name: Tapejaridae
rank: clade
parent: azhdarchoidea
wikipedia: Tapejaridae
summary: Small to medium crested, toothless pterosaurs of the Cretaceous, probably of Asian origin — including the
  first known plant-eating pterosaurs.
diagnosis:
- Bony crest arising from the snout, often supporting a larger soft-tissue crest
- Very large nasoantorbital fenestra (at least half of skull length)
- Small pear-shaped eye sockets
- Downturned beak
notes: Brain-case studies indicate excellent vision. Gut contents of Sinopterus show herbivory.
