id: ctenochasmatoidea
name: Ctenochasmatoidea
rank: clade
parent: pterodactyloidea
wikipedia: Archaeopterodactyloidea
summary: Early pterodactyloids — Pterodactylus, gallodactylids and ctenochasmatids — from the Late Jurassic to the
  late Early Cretaceous.
diagnosis:
- Distinctive jaws and highly specialised teeth
- Many species with numerous slender teeth
notes: Kellner's broader Archaeopterodactyloidea also includes Germanodactylus; others prefer Ctenochasmatoidea/Euctenochasmatia
  for the lineage of Pterodactylus, gallodactylids and ctenochasmatids.
