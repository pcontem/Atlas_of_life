id: anurognathidae
name: Anurognathidae
rank: clade
parent: pterosauria
wikipedia: Anurognathidae
summary: Small, short-faced, short-tailed ‘frog-jawed’ pterosaurs of the Jurassic and Early Cretaceous of Europe
  and Asia.
diagnosis:
- Skull wider than long, with a very broad gape
- Large eyes
- Short tail
- Peg-like or slender recurved teeth
notes: Wingspans up to about 90 cm. Usually seen as aerial insect-catchers. Their position in the pterosaur tree
  is disputed.
