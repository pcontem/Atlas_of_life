taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15)
parent: azhdarchoidea
wikipedia: Chaoyangopteridae
summary: Toothless, mostly Early Cretaceous azhdarchoids, probably ground foragers like azhdarchids.
diagnosis:
- Very large nasoantorbital fenestra reaching back to the braincase
- Toothless jaws
- Long neck and legs
notes: Defined by Lü & Unwin (2008). Sometimes treated as a subfamily (Chaoyangopterinae) of Tapejaridae.
