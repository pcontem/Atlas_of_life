id: darwinoptera
name: Darwinoptera (Wukongopteridae)
rank: clade
parent: monofenestrata
wikipedia: Wukongopteridae
summary: Jurassic transitional pterosaurs from China and England combining long tails with pterodactyloid-like heads
  and necks.
diagnosis:
- Long tail and other ‘rhamphorhynchoid’ features
- Long neck vertebrae
- Nasoantorbital fenestra
notes: Wukongopteridae was defined in 2010 (Wukongopterus + Kunpengopterus). Darwinoptera covers the same transitional
  lineage.
