id: dimorphodontidae
name: Dimorphodontidae
rank: clade
parent: pterosauria
wikipedia: Dimorphodontidae
summary: Early, big-headed long-tailed pterosaurs of the Late Triassic to Early Jurassic, known from the UK and
  the south-western USA.
diagnosis:
- Deep, lightly built skull with very large openings
- Large external nostril, the largest skull opening
- Fang-like front teeth followed by smaller teeth
notes: Unwin's 2003 definition (Dimorphodon + Peteinosaurus) may be superfluous; Andres et al. (2014) used Dimorphodontia
  instead. Caelestiventus (2018) shows the group arose in the Triassic.
