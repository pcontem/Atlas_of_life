wikipedia: Pterosaur
summary: 'Pterosaurs: the first vertebrates to evolve powered flight, living from the Late Triassic to the end of
  the Cretaceous (about 228–66 Ma).'
diagnosis:
- Wing membrane of skin, muscle and other tissues stretched from a hugely elongated fourth finger to the ankles
- Pteroid — a unique wrist bone supporting the membrane in front of the arm
- Hair-like pycnofibres covering body and parts of the wings, in some cases branched like down feathers
- Warm-blooded, with air sacs and flow-through breathing that hollowed out the bones
notes: Traditionally split into long-tailed ‘rhamphorhynchoids’ (a paraphyletic grade) and short-tailed Pterodactyloidea,
  linked by the transitional Monofenestrata. Adult sizes range from about 25 cm to perhaps 10–11 m in wingspan.
