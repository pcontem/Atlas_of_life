wikipedia: Ctenochasmatidae
summary: Filter- and sieve-feeding pterosaurs with combs of long, thin teeth, from the Late Jurassic to the Early
  Cretaceous.
diagnosis:
- Long snouts packed with many slender, often outward-pointing teeth
- Teeth forming a filtering comb or basket
notes: 'Andres (2021) recognised three subfamilies: Ctenochasmatinae, Gnathosaurinae and Moganopterinae.'
