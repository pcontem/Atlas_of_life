id: dsungaripteridae
name: Dsungaripteridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15)
parent: pterodactyloidea
wikipedia: Dsungaripteridae
summary: Robust, inland pterosaurs of the Early Cretaceous with pincer-like jaw tips and crushing back teeth.
diagnosis:
- Small eye socket placed high on the skull
- High ridge across the snout
- No teeth at the front of the jaws
- Largest teeth at the back of the upper jaw
notes: Commonly interpreted as eaters of hard-shelled prey. Their position (near azhdarchoids or elsewhere) is debated,
  so the family is placed here directly under Pterodactyloidea.
