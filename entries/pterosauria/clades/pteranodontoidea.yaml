id: pteranodontoidea
name: Pteranodontoidea
rank: clade
taxon_rank: superfamily
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15)
parent: pterodactyloidea
wikipedia: Pteranodontoidea
summary: 'The most diverse Cretaceous pterosaurs: istiodactyliforms, anhanguerians, pteranodontids and nyctosaurids.'
diagnosis:
- Long, narrow wings with a warped deltopectoral crest on the humerus
- Early forms toothed; later pteranodontians toothless
notes: Defined by Kellner (2003) as Anhanguera + Pteranodon and all descendants; Ornithocheiroidea is sometimes
  treated as a synonym. Largely replaced by azhdarchids late in the Cretaceous.
