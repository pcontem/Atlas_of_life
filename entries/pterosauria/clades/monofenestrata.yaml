id: monofenestrata
name: Monofenestrata
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15) — listed there as an unranked
  clade
parent: pterosauria
wikipedia: Monofenestrata
summary: Pterosaurs in which the nostril and antorbital opening merged into a single large skull opening — pterodactyloids
  and their closest relatives.
diagnosis:
- Nasoantorbital fenestra (single opening in front of the eye)
- Elongated neck vertebrae
notes: Named in 2010 after the discovery of Darwinopterus, which combines a pterodactyloid-type skull with a long
  tail. Several Jurassic forms (Douzhanopterus, Propterodactylus, Skiphosoura, Makrodactylus, Laueropterus) document
  the transition.
