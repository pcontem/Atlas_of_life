parent: pteranodontoidea
wikipedia: Ornithocheiromorpha
summary: Large, toothed, often crested fish-eating pterosaurs of the Early to early Late Cretaceous (ornithocheirids,
  anhanguerids and kin).
diagnosis:
- Jaw tips expanded into a tooth rosette
- Rounded crests on the snout and/or lower jaw in many species
- Very long wings
notes: The most diverse and successful pterosaurs of the Early Cretaceous; include some of the largest toothed pterosaurs
  (Tropeognathus, ~8.3 m).
