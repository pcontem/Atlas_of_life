id: pterodactyloidea
name: Pterodactyloidea
rank: clade
taxon_rank: suborder
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15)
parent: monofenestrata
wikipedia: Pterodactyloidea
summary: Short-tailed pterosaurs, from the Middle–Late Jurassic to the end of the Cretaceous — the group that includes
  all the giants.
diagnosis:
- Short tail
- Long wing metacarpals
- Long neck and large head
- Hindlimbs free of the wing membrane; walked well on all fours
notes: The most derived forms lost their teeth; by the Late Cretaceous all known pterodactyloids were toothless.
  Kryptodrakon (~161 Ma) is the earliest known member.
