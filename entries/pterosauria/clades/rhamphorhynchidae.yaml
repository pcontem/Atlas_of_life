id: rhamphorhynchidae
name: Rhamphorhynchidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15)
parent: pterosauria
wikipedia: Rhamphorhynchidae
summary: Long-tailed Jurassic pterosaurs named after Rhamphorhynchus — the classic ‘rhamphorhynchoids’ with tail
  vanes.
diagnosis:
- No more than 11 pairs of teeth in the snout
- Deltopectoral crest narrow at its base and expanded at the tip
- Bent phalanx on the fifth toe
- 'Rhamphorhynchines: lightly built, pointed jaws with forward-pointing (procumbent) teeth'
notes: Traditionally divided into Rhamphorhynchinae and Scaphognathinae; not all analyses recover both groups.
