id: scaphognathidae
name: Scaphognathidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15)
parent: pterosauria
wikipedia: Rhamphorhynchidae
summary: Robust, short-snouted long-tailed pterosaurs of the Jurassic, with few, widely spaced vertical teeth.
diagnosis:
- Broad-tipped skull
- Few, widely spaced, vertically oriented teeth
- Robust skeleton and relatively short wings
notes: Treated as a subfamily (Scaphognathinae) of Rhamphorhynchidae by many authors and as a separate family by
  others; both views place it among long-tailed breviquartossans.
