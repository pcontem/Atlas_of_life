id: azhdarchidae
name: Azhdarchidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15)
parent: azhdarchoidea
wikipedia: Azhdarchidae
summary: Long-necked, toothless ‘terrestrial stalkers’ of the Late Cretaceous, including the largest flying animals
  known.
diagnosis:
- Very long, stiff neck vertebrae
- Long toothless beak
- Long legs and small feet suited to walking
notes: Sizes from cat-sized to 10–12 m wingspans (Quetzalcoatlus, Hatzegopteryx). The last pterosaurs before the
  end-Cretaceous extinction.
