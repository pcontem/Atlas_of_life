id: azhdarchoidea
name: Azhdarchoidea
rank: clade
taxon_rank: superfamily
taxon_rank_source: Paleobiology Database taxonomy (taxa/list, downloaded 2026-11-15)
parent: pterodactyloidea
wikipedia: Azhdarchoidea
summary: Toothless pterodactyloids with relatively short arms and long legs, good walkers — from tapejarids to giant
  azhdarchids.
diagnosis: [Low arm-to-leg length ratio, Toothless jaws, Many with large head crests]
notes: Defined by Unwin (2003) as Quetzalcoatlus + Tapejara and all descendants. Several genera (Alanqa, Xericeps,
  Leptostomia, Keresdrakon, Inabtanin) are placed here as incertae sedis.
