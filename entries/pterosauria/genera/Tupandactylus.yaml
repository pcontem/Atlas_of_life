  note: ''
species:
- name: Tupandactylus imperator
  authority: (Campos and Kellner 1997)
  first_ma: 119.57
  last_ma: 113.2
  interval: Aptian
  reference: D. A. Campos and A. W. A. Kellner. 1997. Short note on the first occurrence of Tapejaridae in the Crato
    Member (Aptian), Santana Formation, Araripe Basin, northeast Brazil. Anais da Academia Brasileira de Ciências
    69:83-87
- name: Tupandactylus navigans
  authority: (Frey et al. 2003)
  first_ma: 119.57
  last_ma: 113.2
  interval: Aptian
  reference: E. Frey, D. M. Martill, and M.-C. Buchy. 2003. A new species of tapejarid pterosaur with soft-tissue
    head crest. Evolution and Palaeobiology of Pterosaurs, Geological Society of London, Special Publications 217:65-72
formations:
- formation: Crato
  group: Santana
  members: [Nova Olinda]
  country: Brazil
  regions: [Ceara, Ceará]
  interval: Late Aptian
  occurrences: 3
  ma: [113.2, 119.57]
fossil_material:
  holotype: MCT 1622-R — Crato Formation, Ceará.
  material: Skulls and a very complete T. navigans skeleton (2021).
  completeness: multiple
  exceptional: Soft-tissue crest and keratin beak preserved; filament-like integument.
biology: Crest about one third of the wingspan in length; the two species may be sexes of one dimorphic species.
  Toothless beak.
