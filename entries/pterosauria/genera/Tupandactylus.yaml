type_species_note: Filled from general knowledge, not yet checked against the original description.
summary: Tapejarid with an enormous sail-like head crest of bone and keratin, from the Crato Formation of Brazil.
size:
  wingspan_m: [2.7, 4]
  note: T. imperator 3–4 m; T. navigans about 2.7 m.
age:
  first_ma: 119.57
  last_ma: 113.2
  early_interval: Aptian
  late_interval: ''
