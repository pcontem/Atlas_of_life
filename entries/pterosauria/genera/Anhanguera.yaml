fossil_material:
  holotype: Type species A. blittersdorffi, based on a complete skull from Romualdo Formation concretions, Ceará–Pernambuco,
    Brazil.
  material: Complete skulls; A. piscator is known from a nearly complete three-dimensional skeleton.
  completeness: multiple
  exceptional: Uncrushed 3D preservation in carbonate concretions.
biology: 'Fish-eater: long, angled conical teeth in a rosette for seizing slippery prey near the water surface.
  Jaw crests varied between individuals and may relate to age or sex.'
