name: Feilongus
rank: genus
parent: ctenochasmatoidea
incertae_sedis: false
placement_note: Originally placed in Gallodactylidae; Lü (2006) recovered it closer to Anhangueridae. Most later
  work keeps it among ctenochasmatoids, but its exact family is debated.
authority: Wang et al. 2005
type_species: Feilongus youngi
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Large, double-crested ctenochasmatoid with a pronounced overbite, from the Yixian Formation of Liaoning,
  China.
size:
  wingspan_m: [2.4, 2.4]
  note: Estimated about 2.4 m by Wang and colleagues.
