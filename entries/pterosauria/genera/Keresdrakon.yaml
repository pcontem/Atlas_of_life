name: Keresdrakon
rank: genus
parent: azhdarchoidea
incertae_sedis: true
placement_note: Recovered as the earliest-diverging tapejaromorph (Kellner et al. 2019) or as sister to Alanqa at
  the base of Azhdarchoidea (Pêgas et al. 2022).
authority: Kellner et al. 2019
type_species: Keresdrakon vilsoni
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Toothless azhdarchoid from the Early Cretaceous ‘Pterosaur Graveyard’ of Paraná, Brazil, found with Caiuajara
  and the theropod Vespersaurus.
