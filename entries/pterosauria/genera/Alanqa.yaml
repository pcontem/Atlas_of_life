fossil_material:
  holotype: Jaw fragments from Aferdou N'Chaft near Begaa, SE Morocco.
  material: Five fragments of upper and lower jaws, possibly one neck vertebra; three further jaw specimens described
    in 2010.
  completeness: fragmentary
  exceptional: Paired bony bumps where the jaws meet — possibly for display, soft-tissue anchoring or crushing hard-shelled
    food.
biology: Lived on a freshwater delta. Inferred to have been a generalist predator taking crustaceans, molluscs,
  amphibians, small reptiles and possibly juvenile dinosaurs, like other azhdarchoids.
