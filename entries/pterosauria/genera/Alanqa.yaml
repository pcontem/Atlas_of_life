name: Alanqa
rank: genus
parent: azhdarchoidea
incertae_sedis: true
placement_note: Originally referred to Azhdarchidae; later analyses recovered it as a thalassodromid (Longrich et
  al. 2018) or as a basal azhdarchoid in its own clade, Alanqidae. Placed here at the most inclusive group all analyses
  agree on.
authority: Ibrahim et al. 2010
type_species: Alanqa saharica
type_species_note: ''
summary: Large toothless azhdarchoid from the Cenomanian Kem Kem Group of Morocco, known almost entirely from straight,
  pointed jaw fragments.
size:
  wingspan_m: [4, 6]
  note: About 4 m for the jaw specimens; an associated neck vertebra suggests individuals of about 6 m and 16–37
    kg (Ibrahim et al. 2010).
