name: Ardeadactylus
rank: genus
parent: ctenochasmatoidea
incertae_sedis: false
placement_note: Recovered in Ctenochasmatidae (Longrich et al. 2018) or Aurorazhdarchidae (Vidovic & Martill 2017);
  both fall within Ctenochasmatoidea.
authority: Bennett 2013
type_species: Ardeadactylus longicollum
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Heron-like, long-necked pterodactyloid from the Late Jurassic of Bavaria, once a species of Pterodactylus.
size:
  wingspan_m: [1.45, 1.6]
  note: Bennett (2013) estimated 1.45 m for the neotype; a referred specimen is about 10% larger.
age:
