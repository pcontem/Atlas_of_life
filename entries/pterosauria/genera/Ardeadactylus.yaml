fossil_material:
  holotype: Original holotype lost in WWII; neotype JME-SOS 2428 (Jura Museum, Eichstätt), Solnhofen limestone.
  material: Two surviving specimens, including skull, neck and anterior body.
  completeness: partial
  exceptional: ''
biology: Interpreted as a long-legged wading piscivore; fewer and relatively larger teeth than Pterodactylus suggest
  larger fish prey.
