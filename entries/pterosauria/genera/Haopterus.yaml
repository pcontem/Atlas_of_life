name: Haopterus
rank: genus
parent: pteranodontoidea
incertae_sedis: true
placement_note: Grouped with Mimodactylus in Mimodactylidae within Istiodactyliformes (Kellner et al. 2019), but
  a 2024 redescription recovered it as a primitive ornithocheiriform.
authority: Wang and Lü 2001
type_species: Haopterus gracilis
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Small crestless pteranodontoid from the Yixian Formation of Liaoning — the first Chinese pterosaur found
  with a skull.
