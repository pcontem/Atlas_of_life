name: Moganopterus
rank: genus
parent: ctenochasmatoidea
incertae_sedis: false
placement_note: Described as a boreopterid (Moganopterinae); later work recovers it as a ctenochasmatid.
authority: Lü et al. 2012
type_species: Moganopterus zhuiana
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Extremely long-skulled toothed pterosaur from the Yixian Formation of Liaoning, China — the largest skull
  of any toothed pterosaur.
