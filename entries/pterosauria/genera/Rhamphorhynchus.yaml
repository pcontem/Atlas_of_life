fossil_material:
  holotype: TM 6924 (R. longicaudus; Teylers Museum) — Solnhofen limestone, Bavaria.
  material: Many specimens, often complete, from very small juveniles (29 cm) to adults.
  completeness: multiple
  exceptional: Fish and cephalopods in the stomach and coprolites; slab WDC CSG 255 shows one caught by the fish
    Aspidorhynchus while swallowing a fish.
biology: Forward-angled needle teeth for catching fish. Scleral-ring comparisons suggest it may have been nocturnal,
  unlike the contemporary Scaphognathus and Pterodactylus.
