name: Changchengopterus
rank: genus
parent: pterosauria
incertae_sedis: true
placement_note: Placed in Rhamphorhynchidae (Lü 2009), tentatively in Wukongopteridae (Wang et al. 2010), and outside
  Monofenestrata (2017). Its position within long-tailed pterosaurs remains unresolved.
authority: Lü 2009
type_species: Changchengopterus pani
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Small long-tailed pterosaur from the Jurassic Tiaojishan Formation of Hebei, China.
