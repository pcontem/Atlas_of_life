fossil_material:
  holotype: TMP 1992.83 — Dinosaur Park Formation, Dinosaur Provincial Park, Alberta.
  material: 'Associated, disarticulated partial skeleton without skull: 4th cervical, rib, humerus, pteroid, 4th
    metacarpal, tibia, metatarsal; referred material from many individuals.'
  completeness: partial
  exceptional: Holotype bones bear bite marks and an embedded tooth tip, probably from Saurornitholestes.
biology: Lived inland on a coastal plain; like other azhdarchids, probably a terrestrial stalker of small animals.
