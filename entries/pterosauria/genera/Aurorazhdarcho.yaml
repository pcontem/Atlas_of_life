fossil_material:
  holotype: Type species A. primordius; the Pester Exemplar (holotype of A. micronyx) is a juvenile skeleton without
    skull, Solnhofen region.
  material: Several skeletons, mostly of juveniles.
  completeness: multiple
  exceptional: The Pester Exemplar was first misidentified as a crustacean in the 18th century.
biology: A small lagoon-dwelling pterodactyloid; ctenochasmatoids are generally associated with shorelines and small
  aquatic prey.
