name: Aurorazhdarcho
rank: genus
parent: ctenochasmatoidea
incertae_sedis: false
placement_note: Bennett (2013) synonymised its type species A. primordius with “Pterodactylus” micronyx, and in
  2025 argued that both are juveniles of Gnathosaurus subulatus. If accepted, Aurorazhdarcho would become a junior
  synonym of Gnathosaurus; kept separate here pending further study.
authority: Frey et al. 2011
