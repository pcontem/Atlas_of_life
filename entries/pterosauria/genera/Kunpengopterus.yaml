fossil_material:
  holotype: IVPP V16047 (K. sinensis) — Tiaojishan Formation, Linglongta, Jianchang, Liaoning.
  material: Almost complete skeletons with skulls; several specimens.
  completeness: multiple
  exceptional: Possibly regurgitated fish with the holotype; ‘Mrs T’ (ZMNH M8802), now K. antipollicatus, preserves
    an egg; the first known opposed thumb in a pterosaur.
biology: The opposable thumb, rare in non-mammals, suggests a grasping ability. Low bony crest behind the eyes,
  extended by cartilage and perhaps a skin flap.
