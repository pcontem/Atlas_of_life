fossil_material:
  holotype: C. roemeri described from a single lower jaw (von Meyer 1851); three species recognised (C. roemeri,
    C. taqueti, C. elegans).
  material: Many specimens, mostly juveniles, from Solnhofen, the ‘Purbeck’ of NW Germany and eastern France.
  completeness: multiple
  exceptional: The three species form a chronological series in which the filter apparatus became progressively
    refined (Bennett 2007).
biology: Over 400 needle-like teeth in adults. Long seen as a filter feeder; the spoon-shaped tooth array may instead
  indicate spoonbill-like sweeping for small prey.
