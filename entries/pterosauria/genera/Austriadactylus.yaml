name: Austriadactylus
rank: genus
parent: pterosauria
incertae_sedis: true
placement_note: Described as Pterosauria incertae sedis (Dalla Vecchia et al. 2002); some later analyses link it
  to Campylognathoididae, but no consensus exists.
authority: Dalla Vecchia et al. 2002
type_species: Austriadactylus cristatus
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Crested Late Triassic pterosaur from the Norian of Tyrol, Austria.
