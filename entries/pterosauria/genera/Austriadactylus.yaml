fossil_material:
  holotype: SMNS 56342 — Seefelder Beds (Norian), abandoned mine near Ankerschlag, Tyrol.
  material: 'Crushed partial skeleton: skull with crest, lower jaws, some vertebrae, parts of limbs and pelvis,
    base of tail.'
  completeness: partial
  exceptional: Bony skull crest up to 2 cm high.
biology: Heterodont teeth (mostly small three-pointed teeth plus fang-like front teeth). Dental microwear suggests
  a diet mainly of hard invertebrates.
