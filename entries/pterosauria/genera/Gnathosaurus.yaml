fossil_material:
  holotype: Jaw fragment named Crocodilus multidens (1832), Solnhofen limestone; later G. subulatus.
  material: Skulls and jaws only (28 cm adult skull with up to 130 teeth); G. macrurus from a partial lower jaw
    and neck vertebrae.
  completeness: fragmentary
  exceptional: Bennett (2025) argued that juvenile skeletons named Aurorazhdarcho micronyx belong to this species.
biology: 'Needle-like teeth around a spoon-shaped tip: probably waded with open jaws and snapped them shut on small
  prey, like modern spoonbills.'
