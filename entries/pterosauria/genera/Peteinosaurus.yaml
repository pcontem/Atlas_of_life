name: Peteinosaurus
rank: genus
parent: pterosauria
incertae_sedis: true
placement_note: Has been placed in Dimorphodontidae, Lonchognatha, or as sister to Macronychoptera (Zambellisauria,
  2020). No consensus.
authority: Wild 1978
type_species: Peteinosaurus zambelli
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: One of the oldest and smallest pterosaurs, from the late Norian of Cene, Italy.
size:
  wingspan_m: [0.6, 1]
  note: About 60 cm; some estimates up to 1 m.
