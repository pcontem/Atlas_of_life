fossil_material:
  holotype: GPIT specimen from Nusplingen, Württemberg (Kimmeridgian), described 1855.
  material: Several skeletons including the ‘Painten Pelican’ skull; one specimen destroyed in 1944.
  completeness: multiple
  exceptional: Mineralised soft-tissue structures inside the jaw gap.
biology: Peg-like teeth at the jaw tips and a gap behind them, possibly working like an openbill stork's to hold
  and crush molluscs and other hard invertebrates.
