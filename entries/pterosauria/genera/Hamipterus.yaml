fossil_material:
  holotype: IVPP V18931.1 — Shengjinkou Formation (Tugulu Group), Hami, Xinjiang (skull, probably female).
  material: Remains of at least 40 animals in 3D, plus hundreds of eggs.
  completeness: multiple
  exceptional: Uncrushed eggs and embryos; crest horn sheaths preserved; one of the most important pterosaur nesting
    sites.
biology: Lived colonially by a lake. CT scans of embryos suggest hatchlings had well-developed legs but weak flight
  apparatus, and some parental care has been proposed.
