fossil_material:
  holotype: Type species D. modularis (Lü et al. 2010) — Tiaojishan Formation, Linglongta, Jianchang, Liaoning.
  material: 30–40 specimens, many complete skeletons; four species described, two of which have been argued to be
    junior synonyms of D. modularis (Zhou et al. 2021).
  completeness: multiple
  exceptional: The egg-bearing specimen ‘Mrs T’ (ZMNH M8802), first described as Darwinopterus, was reassigned to
    Kunpengopterus antipollicatus in 2021.
biology: Spike-like, widely spaced teeth; probably took small vertebrates and insects. Crests may relate to sex,
  though this is debated.
