fossil_material:
  holotype: BSP 1922.I.42 — Solnhofen limestone near Eichstätt, Bavaria (found before 1922).
  material: Crushed, fairly complete skeleton, much of it only as an impression; a second, smaller subadult specimen
    is known.
  completeness: near-complete
  exceptional: The second specimen preserves impressions of the wing membrane and, under UV light, traces of limb
    muscles.
biology: Insectivore with pin-like teeth and a very short, broad skull; probably caught insects on the wing. Possible
  bristles on the snout.
