formations:
- formation: Dolomia di Forni
  group: ''
  members: [lower]
  country: Italy
  regions: [Friuli-Venezia Giulia]
  interval: Alaunian / Alaunian–Sevatian
  occurrences: 2
  ma: [205.7, 215.38]
  id: dolomia-di-forni-italy
fossil_material:
  holotype: MFSN 1770 — Dolomia di Forni, Preone valley, Udine (found 1982).
  material: Most of the skeleton without the rear of the skull; a second specimen and a partial skull.
  completeness: near-complete
  exceptional: The second specimen may be preserved in a fish's regurgitated pellet.
biology: Single-pointed, widely spaced teeth; diet of fish, insects or both.
