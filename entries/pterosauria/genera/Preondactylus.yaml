name: Preondactylus
rank: genus
parent: pterosauria
incertae_sedis: true
placement_note: One of the most basal pterosaurs; relationships among Triassic forms unresolved.
authority: Wild 1984
type_species: Preondactylus buffarinii
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Very early long-tailed pterosaur from the Late Triassic Forni Dolostone of Udine, Italy.
size:
  wingspan_m: [0.45, 1.5]
  note: Holotype 45 cm; a larger referred specimen about 1.5 m.
age:
  first_ma: 215.38
  last_ma: 205.7
  early_interval: Norian
  late_interval: ''
  pbdb_occurrences: 2
  note: ''
species:
