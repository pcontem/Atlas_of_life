type_species: Eudimorphodon ranzii
type_species_note: Filled from general knowledge, not yet checked against the original description.
summary: One of the oldest pterosaurs, from the Late Triassic (Norian) of Lombardy, Italy, with over 100 multi-cusped
  teeth.
