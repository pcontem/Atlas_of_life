fossil_material:
  holotype: MCSNB 2888 — Calcare di Zorzino, Cene, Bergamo (found 1973).
  material: Nearly complete skeleton; several further skeletons including juveniles.
  completeness: near-complete
  exceptional: Stomach contents with remains of the fish Parapholidophorus.
biology: Fangs at the front and multi-cusped rear teeth that met when the jaws closed. A fish-eater that also took
  hard-shelled invertebrates; juveniles may have eaten insects.
