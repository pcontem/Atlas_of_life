type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Flamingo-like filter feeder from the Early Cretaceous of San Luis, Argentina, with about a thousand bristle-like
  teeth.
size:
  wingspan_m: [3, 3]
  note: Maximum adult about 3 m and 9.2 kg.
