fossil_material:
  holotype: FGGUB R 1083A — Densuş-Ciula Formation (Maastrichtian), Haţeg Basin, Romania.
  material: Two fragments of the back of the skull and the proximal left humerus; referred femur, scapulocoracoid
    and a large neck vertebra.
  completeness: fragmentary
  exceptional: Very robust skull (estimated ~2.5 m long) and short, stout neck vertebra.
biology: A terrestrially foraging azhdarchid; with no large theropods on Haţeg Island it was probably the apex predator,
  tackling dwarf titanosaurs and iguanodontians.
