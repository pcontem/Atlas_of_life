title: Life on Earth
lead: Every organism in this atlas — from bacteria to pterosaurs — belongs to one family tree that goes back more
  than three and a half billion years.
intro:
- 'Earth is about 4.54 billion years old, and life appeared early in its history: the oldest fossils that clearly
  record living things are stromatolites about 3.48 billion years old from the Dresser Formation of Western Australia.
  Older traces, chemical signals in rocks and crystals, may push the start back to 3.7 or even 4.1 billion years.'
- 'All living things share the same genetic code and the same molecular machinery for building proteins, which is
  why biologists accept that they descend from a single last universal common ancestor (LUCA). From it come three
  great lineages of cells: Bacteria, Archaea and eukaryotes — the organisms whose cells have a nucleus. Current
  evidence places the origin of eukaryotes inside the archaea, from a host related to today''s Asgard archaea that
  took in a bacterium; the tree of this atlas follows that view.'
- For most of this history life was microscopic. Animals with complex bodies diversified rapidly from about 539
  million years ago, in the Cambrian explosion, and the living world has since been reshaped by five major mass
  extinctions. The groups below give a glimpse of that diversity; each picture opens its place in the tree.
