wikipedia: Heterodontosauridae
summary: Fox-sized ornithischians of the Early Jurassic to Early Cretaceous with canine-like tusks and chewing cheek
  teeth.
diagnosis:
- Small bodies under 2 m long, including the tail
- Enlarged canine-like tusks and cheek teeth adapted for chewing, with an arched diastema behind the premaxillary
  teeth
- Found on every continent except Australia and Antarctica
notes: 'The Wikipedia article used here is the family Heterodontosauridae; PBDB treats Heterodontosauria (Cooper
  1985) as an infraorder. Heterodontosaurids are among the most basal ornithischians and their placement is uncertain:
  most analyses find them outside Genasauria, others inside Neornithischia or Ornithopoda. Only Heterodontosaurus
  is known from a complete skeleton; most other members are known from jaws and teeth. Tianyulong preserves filament-like
  integument.'
