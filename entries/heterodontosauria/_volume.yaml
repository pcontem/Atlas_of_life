title: Heterodontosauria
root: heterodontosauria
attach_to: ornithischia
built: '2026-11-24'
size_measure: length
method: Ages, authorities, species and formations from the Paleobiology Database; descriptive data paraphrased from
  the cited literature and English Wikipedia; images from Wikimedia Commons and PhyloPic with their licences. Classification
  from recent phylogenetic analyses checked against PBDB (docs/TREE_REVIEW.md). Genus list checked against PBDB,
  Wikipedia and recent literature by the census of 2026-11-22 (data/raw/census/ornithischia). Part B of the Ornithischia
  split (Ornithopoda, Heterodontosauria and basal ornithischians).
restoration_checks:
- canine-like tusks, cheek teeth and the arched diastema drawn as the jaw material of this genus shows them
- integument (filaments, tail crest) only where preserved, as in Tianyulong, and not extended to other genera as
  certain
- size under about 2 m and the bipedal build in line with the skeleton (complete only for Heterodontosaurus)
