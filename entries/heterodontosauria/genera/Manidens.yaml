summary: A small Early to Middle Jurassic heterodontosaurid from Patagonia, about 60 cm long, with high-crowned
  herbivorous teeth.
size:
  length_m: [0.6, 0.6]
  mass_kg: [0.5, 0.5]
  note: About 60 cm and 500 g, according to the English Wikipedia revision cited.
age:
  first_ma: 184.2
  last_ma: 170.9
  early_interval: Toarcian
  late_interval: Aalenian
  pbdb_occurrences: 2
  note: First dated to the Aalenian–Bathonian, then constrained to about 179–178 Ma (Toarcian) in the cited text;
    PBDB gives Toarcian to Aalenian.
species:
- name: Manidens condorensis
  authority: Pol et al. 2011
  first_ma: 184.2
  last_ma: 170.9
  interval: Toarcian–Aalenian
  reference: original description
formations:
- formation: Cañadón Asfalto
  group: Sierra de Olte
  members: []
  country: Argentina
  regions: [Chubut]
  interval: Toarcian–Aalenian
  occurrences: 2
  ma: [170.9, 184.2]
  id: canadon-asfalto-argentina
fossil_material:
  holotype: MPEF-PV 3211, a partial skeleton from the Queso Rallado locality, Cañadón Asfalto Formation, Chubut,
    Argentina, with skull, lower jaw, most of the axial column except the tail, left shoulder girdle and pelvis.
  material: Isolated teeth and partial articulated specimens from the same locality, such as MPEF-PV 3809 and MPEF-PV
    1719.
  completeness: partial
  exceptional: ''
biology: High-crowned teeth suggest adaptation to a herbivorous diet, but without the wear facets of more advanced
  forms like Heterodontosaurus. Filaments are known in the related Tianyulong, so they may also have been present,
  but none are preserved.
