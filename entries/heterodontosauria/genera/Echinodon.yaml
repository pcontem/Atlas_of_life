fossil_material:
  holotype: Syntype series NHMUK 48209 to 48215, jaw bones with teeth from Durdlestone Bay, Isle of Purbeck, collected
    by Samuel Beckles and bought by the British Museum in 1876; the sources consulted also mention a lectotype.
  material: Premaxilla, maxilla, lacrimal, jugal, palatine, ectopterygoid and dentary pieces with most upper and
    lower teeth, plus a referred dentary (NHMUK 48229) and isolated teeth from the Purbeck beds.
  completeness: fragmentary
  exceptional: ''
biology: Known only from skull bones, with an enlarged lower caniniform and a small peg-like first dentary tooth;
  the sources consulted do not describe its habits.
