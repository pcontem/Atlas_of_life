summary: A tiny heterodontosaurid known only from jaws and teeth from the earliest Cretaceous Purbeck Group of Dorset,
  England.
size:
  length_m: null
  note: No total length in the sources used; the skull is estimated at about 62 mm from the proportions of Heterodontosaurus,
    which would make it the smallest presumably adult heterodontosaurid.
