fossil_material:
  holotype: SAM-PK-K337, a crushed but nearly complete skull from Tyinindini, Transkei, Cape Province, South Africa;
    the postcranial remains mentioned in the original description could not be found in 2011.
  material: A nearly complete articulated skeleton with skull (SAM-PK-K1332, found 1966 at Voyizane, Elliot Formation),
    a juvenile skull (SAM-PK-K10487), maxillae (SAM-PK-K1326, SAM-PK-K1334) and a sub-adult specimen (AMNH 24000).
  completeness: near-complete
  exceptional: ''
biology: Despite its tusks it is thought to have been herbivorous or at least omnivorous. The upper jaw had small
  incisor-like teeth followed by long canine-like tusks, a gap, and chisel-like cheek teeth; the forelimbs were
  long and robust and the hind limbs slender with four toes.
