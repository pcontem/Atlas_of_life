fossil_material:
  holotype: NHMUK PV RUB 54 (formerly UCL B54), a partial skull and skeleton from the Upper Elliot Formation of
    Lesotho.
  material: Two individuals are known, from the Upper Elliot Formation of Qacha's Nek District in Lesotho and Cape
    Province in South Africa; the second is NHMUK PV RUA 100 (UCL A.100), which has caniniforms.
  completeness: partial
  exceptional: ''
biology: A bipedal herbivore or omnivore with a keratinous beak at the front of the jaws and cheek teeth more widely
  spaced and lower crowned than in Heterodontosaurus. The holotype lacks tusks, once read as a female trait, but
  tusks are present in the second specimen, so their absence may reflect youth.
