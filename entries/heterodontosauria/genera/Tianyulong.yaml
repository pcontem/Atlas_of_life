name: Tianyulong
rank: genus
parent: heterodontosauria
incertae_sedis: false
placement_note: ''
authority: Zheng et al. 2009
type_species: Tianyulong confuciusi
type_species_note: ''
summary: A small heterodontosaurid from the Middle to Late Jurassic of Liaoning, China, preserved with long filament-like
  structures on its neck, back and tail.
size:
  length_m: [0.7, 0.7]
  note: About 70 cm long, of which about 44 cm was tail, estimated from Heterodontosaurus because the known specimens
    are incomplete.
age:
  first_ma: 168.2
  last_ma: 152.21
  early_interval: Bathonian
  late_interval: Kimmeridgian
  pbdb_occurrences: 1
  note: The holotype was first assigned to the Early Cretaceous Jehol Group; a date of about 158.5 Ma on overlying
    volcanic rocks puts it in the Middle to Late Jurassic, in the Tiaojishan (Lanqi) Formation and the Daohugou
    Biota. PBDB uses the Jurassic age.
