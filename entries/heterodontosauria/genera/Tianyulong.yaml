fossil_material:
  holotype: STMN 26-3, most of the skull and skeleton, in the Shandong Tianyu Museum of Nature; privately collected,
    from Jianchang County, western Liaoning, with uncertain stratigraphy.
  material: 'Five further specimens: four undescribed in the Shandong Tianyu Museum and IVPP V17090, a nearly complete
    but partly unprepared skull with vertebrae and limbs, described by Sereno in 2012; all are of uncertain provenance.'
  completeness: near-complete
  exceptional: Long filamentous integumentary structures along the back, tail and neck, resembling those of some
    theropods.
biology: The filaments suggest homology with feathers and that early ornithischians may have had dermal filaments.
  Heterodontosaurids are herbivorous or possibly omnivorous.
