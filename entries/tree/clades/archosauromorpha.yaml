id: archosauromorpha
name: Archosauromorpha
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Archosauromorpha, unranked clade), downloaded 2026-11-16
parent: archelosauria
wikipedia: Archosauromorpha
summary: Diapsid reptiles closer to archosaurs than to lepidosaurs, from Permian long-necked forms to crocodilians,
  dinosaurs and birds.
diagnosis:
- Laminae (thin bony sheets) on the vertebrae
- A posterodorsal process on the premaxilla
notes: 'Named by von Huene in 1946 but little used until cladistic studies of the 1980s. Main groups: allokotosaurs,
  rhynchosaurs, Archosauriformes and a polyphyletic set of long-necked forms (Protorosaurus, tanystropheids, Prolacerta);
  turtles and choristoderes are placed here by some authors. First records are Middle–Late Permian.'
