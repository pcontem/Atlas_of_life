id: aetosauria__aetosauridae__aetosaurinae
name: Aetosaurinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Aetosaurinae, subfamily), downloaded 2026-11-16
parent: aetosauria__aetosauridae
wikipedia: Aetosaurinae
summary: One of the two main aetosaur clades, containing Aetosaurus, Coahomasuchus, Stenomyti and the typothoracines.
diagnosis:
- Dorsal eminence of each paramedian osteoderm offset toward the midline (the original synapomorphy)
- Shorter, lighter skulls than desmatosuchians, with a pointed snout lacking "shovel-shaped" premaxillary extensions
notes: 'Stem-based: all aetosaurs closer to Aetosaurus than to Desmatosuchus. Typothoracinae is nested within it.'
