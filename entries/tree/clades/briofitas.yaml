id: briofitas
name: Bryophytes
rank: clade
taxon_rank: unranked clade
taxon_rank_source: English Wikipedia, “Bryophyte”, revision 1385856469 (no PBDB record; monophyly supported by Su
  et al. 2021)
parent: embryophyta
wikipedia: Bryophyte
summary: Non-vascular land plants made up of liverworts, hornworts and mosses.
diagnosis:
- No true vascular tissue containing lignin
- No flowers or seeds
- Life cycle dominated by the haploid gametophyte, with a dependent unbranched diploid sporophyte
notes: Most recent phylogenetic studies support the monophyly of bryophytes, while earlier work treated them as
  paraphyletic and some mitochondrial-based phylogenies do not support monophyly. In the strict sense the name can
  mean the mosses alone. The text was read on the live Wikipedia page on 2026-11-21 because the recorded revision
  could not be retrieved.
