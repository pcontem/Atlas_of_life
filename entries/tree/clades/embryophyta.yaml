parent: streptophyta
wikipedia: Embryophyte
summary: Land plants, complex multicellular eukaryotes with alternating haploid and diploid generations that descend
  from freshwater charophyte green algae.
diagnosis:
- Alternation of generations, with a haploid gametophyte and a diploid sporophyte
- Sperm and eggs produced in multicellular antheridia and archegonia, with the zygote developing into an embryo
  inside the archegonium
- Sporangia that produce spores or seeds
- Chlorophylls a and b, cellulose cell walls and a phragmoplast during cell division
notes: Includes the bryophytes (mosses, liverworts, hornworts) and the vascular plants (lycophytes, ferns and horsetails,
  gymnosperms, angiosperms). Early evolution of the life cycle and the effect of the Devonian land plant spread
  on climate are covered by the literature cited. The text was read on the live Wikipedia page on 2026-11-21 because
  the recorded revision could not be retrieved.
