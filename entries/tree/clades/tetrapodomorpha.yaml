id: tetrapodomorpha
name: Tetrapodomorpha
rank: clade
taxon_rank: subclass
taxon_rank_source: Paleobiology Database taxonomy (taxon Tetrapodomorpha, subclass), downloaded 2026-11-16
parent: sarcopterygii
wikipedia: Tetrapodomorpha
summary: Tetrapods and the extinct lobe-finned fishes closer to them than to lungfishes, including transitional
  forms such as Tiktaalik.
diagnosis:
- An internal nostril (choana) opening into the mouth
- Humerus with a convex head fitting the shoulder socket (glenoid)
notes: Also called Choanata. Outside crown-group Tetrapoda the group is a paraphyletic series of "stem tetrapods"
  (rhizodonts, osteolepiforms, tristichopterids, elpistostegalians) documenting the fish-to-tetrapod transition.
