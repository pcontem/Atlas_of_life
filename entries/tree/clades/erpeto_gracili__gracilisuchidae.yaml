id: erpeto_gracili__gracilisuchidae
name: Gracilisuchidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Gracilisuchidae, family), downloaded 2026-11-16
parent: suchia
wikipedia: Gracilisuchidae
summary: Small Middle to early Late Triassic suchians from China, Argentina and Brazil.
diagnosis:
- Suchians closer to Gracilisuchus than to other pseudosuchian groups (stem-based definition, Butler et al. 2014)
- Recovered in some analyses as the sister group of Erpetosuchidae, forming one of the two earliest branches of
  Pseudosuchia
notes: Named by Butler et al. (2014) for Gracilisuchus, Turfanosuchus and Yonghesuchus; Taihangosuchus and Parvosuchus
  have since been added. Its position near the base of Suchia or Pseudosuchia varies between analyses.
