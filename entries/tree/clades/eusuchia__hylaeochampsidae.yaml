parent: eusuchia
wikipedia: Hylaeochampsidae
summary: Small Cretaceous eusuchians of Europe and the Middle East with short snouts and crushing teeth.
diagnosis:
- Very short (brevirostrine) snout
- Large crushing teeth at the back of the tooth row, multicusped in Iharkutosuchus
notes: First constructed in 1913 for Hylaeochampsa; Iharkutosuchus (2007) and possibly Heterosuchus belong here.
  Thought to be close to Crocodylia. Added to the tree on 2026-11-16.
