id: archosauria
name: Archosauria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Archosauria, unranked clade), downloaded 2026-11-16
parent: archosauriformes
wikipedia: Archosaur
summary: 'The crown group of birds and crocodilians: everything descended from their last common ancestor, including
  dinosaurs and pterosaurs.'
diagnosis:
- Teeth set in deep sockets
- Antorbital and mandibular fenestrae
- A pronounced fourth trochanter on the femur
notes: Defined as a crown group, it splits at its base into Pseudosuchia (the crocodile line) and Avemetatarsalia
  (the bird line). Many classic features are also found in close relatives outside the crown, such as proterosuchids
  and euparkeriids, which were formerly called archosaurs.
