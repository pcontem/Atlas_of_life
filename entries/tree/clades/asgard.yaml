id: asgard
name: Asgardarchaeota
rank: clade
taxon_rank: kingdom
taxon_rank_source: English Wikipedia, “Asgard archaea”, revision 1385819849 (kingdom Promethearchaeati, formerly
  the superphylum or phylum "Asgardarchaeota")
parent: archaea
wikipedia: Asgard archaea
summary: Archaea whose genomes carry many "eukaryotic signature proteins"; the eukaryotes evolved from within this
  group.
diagnosis:
- Genes for proteins previously thought to be exclusive to eukaryotes (eukaryotic signature proteins)
- Histone proteins with N-terminal tails, as in eukaryotes, in some members (Heimdallarchaeia)
- Mostly known from environmental genomes; the few cultured members live in close metabolic partnership with bacteria
notes: 'Its formal name under the prokaryote code is now kingdom Promethearchaeati, with the former "phyla" demoted
  to classes. Analyses differ on exactly where eukaryotes branch: some place them inside Heimdallarchaeia, a 2025
  study places them outside it. The group supports a two-domain tree of life (Bacteria and Archaea, with eukaryotes
  nested in the latter). The cultured species Promethearchaeum syntrophicum was isolated in 2020.'
