id: chlorophyta
name: Chlorophyta
rank: clade
taxon_rank: phylum
taxon_rank_source: Paleobiology Database taxonomy (Chlorophyta, phylum, attributed to Reichenbach 1834), downloaded
  2026-11-16
parent: viridiplantae
wikipedia: Chlorophyta
summary: Major division of green algae, mostly unicellular, with green chloroplasts and some colonial or multicellular
  classes.
diagnosis:
- Cells with green chloroplasts bounded by a double-membrane envelope, containing chlorophylls a and b
- Cells with a variety of coverings or walls, usually a single chloroplast per cell
notes: Sister taxon to Charophyta (the streptophyte green algae); together they form Viridiplantae. A basal clade,
  Prasinodermophyta, is proposed alongside them. Most groups are unicellular, but the classes Chlorophyceae and
  Ulvophyceae show trends toward colonies and multicellularity. Gulbrandsen et al. (2021) restructured Ulvophyceae
  by phylogenomics, so its internal classification is current only to that revision. The PBDB record attributes
  the name to Reichenbach (1834), which is not in the Wikipedia citations.
