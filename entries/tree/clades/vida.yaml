wikipedia: Life
summary: All living things, which are built from cells and carry out processes such as metabolism, growth and reproduction.
diagnosis:
- Organisms made of one or more units called cells
- Capacity for processes such as cell signalling, homeostasis, metabolism, growth, adaptation, response to stimuli
  and reproduction
notes: 'Root of the tree of life; its members are the Last universal common ancestor and all of its descendants.
  The diagnosis is taken from the Wikipedia definition of life, not from a phylogenetic diagnosis. Defining life
  is disputed: viruses replicate only inside host cells, and the definition may not cover life elsewhere in the
  universe. Cell-based life is found in air, water and soil, including in harsh environments occupied by extremophiles.'
