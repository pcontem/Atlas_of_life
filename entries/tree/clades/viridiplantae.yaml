parent: archaeplastida
wikipedia: Viridiplantae
summary: Green algae and land plants, a clade of about 450,000 to 500,000 species of chloroplast-bearing eukaryotes.
diagnosis:
- 'Chloroplast-bearing eukaryotes: almost all members have chloroplasts'
- Includes all green algae and all land plants, which evolved from freshwater green algae (streptophytes)
notes: Also called kingdom Plantae in the narrow sense. Land plants arose from within green algae, so green algae
  alone form a paraphyletic group, and Viridiplantae is the monophyletic clade that includes land plants. Compared
  with its sister groups Rhodaria and Glaucophyta, almost all members have chloroplasts (exceptions are parasitic
  plants and the heterotrophic alga Prototheca). Viridiplantae are major primary producers and contribute to Earth's
  oxygen, carbon and water cycles. PBDB attributes the name to Cavalier-Smith (1981); that publication is not in
  the Wikipedia citations and has not been checked.
