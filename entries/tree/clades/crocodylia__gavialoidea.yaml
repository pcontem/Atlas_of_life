parent: crocodylia
wikipedia: Gavialoidea
summary: 'The gharial, the false gharial and their extinct relatives: one of the three superfamilies of crocodilians.'
diagnosis:
- Gavialis gangeticus and all crocodylians closer to it than to Alligator or Crocodylus (stem-based definition)
- Living members with very long, narrow snouts (gharial and false gharial)
notes: Whether the extinct thoracosaurs are gavialoids or non-crocodylian eusuchians differs between analyses. South
  American gavialoids probably dispersed from Africa or Asia; an Oligocene form from Puerto Rico suggests they tolerated
  salt water.
