parent: holozoa
wikipedia: Animal
summary: 'Animals: multicellular eukaryotes that feed on other organisms, develop through a blastula and, in most
  cases, can move.'
diagnosis:
- Cells embedded in an extracellular matrix of collagen and elastic glycoproteins
- Embryos pass through a blastula, a hollow ball of cells
- Muscle cells and, in nearly all groups, nerve cells
- 'Heterotrophic: food is ingested and digested internally'
notes: Animals form a clade within Holozoa, closest to the choanoflagellates. The five main lineages are sponges,
  comb jellies, placozoans, cnidarians and bilaterians; which of sponges or comb jellies branched first is still
  debated. The first body fossils are Ediacaran; most living phyla appear during the Cambrian explosion about 539
  million years ago.
