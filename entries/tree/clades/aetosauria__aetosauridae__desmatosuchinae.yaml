id: aetosauria__aetosauridae__desmatosuchinae
name: Desmatosuchinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Desmatosuchinae, subfamily), downloaded 2026-11-16
parent: desmatosuchia
wikipedia: Desmatosuchinae
summary: Aetosaurs closer to Desmatosuchus than to Stagonolepis, Aetosaurus or Paratypothorax, many with spiny armour.
diagnosis:
- Aetosaurs closer to Desmatosuchus than to Stagonolepis, Aetosaurus or Paratypothorax (definition)
- Synapomorphies located in the osteoderms; the core members (Desmatosuchini) carry spiny armour
notes: Named by von Huene (1942). Once restricted to spiny forms such as Desmatosuchus, Longosuchus and Lucasuchus,
  it was later expanded, and the narrow group renamed Desmatosuchini.
