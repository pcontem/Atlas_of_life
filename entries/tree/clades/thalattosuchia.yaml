taxon_rank: infraorder
taxon_rank_source: Paleobiology Database taxonomy (taxon Thalattosuchia, infraorder), downloaded 2026-11-16
parent: crocodyliformes
wikipedia: Thalattosuchia
summary: 'Jurassic–Early Cretaceous "sea crocodiles": teleosauroids and the fully marine metriorhynchoids.'
diagnosis:
- Mostly marine crocodylomorphs with long snouts
- In metriorhynchids, flipper-like forelimbs, a tail fluke and skin without osteoderms
notes: 'Named by Fraas (1901). Its position is debated: within Neosuchia alongside other aquatic crocodylomorphs,
  or among more basal crocodylomorphs, with the similarities to neosuchians due to convergence. A basal teleosauroid
  from the earliest Jurassic of Morocco is among the oldest records; some members lived in fresh water.'
