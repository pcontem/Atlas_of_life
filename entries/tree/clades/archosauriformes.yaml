id: archosauriformes
name: Archosauriformes
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Archosauriformes, unranked clade), downloaded 2026-11-16
parent: archosauromorpha
wikipedia: Archosauriformes
summary: Archosaurs and their nearest relatives, such as proterosuchids, erythrosuchids and euparkeriids.
diagnosis:
- An antorbital fenestra (opening in front of the eye)
- Serrated teeth set in deep sockets
notes: Defined by Gauthier as the clade from the last common ancestor of Proterosuchidae and Archosauria; later
  definitions use Proterosuchus with archosaurs or with Gallus and Alligator. The group originated in the Late Permian
  and survived the end-Permian extinction. Many of its members were formerly lumped as "thecodonts", a paraphyletic
  group no longer used.
