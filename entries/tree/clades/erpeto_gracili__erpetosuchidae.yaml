id: erpeto_gracili__erpetosuchidae
name: Erpetosuchidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Erpetosuchidae, family), downloaded 2026-11-16
parent: pseudosuchia
wikipedia: Erpetosuchidae
summary: Lightly built but well-armoured carnivorous pseudosuchians of the Middle and Late Triassic.
diagnosis:
- Two rows of overlapping osteoderms from neck to tail, with extra rows on back and tail
- Osteoderms deeply sculptured with pits
notes: Named by Watson (1917) for Erpetosuchus; Parringtonia, and possibly Dyoplax, Archeopelta, Pagosvenator and
  Tarjadia, are also included. A stem-based definition was given by Nesbitt and Butler (2012).
