name: Protosuchia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Protosuchia, unranked clade), downloaded 2026-11-16
parent: crocodyliformes
wikipedia: Protosuchia
summary: Small (about 1 m), land-living Mesozoic crocodyliforms traditionally grouped together; now regarded as
  a grade of early crocodyliforms.
diagnosis:
- Small size (about one metre long)
- Terrestrial habits, unlike most later crocodyliforms
notes: Named by Mook (1934). Recent phylogenies do not recover Protosuchia as a natural group, though two studies
  found a Late Triassic–Early Jurassic clade (Protosuchus, Orthosuchus, Edentosuchus, Hemiprotosuchus) and a Jurassic–Cretaceous
  one closer to Mesoeucrocodylia.
