id: tetrapoda
name: Tetrapoda
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Tetrapoda, unranked clade), downloaded 2026-11-16
parent: tetrapodomorpha
wikipedia: Tetrapod
summary: 'Four-limbed vertebrates and their descendants, including limbless forms: amphibians and amniotes.'
diagnosis:
- Four limbs attached to shoulder and pelvic girdles
- Limbs ending in digits
notes: Whether Tetrapoda is defined by limbs with digits (including Devonian forms such as Acanthostega and Ichthyostega)
  or as the crown group of living amphibians and amniotes is debated (Laurin 2002 and replies). Tetrapods arose
  from tetrapodomorph lobe-finned fishes in the Devonian; snakes, caecilians and whales have lost limbs but remain
  tetrapods by descent.
