id: archaea
name: Archaea
rank: clade
taxon_rank: domain
taxon_rank_source: English Wikipedia, “Archaea”, revision 1385819730 (treated as a domain; the PBDB record named
  Archaea is an unrelated spider genus)
parent: vida
wikipedia: Archaea
summary: Single-celled prokaryotes forming one of the two primary branches of cellular life; eukaryotes arose from
  within them.
diagnosis:
- Cell membranes built from ether-linked lipids, unlike the ester-linked lipids of bacteria and eukaryotes
- A distinctive rotary swimming organ, the archaellum
- Genes and pathways for DNA transcription and translation closer to those of eukaryotes than of bacteria
- Metabolisms unknown in other life, such as methanogenesis
notes: First separated from bacteria as "archaebacteria" on the basis of ribosomal RNA (Woese and colleagues). Classification
  is unstable because most lineages are known only from environmental gene sequences. In the strict cladistic sense
  Archaea includes the eukaryotes, which branch from within the Asgard archaea; in everyday use the name still means
  the prokaryotic members only. No archaeal cell fossils can be identified with confidence; the deep record relies
  on chemical fossils (lipids).
