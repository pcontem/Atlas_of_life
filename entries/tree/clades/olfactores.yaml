wikipedia: Olfactores
summary: 'Tunicates and vertebrates: all chordates except the lancelets.'
diagnosis:
- A more elaborate olfactory system, giving rise to nostrils in vertebrates
- Neural-crest-like cells (rudimentary in tunicates, a true neural crest in vertebrates)
notes: Since about 2006, molecular phylogenies have placed tunicates rather than lancelets as the closest relatives
  of vertebrates. Whether the common ancestor had a sedentary adult stage, as in many tunicates, is debated.
