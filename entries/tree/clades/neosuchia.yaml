id: neosuchia
name: Neosuchia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Neosuchia, unranked clade), downloaded 2026-11-16
parent: crocodyliformes
wikipedia: Neosuchia
summary: 'Mesoeucrocodylians closer to the Nile crocodile than to Notosuchus: living crocodilians and their mostly
  semi-aquatic fossil relatives.'
diagnosis:
- All crocodylomorphs closer to Crocodylus niloticus than to Notosuchus terrestris (definition)
- Generally a crocodile-like body adapted to freshwater life, unlike the terrestrial early crocodylomorphs
notes: Named by Clark (1988). Several neosuchian groups evolved long, gharial-like snouts independently, which makes
  their relationships hard to resolve. The earliest proposed member, the Early Jurassic Calsoyasuchus, may lie outside
  the group.
