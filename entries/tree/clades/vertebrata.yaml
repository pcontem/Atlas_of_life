parent: olfactores
wikipedia: Vertebrate
summary: 'Chordates with a backbone and a skull: jawless fishes and jawed vertebrates, including fishes, amphibians,
  reptiles, birds and mammals.'
diagnosis:
- A vertebral column and a skull of cartilage or bone
- A brain divided into three or more regions
- A heart with two or more chambers and kidneys with glomeruli
- Camera-type eyes and an inner ear with semicircular canals
notes: Also called Craniata. The two living branches are the jawless cyclostomes (hagfishes and lampreys) and the
  jawed Gnathostomata. The first vertebrates are Cambrian, about 518 million years ago. Traditional classes such
  as "Agnatha" and "Reptilia" (without birds) are paraphyletic.
