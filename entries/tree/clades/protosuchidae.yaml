id: protosuchidae
name: Protosuchidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Protosuchidae, family), downloaded 2026-11-16
parent: crocodyliformes
wikipedia: Protosuchidae
summary: Small, early crocodyliforms of the Late Triassic to Late Cretaceous, such as Protosuchus and Orthosuchus.
diagnosis:
- A family-level clade of basal crocodyliforms recovered by Bronzati et al. (2012)
- Not to be confused with "Protosuchia", the paraphyletic grade of early crocodyliforms
notes: Named by Brown (1934). Triassic members come from Lesotho, Argentina and Arizona, Jurassic ones from Nova
  Scotia, Poland, South Africa and Arizona, Cretaceous ones from China. Replaces the grade "Protosuchia" in the
  tree.
