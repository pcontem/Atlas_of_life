id: eumetazoa
name: ParaHoxozoa
rank: clade
taxon_rank: unranked clade
taxon_rank_source: English Wikipedia, “ParaHoxozoa”, revision 1377051484 (clade)
parent: metazoa
wikipedia: ParaHoxozoa
summary: 'Animals with Hox/ParaHox genes: bilaterians, cnidarians and placozoans, leaving out sponges and comb jellies.'
diagnosis:
- Hox/ParaHox genes of the ANTP class, which give the group its name
- Several further gene classes absent in sponges and comb jellies (among them HNF, CUT, PROS and ZF)
notes: The tree node is labelled ParaHoxozoa (id kept as "eumetazoa"). If comb jellies are the first animal branch,
  the older name Eumetazoa is sometimes used for this same group. Whether sponges or comb jellies are the sister
  of all other animals is unresolved, so the base of the animal tree is shown as uncertain. A claim that sponges
  also have a ParaHox-like gene has been contested.
