parent: loricata
wikipedia: Crocodylomorpha
summary: Crocodilians and their extinct relatives, from slender, long-legged Triassic forms to marine and land-living
  Mesozoic groups.
diagnosis:
- Upright, slender limbs and elongate body in the earliest members ("sphenosuchians")
- The only pseudosuchian lineage to survive the end-Triassic extinction
notes: The earliest members, grouped as "sphenosuchians", form a grade rather than a clade; Trialestes from the
  Late Triassic of Argentina is the oldest known. In the Jurassic the group spread into the sea (Thalattosuchia)
  and fresh water (Neosuchia), and in the Cretaceous into land-living niches (Notosuchia). Since the late 1980s
  the name Crocodylia has been restricted to living crocodilians and their closest relatives, and most older "crocodilians"
  are placed here or in Crocodyliformes.
