id: gobiosuchidae
name: Gobiosuchidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Gobiosuchidae, family), downloaded 2026-11-16
parent: crocodyliformes
wikipedia: Gobiosuchidae
summary: 'Cretaceous crocodyliforms from Mongolia and Spain: Gobiosuchus, Zaraasuchus and Cassissuchus.'
diagnosis:
- No external mandibular fenestra
- More than two parallel rows of back osteoderms
- Palpebral bones sutured to each other and to the frontal, excluding it from the eye socket
- Cranial table as wide as the lower part of the skull
notes: Named by Osmólska (1972). The synapomorphies listed follow Pol and Norell (2004).
