id: deuterostomia
name: Deuterostomia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Deuterostomia, unranked clade), downloaded 2026-11-16
parent: bilateria
wikipedia: Deuterostome
summary: 'Bilaterians whose embryonic blastopore typically becomes the anus: chordates, echinoderms, hemichordates
  and extinct relatives.'
diagnosis:
- The mouth forms at a second opening; the blastopore becomes the anus
- Coelom formed by out-pocketing of the gut (enterocoely)
- Radial, mostly indeterminate cleavage of the early embryo
- More than 30 genes found in no other animal group
notes: Named by Grobben (1908). Lophophorates and arrow worms, once included, were moved to the protostomes by molecular
  studies from 1995 on. Deuterostome-type development also occurs in some protostomes, so the group is now defined
  by molecular phylogeny rather than embryology alone.
