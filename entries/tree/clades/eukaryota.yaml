id: eukaryota
name: Eukaryota
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Eukaryota, unranked clade), downloaded 2026-11-16
parent: asgard
wikipedia: Eukaryote
summary: 'Organisms whose cells have a nucleus, membrane-bound organelles and a cytoskeleton: animals, plants, fungi
  and the many lineages of protists.'
diagnosis:
- DNA enclosed in a nucleus bounded by a double membrane
- Membrane-bound organelles, including mitochondria derived from an engulfed alphaproteobacterium
- An internal cytoskeleton of actin and microtubules
- Mitosis and, in most lineages, meiosis and sexual reproduction
notes: Thought to have originated in the Paleoproterozoic from a partnership between an Asgard archaeon (host) and
  an aerobic alphaproteobacterium that became the mitochondrion; plastids came later from cyanobacteria. The traditional
  four kingdoms (animals, plants, fungi, protists) are replaced in phylogenomic studies by supergroups such as Amorphea
  and Diphoda; protists are a paraphyletic grade. In a two-domain view the Eukaryota sit inside Archaea.
