parent: embryophyta
wikipedia: Vascular plant
summary: Vascular plants, land plants with lignified xylem and phloem that make up most land plant species, about
  300,000 known.
diagnosis:
- Lignified xylem carrying water and minerals, and non-lignified phloem carrying photosynthetic products
- Diploid sporophyte as the dominant phase of the life cycle
- True roots, leaves and stems, some of which are secondarily lost in some groups
notes: Includes clubmosses, horsetails, ferns, gymnosperms and angiosperms; mosses and other bryophytes are excluded.
  Classification works for the groups inside are cited from the Wikipedia revision (Smith et al. 2006 for ferns,
  Christenhusz et al. 2011 for gymnosperms). The text was read on the live Wikipedia page on 2026-11-21 because
  the recorded revision could not be retrieved.
