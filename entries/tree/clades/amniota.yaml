id: amniota
name: Amniota
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Amniota, unranked clade), downloaded 2026-11-16
parent: tetrapoda
wikipedia: Amniote
summary: 'Tetrapods whose embryos develop inside protective membranes: reptiles (including birds) and mammals with
  their extinct relatives.'
diagnosis:
- 'Embryo enclosed by three extra-embryonic membranes: amnion, chorion and allantois'
- No aquatic larval stage; development is direct
- Thick, keratinized skin
- Breathing by movements of the rib cage (costal ventilation)
notes: Defined as the smallest crown clade containing humans, the Greek tortoise and the Nile crocodile. Amniotes
  arose from reptiliomorph tetrapods in the Carboniferous and split almost at once into Synapsida and Sauropsida;
  molecular dates for the split cluster around 310–340 million years ago. Older clawed footprints from Australia
  have been proposed as amniote tracks, but the claim is disputed.
