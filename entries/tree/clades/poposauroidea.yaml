id: poposauroidea
name: Poposauroidea
rank: clade
taxon_rank: superfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Poposauroidea, superfamily), downloaded 2026-11-16
parent: paracrocodylomorpha
wikipedia: Poposauroidea
summary: 'Diverse Triassic pseudosuchians: short-armed bipeds such as Poposaurus and the toothless shuvosaurids,
  and sail-backed ctenosauriscids.'
diagnosis:
- Pseudosuchians closer to Poposaurus than to crocodilians (definition, Nesbitt 2011)
- 'Very varied body plans: short-armed bipeds, toothless beaked forms, and quadrupeds with sails of long neural
  spines'
notes: The name was used informally for years and formally defined in 2007 and 2011. Its sister group is Loricata
  (rauisuchids, prestosuchids and crocodylomorphs), together forming Paracrocodylomorpha. Several members were long
  mistaken for dinosaurs because of their bipedal, theropod-like build.
