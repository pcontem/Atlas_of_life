id: bilateria
name: Bilateria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Bilateria, unranked clade), downloaded 2026-11-16
parent: eumetazoa
wikipedia: Bilateria
summary: 'Animals with a left–right symmetric body built around a head-to-tail axis: more than 98% of known animal
  species.'
diagnosis:
- Bilateral symmetry at least in the embryo (echinoderms become five-rayed as adults)
- 'Three germ layers: endoderm, mesoderm and ectoderm'
- Usually a through gut with separate mouth and anus
- 'Cephalization: sense organs and nerve ganglia concentrated at the front end'
notes: Named by Hatschek in 1888. Traditionally divided into protostomes (now split into Ecdysozoa and Spiralia)
  and deuterostomes; whether Xenacoelomorpha belong at the base of the group, and whether deuterostomes are a natural
  group, are still argued. Bilaterians diversified rapidly in the late Ediacaran and Cambrian.
