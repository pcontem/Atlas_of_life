notes: Named by Gray (1844). Fossil alligatoroids reached Eurasia over land bridges across the North Atlantic and
  Bering regions. In the tree, Alligatoridae was added on 2026-11-16 to hold Alligatorinae, Caimaninae and early
  genera (docs/TREE_REVIEW.md).
