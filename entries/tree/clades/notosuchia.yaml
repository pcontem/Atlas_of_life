id: notosuchia
name: Notosuchia
rank: clade
taxon_rank: infraorder
taxon_rank_source: Paleobiology Database taxonomy (taxon Notosuchia, infraorder), downloaded 2026-11-16
parent: mesoeucrocodylia
wikipedia: Notosuchia
summary: Mostly Gondwanan, land-living Jurassic–Cretaceous crocodyliforms with very varied teeth and diets.
diagnosis:
- Generally small, slender animals with erect limbs
- Short, deep skulls in most members
- Highly varied, sometimes mammal-like teeth
notes: Named by Gasparini (1971). Diets ranged from plants (Chimaerasuchus) to hypercarnivory (Baurusuchus). Whether
  Sebecosuchia lies inside Notosuchia or is its sister group differs between analyses; if inside, the group survived
  to the late Miocene or early Pliocene.
