diagnosis:
- Crocodylus niloticus and all crocodylians closer to it than to Alligator or Gavialis (stem-based definition)
- May include the extinct Australasian Mekosuchinae (disputed)
notes: Molecular studies find crocodiles and gharials more closely related to each other than either is to alligators,
  rejecting the older grouping Brevirostres.
