id: chordata
name: Chordata
rank: clade
taxon_rank: phylum
taxon_rank_source: Paleobiology Database taxonomy (taxon Chordata, phylum), downloaded 2026-11-16
parent: deuterostomia
wikipedia: Chordate
summary: 'Animals with a notochord, a hollow dorsal nerve cord, pharyngeal slits, an endostyle and a post-anal tail
  at some stage of life: lancelets, tunicates and vertebrates.'
diagnosis:
- 'Notochord: a stiff, elastic rod along the body axis'
- Hollow dorsal nerve cord (neural tube)
- Pharyngeal slits
- Endostyle, or the thyroid gland derived from it
- Post-anal tail
notes: 'Three subphyla: Cephalochordata (lancelets), Tunicata and Vertebrata; tunicates and vertebrates together
  form Olfactores. Two conserved protein insertions/deletions are shared by all chordates and no other animals.
  Tunicates keep the chordate features only as larvae. The phylum name is credited to Haeckel (1874).'
