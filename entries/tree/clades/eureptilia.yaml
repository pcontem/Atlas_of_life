parent: sauropsida
wikipedia: Sauropsida
summary: '"True reptiles": diapsids, which include all living reptiles and birds, and several early Permo-Carboniferous
  forms such as captorhinids and Hylonomus.'
diagnosis:
- Supraoccipital, tabular and supratemporal bones at the back of the skull greatly reduced
- These reduced bones no longer in contact with the postorbital
notes: One of the two traditional divisions of Sauropsida, with Parareptilia. Besides diapsids it held Permo-Carboniferous
  captorhinids and "protorothyrids" (Anthracodromeus is the oldest known climbing tetrapod); only diapsids outlived
  the Permian. Studies of the early 2020s found Parareptilia paraphyletic and recovered captorhinids and Protorothyris
  as stem amniotes rather than reptiles, so Eureptilia may not survive as a clade. Wikipedia has no separate article;
  the cited revision is the Sauropsida article.
