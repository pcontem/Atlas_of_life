id: avemetatarsalia
name: Avemetatarsalia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Avemetatarsalia, informal), downloaded 2026-11-16
parent: archosauria
wikipedia: Avemetatarsalia
summary: 'The bird line of archosaurs: everything closer to birds than to crocodilians, including dinosaurs and
  pterosaurs.'
diagnosis:
- '"Advanced mesotarsal" ankle with a large astragalus and a small calcaneum working as a single hinge'
- Upright limbs held under the body
- Filamentous body coverings in many members, from pterosaur pycnofibres to dinosaur feathers
notes: Named by Benton (1999); also called Pan-Aves. Gauthier's earlier names Ornithosuchia and Ornithodira cover
  similar ground. Besides dinosaurs and pterosaurs, it includes Triassic lagerpetids, aphanosaurs and other early
  dinosauromorphs. Only dinosaurs and pterosaurs survived the end of the Triassic.
