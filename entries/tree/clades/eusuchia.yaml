id: eusuchia
name: Eusuchia
rank: clade
taxon_rank: suborder
taxon_rank_source: Paleobiology Database taxonomy (taxon Eusuchia, suborder), downloaded 2026-11-16
parent: neosuchia
wikipedia: Eusuchia
summary: Neosuchians that include modern crocodilians and their closest relatives, first appearing in the Early
  Cretaceous.
diagnosis:
- Choanae (internal nostrils) completely surrounded by the pterygoid bones
- Procoelous vertebrae (concave in front, convex behind)
notes: Originally defined by Huxley (1875) by these features; because they may have arisen more than once among
  neosuchians, modern definitions use common ancestry. With Dyrosauridae and Sebecosuchia, eusuchians were the only
  crocodyliforms to survive the end-Cretaceous extinction.
