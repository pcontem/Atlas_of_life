id: opisthokonta
name: Opisthokonta
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Opisthokonta, unranked clade), downloaded 2026-11-16
parent: amorphea
wikipedia: Opisthokont
summary: The group uniting animals, fungi and their single-celled relatives, named for the single posterior flagellum
  that pushes their swimming cells.
diagnosis:
- Flagellate cells (sperm, zoospores) driven by one posterior flagellum
- Chitin produced outside the cell in walls, cysts or exoskeletons
- Shared cellular and metabolic pathways supporting the animal–fungus split as its basal division
notes: Formerly called the "Fungi/Metazoa group". It divides into Holomycota (fungi and relatives) and Holozoa (animals
  and relatives); no lineage branching before that split is known. Its relationships were largely resolved by phylogenomics
  (Torruella et al. 2015). Together with apusomonads and breviates it forms Obazoa.
