wikipedia: Atoposauridae
summary: Small Jurassic–Cretaceous neosuchians of Eurasia with several tooth types.
diagnosis: [Small body size, Heterodont dentition (several tooth types)]
notes: Named by Gervais (1871). Tennant et al. (2016) found the traditional family paraphyletic and restricted it
  to Alligatorellus, Alligatorium and Atoposaurus. Most records are Late Jurassic–Early Cretaceous from France,
  Portugal and Bavaria.
