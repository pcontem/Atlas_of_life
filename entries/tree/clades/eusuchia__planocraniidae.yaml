taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Planocraniidae, unranked clade), downloaded 2026-11-16
parent: crocodylia
wikipedia: Planocraniidae
summary: 'Paleogene "hoofed crocodiles": land-living crocodylians with long legs and blunt, hoof-like claws.'
diagnosis:
- Tall, narrow (laterally compressed) skulls
- Laterally compressed teeth
- Long legs and blunt, hoof-like claws
- Heavy armour encasing the tail and extending down the legs
notes: 'Named by Li (1976); formerly called Pristichampsidae until Pristichampsus was found undiagnostic (Brochu
  2013). Three genera: Boverisuchus, Duerosuchus and Planocrania. Their exact place within or near Crocodylia is
  unsettled (Rio and Mannion 2021).'
