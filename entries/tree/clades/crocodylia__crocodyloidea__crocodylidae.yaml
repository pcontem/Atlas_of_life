wikipedia: Crocodile
summary: 'True crocodiles: large, tropical, semi-aquatic crocodilians of Africa, Asia, the Americas and Australia.'
diagnosis:
- Narrower, longer head with a V-shaped rather than U-shaped snout
- A protruding lower tooth, the most reliable feature to tell them from alligators
notes: Named by Cuvier (1807). Molecular studies place crocodiles closer to gharials than to alligators. All species
  are tropical and sensitive to cold.
