id: neosuchia__dyrosauridae
name: Dyrosauridae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Dyrosauridae, unranked clade), downloaded 2026-11-16
parent: neosuchia
wikipedia: Dyrosauridae
summary: Campanian–Eocene neosuchians with long snouts, many marine, among the few marine reptiles to survive the
  end-Cretaceous extinction.
diagnosis:
- Typically an elongate, gharial-like snout
- External nostrils at the back end of the snout
notes: Named by Stefano (1903). Found on all continents except Antarctica and Australia; some species were freshwater
  or terrestrial. Jouve et al. (2020) moved Sabinosuchus and Fortignathus out of the family.
