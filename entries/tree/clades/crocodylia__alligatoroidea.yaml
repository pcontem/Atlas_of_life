wikipedia: Alligatoroidea
summary: Alligators, caimans and all extinct crocodylians closer to them than to crocodiles or gharials.
diagnosis:
- Alligator mississippiensis and all crocodylians closer to it than to Crocodylus or Gavialis (stem-based definition)
- Includes the crown family Alligatoridae; Leidyosuchus of Alberta is among the earliest members
notes: Split from the crocodile–gharial line in the Late Cretaceous, about 80 million years ago (possibly 100 by
  molecular dating).
