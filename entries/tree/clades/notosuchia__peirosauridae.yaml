wikipedia: Peirosauridae
summary: Gondwanan Cretaceous crocodyliforms with a dog-like skull, land-living carnivores.
diagnosis: [Rather dog-like skull, Terrestrial carnivores]
notes: Defined in 2004 as the most recent common ancestor of Peirosaurus and Lomasuchinae and its descendants. Mahajangasuchus,
  once included, now has its own family. Eggs from the Adamantina Formation tentatively assigned to the group suggest
  adaptation to humid nests.
