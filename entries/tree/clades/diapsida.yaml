id: diapsida
name: Diapsida
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Diapsida, unranked clade), downloaded 2026-11-16
parent: eureptilia
wikipedia: Diapsid
summary: 'Reptiles that have, at least ancestrally, two openings on each side of the skull behind the eye: all living
  reptiles and birds and many extinct groups.'
diagnosis:
- Two temporal fenestrae (upper and lower) on each side of the skull, at least ancestrally
- In neodiapsids, an upper temporal fenestra added to an already present lower one
notes: Some members lost one or both openings (lizards, snakes, turtles) or reshaped the skull (birds) but remain
  diapsids by descent. The skull-opening classes of older classifications (Anapsida, Euryapsida) are no longer used
  as groups. Whether the early Araeoscelidia acquired their openings independently of Neodiapsida is under study.
