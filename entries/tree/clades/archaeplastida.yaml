id: archaeplastida
name: Archaeplastida
rank: clade
taxon_rank: unranked clade
taxon_rank_source: English Wikipedia, “Archaeplastida”, revision 1385543025; PBDB record Archaeplastida, unranked
  clade (no attribution in PBDB)
parent: eukaryota
wikipedia: Archaeplastida
summary: Large group of mostly photosynthetic eukaryotes whose plastids contain chlorophyll, including green algae,
  land plants and red algae.
diagnosis:
- Plastids: pigment-bearing, membrane-bound organelles, most of them containing chlorophyll
- Chloroplasts surrounded by two membranes, consistent with an origin from an engulfed cyanobacterium
notes: Major clades Viridiplantae (green algae and land plants) and Rhodophyta (red algae), plus the minor basal
  division Glaucophyta. The group also includes heterotrophic lineages such as the flagellates Rhodelphidia and
  the picoplankton Picozoa, which may be sisters to Rhodophyta; the text places both in a clade with Rhodophyta,
  called Rhodaria. Some phylogenomic work places a different lineage as closest to Archaeplastida (Yazaki et al.
  2022), so its closest relatives are not settled. Sometimes treated as the kingdom Plantae in a broad sense.
