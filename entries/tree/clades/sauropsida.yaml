id: sauropsida
name: Sauropsida
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Sauropsida, unranked clade), downloaded 2026-11-16
parent: amniota
wikipedia: Sauropsida
summary: 'The reptile side of the amniote tree: all amniotes closer to living reptiles and birds than to mammals.'
diagnosis:
- Amniotes more closely related to reptiles and birds than to synapsids (branch-based definition)
- Includes birds, which are theropod dinosaurs
notes: Broadly equivalent to Reptilia when that name is used to include birds. The base of the group has traditionally
  been split into Eureptilia and Parareptilia, but recent studies question whether both are natural groups. Sauropsids
  appear in the Carboniferous, about 315 million years ago.
