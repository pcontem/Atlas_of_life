wikipedia: Bacteria
summary: Mostly free-living, usually single-celled prokaryotes, typically a few micrometres long, found in nearly
  every habitat on Earth.
diagnosis:
- 'Prokaryotic cells: no nucleus, and rarely membrane-bound organelles'
- Circular chromosomes, unlike the chromosomes of animals and other eukaryotes
notes: Once regarded as plants (class Schizomycetes, “fission fungi”), bacteria are now classified as prokaryotes.
  The 1990s discovery that prokaryotes form two very different groups, descended from a common ancestor, led to
  the domains Bacteria and Archaea (Woese et al. 1990). Göker and Oren (2024) published the valid names of the two
  domains and of seven kingdoms of prokaryotes. Bacteria are important in nutrient cycling, nitrogen fixation and
  decomposition.
