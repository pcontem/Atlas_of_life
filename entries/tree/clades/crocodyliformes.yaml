id: crocodyliformes
name: Crocodyliformes
rank: clade
taxon_rank: suborder
taxon_rank_source: Paleobiology Database taxonomy (taxon Crocodyliformes, suborder), downloaded 2026-11-16
parent: crocodylomorpha
wikipedia: Crocodyliformes
summary: Crocodylomorphs with the build of later crocodilians; the only pseudosuchians to survive the end-Cretaceous
  extinction.
diagnosis:
- A secondary bony palate separating the nasal passage from the mouth
- The first crocodylomorphs to show many of the defining features of later crocodilians
notes: The name was introduced by Hay (1930) and given its modern sense by Clark (1988), who restricted Crocodylia
  to the crown group. It includes the terrestrial "protosuchians", Thalattosuchia (if not placed outside), Notosuchia
  and Neosuchia. Large supertree analyses (Bronzati et al. 2012) give a well-resolved picture of its main branches.
