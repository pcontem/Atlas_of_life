id: osteichthyes
name: Osteichthyes
rank: clade
taxon_rank: class
taxon_rank_source: Paleobiology Database taxonomy (taxon Osteichthyes, class), downloaded 2026-11-16
parent: gnathostomata
wikipedia: Osteichthyes
summary: 'Bony fishes in the cladistic sense: ray-finned and lobe-finned fishes and their descendants, the tetrapods.'
diagnosis:
- Endoskeleton mostly of bone
- Large dermal bones covering the head and shoulder girdle, with a stable pattern of skull bones
- Lungs or a swim bladder derived from an outgrowth of the gut
- Bony operculum covering the gills
notes: 'Two branches: Actinopterygii (ray-finned fishes, most living fish) and Sarcopterygii (lobe-finned fishes
  and tetrapods). As a traditional class excluding tetrapods the group is paraphyletic. The oldest fossils are about
  436 million years old (early Silurian).'
