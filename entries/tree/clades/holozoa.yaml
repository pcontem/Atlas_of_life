id: holozoa
name: Holozoa
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Holozoa, unranked clade), downloaded 2026-11-16
parent: opisthokonta
wikipedia: Holozoa
summary: Animals plus their closest single-celled relatives (choanoflagellates, filastereans, ichthyosporeans and
  others), to the exclusion of fungi.
diagnosis:
- Animals and the unicellular choanoflagellates, filastereans, Pluriformea and Ichthyosporea share a common ancestor
  not shared with fungi (phylogenomic evidence)
- Purely heterotrophic organisms
notes: Holozoa replaces the older "Choanofila", which excluded animals and was therefore paraphyletic. The unicellular
  holozoans are studied to understand how multicellular animals arose. The order of the two earliest branches (Ichthyosporea
  and Pluriformea) is uncertain. Some Precambrian fossils once taken for animals may be holozoan protists.
