id: rauisuchia
name: Rauisuchia
rank: clade
taxon_rank: suborder
taxon_rank_source: Paleobiology Database taxonomy (taxon Rauisuchia, suborder), downloaded 2026-11-16
parent: pseudosuchia
wikipedia: Rauisuchia
summary: A traditional grade of large, mostly carnivorous Triassic pseudosuchians with pillar-erect hips, now split
  among Loricata and Poposauroidea.
diagnosis:
- Hip socket facing downward, with the femur set under a bony shelf (pillar-erect posture)
- Mostly large (often 4–6 m), carnivorous and quadrupedal, with exceptions
notes: Named by von Huene (1942); the group is paraphyletic. Rauisuchids and "prestosuchids" are now placed in Loricata,
  closer to crocodylomorphs, and poposaurids in Poposauroidea. The upright gait evolved independently from that
  of dinosaurs.
