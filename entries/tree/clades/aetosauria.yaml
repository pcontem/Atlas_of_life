id: aetosauria
name: Aetosauria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Aetosauria, unranked clade), downloaded 2026-11-16
parent: pseudosuchia
wikipedia: Aetosauria
summary: Heavily armoured, plant- or mixed-diet pseudosuchians of the Late Triassic with small heads and upturned
  snouts.
diagnosis:
- Four rows of plate-like osteoderms covering the body
- Small skull with an upturned snout; no teeth at the front of the upper and lower jaws
- Small, bulbous or leaf-shaped teeth
- Pillar-erect hindlimbs
notes: 'Named by Lydekker (1889). Restricted to the Late Triassic, when they are among the most common vertebrate
  fossils in some rocks; their armour plates are often preserved even where little else is. Main divisions: Desmatosuchia
  (with Desmatosuchinae) and Aetosaurinae (with Typothoracinae).'
