id: streptophyta
name: Streptophyta
rank: clade
taxon_rank: unranked clade
taxon_rank_source: English Wikipedia, “Streptophyta”, revision 1374433022 (treated as a clade of plants); PBDB record
  Streptophyta, unranked clade, attributed to (Jeffrey 1971)
parent: viridiplantae
wikipedia: Streptophyta
summary: Clade of plants made up of freshwater charophyte green algae and all land plants.
diagnosis:
- Includes land plants (embryophytes) and all green algae except Chlorophyta and the basal Prasinodermophyta
- Name refers to the twisted sperm morphology of some members (Greek strepto, “twisted”)
notes: The composition varies considerably between authors; some include only the charophyte algae Charales and
  the land plants, others add more groups, and some exclude the land plants. Streptophyta includes both unicellular
  and multicellular organisms. Nedelcu et al. (2006) argued that the unicellular alga Mesostigma is closely related
  to Streptophyta, on the basis of a land-plant-specific gene family. The PBDB record is attributed to (Jeffrey
  1971), which is not in the Wikipedia citations.
