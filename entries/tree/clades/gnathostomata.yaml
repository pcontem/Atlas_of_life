id: gnathostomata
name: Gnathostomata
rank: clade
taxon_rank: superclass
taxon_rank_source: Paleobiology Database taxonomy (taxon Gnathostomata, superclass), downloaded 2026-11-16
parent: vertebrata
wikipedia: Gnathostomata
summary: Jawed vertebrates — cartilaginous fishes, bony fishes and tetrapods, plus extinct placoderms and acanthodians
  — about 99% of living vertebrates.
diagnosis:
- Jaws formed from the first pharyngeal arch
- True teeth and paired pectoral and pelvic appendages
- A horizontal semicircular canal in the inner ear
- An adaptive immune system using V(D)J recombination, with thymus and spleen
notes: The jawless osteostracans are generally taken as the closest relatives. Placoderms are now treated as a grade
  at the base of the group. The ancestor of jawed vertebrates went through two whole-genome duplications. Traditionally
  ranked as an infraphylum or superclass.
