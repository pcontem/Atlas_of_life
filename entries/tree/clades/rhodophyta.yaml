wikipedia: Red algae
summary: Red algae, a large group of mostly marine organisms with over 7,000 described species, from single cells
  to complex multicellular forms.
diagnosis:
- No flagella or centrioles at any life stage
- Double-layered cell walls with agar-forming polysaccharides outside and mostly cellulose inside
- Chlorophylls a and d plus phycoerythrin, which gives the red colour; unstacked photosynthetic membranes and floridean
  starch as energy store
- Pit connections and pit plugs formed during incomplete cell division
notes: About 5% of species live in freshwater. Cyanidiophyceae, unicellular heat- and acid-tolerant extremophiles,
  are generally considered the most basal lineage. Other major groupings are the SCRP clade (Stylonematophyceae,
  Compsopogonophyceae, Rhodellophyceae, Porphyridiophyceae) and the BF clade (Bangiophyceae and Florideophyceae,
  including the seaweeds). Plastid genomes are among the most gene-rich known. The text was read on the live Wikipedia
  page on 2026-11-21 because the recorded revision could not be retrieved.
