id: sarcopterygii
name: Sarcopterygii
rank: clade
taxon_rank: subclass
taxon_rank_source: Paleobiology Database taxonomy (taxon Sarcopterygii, subclass), downloaded 2026-11-16
parent: osteichthyes
wikipedia: Sarcopterygii
summary: Lobe-finned fishes — coelacanths and lungfishes — and the tetrapods descended from them.
diagnosis:
- Paired fins on fleshy, scaly lobes, joined to the girdle by a single bone
- Fin skeleton (appendicular skeleton) patterned like a limb bud
- Cosmine-covered scales in early forms
notes: 'Two branches: Actinistia (coelacanths) and Rhipidistia (lungfishes plus Tetrapodomorpha). Lungfishes are
  the closest living fish relatives of tetrapods. Cladistic classifications include tetrapods within the group;
  "lobe-finned fish" in common use means only the aquatic, non-tetrapod members.'
