id: archelosauria
name: Archelosauria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Archelosauria, unranked clade), downloaded 2026-11-16
parent: diapsida
wikipedia: Archelosauria
summary: Turtles and archosaurs (crocodilians and birds) with their extinct relatives, to the exclusion of lepidosaurs.
diagnosis:
- 'Supported mainly by molecular data: about 1,000 ultraconserved genome elements shared by turtles and archosaurs
  but not lepidosaurs'
- Recent morphological analyses also place turtles (Pantestudines) inside Archosauromorpha
notes: Named by Crawford et al. (2015). Morphology long placed turtles elsewhere — with parareptiles, outside Sauria,
  or with lepidosaurs — so turtle origins remain one of the main questions about the group.
