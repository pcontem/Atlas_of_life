id: solidocrania
name: Solidocrania
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Solidocrania, unranked clade), downloaded 2026-11-17
parent: crocodylomorpha
wikipedia: Crocodylomorpha
summary: Crocodyliforms and their closest "sphenosuchian" relatives, united by reinforced, solidly built skulls.
diagnosis:
- Least inclusive clade containing Junggarsuchus, Almadasuchus and Macelognathus (definition, Ruebenstahl et al.
  2022)
- Similarly reinforced skulls in crocodyliforms and these early crocodylomorphs
notes: Established by Ruebenstahl and colleagues (2022) in a study of Junggarsuchus and Dibothrosuchus. Recovered
  by Leardi (2025) with Crocodyliformes, Junggarsuchus, Macelognathus, Almadasuchus and Eopneumatosuchus. Wikipedia
  has no separate article; the cited revision is Crocodylomorpha.
