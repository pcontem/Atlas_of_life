id: amorphea
name: Amorphea
rank: clade
taxon_rank: unranked clade
taxon_rank_source: English Wikipedia, “Amorphea”, revision 1382799800 (supergroup; name recommended in 2012 by the
  International Society of Protistologists)
parent: eukaryota
wikipedia: Amorphea
summary: Eukaryote supergroup made of the Amoebozoa and the Obazoa — the latter including opisthokonts (animals
  and fungi) and their protist relatives.
diagnosis:
- A fusion of three genes for pyrimidine synthesis (carbamoyl phosphate synthase, dihydroorotase, aspartate carbamoyltransferase)
  absent in other eukaryotes
- Cells typically with two basal bodies, of which only one usually bears a flagellum
notes: Proposed by Cavalier-Smith (2002) as the "unikonts"; renamed Amorphea in 2012 because the supposed single
  flagellum was found not to be a true shared feature. Its sister group in most analyses is Diphoda (plants, algae
  and many protists). The internal classification of its smaller lineages (apusomonads, breviates, "Sulcozoa") is
  still being revised.
