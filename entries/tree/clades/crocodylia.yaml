id: crocodylia
name: Crocodylia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Crocodylia, unranked clade), downloaded 2026-11-16
parent: eusuchia
wikipedia: Crocodylia
summary: 'Crocodilians: true crocodiles, alligators and caimans, gharials and their closest extinct relatives —
  the living crocodile line.'
diagnosis:
- Long snout, flattened head, short neck and laterally compressed tail on a solid, low body
- Five mostly unwebbed digits on the front feet and four webbed digits on the hind feet
- Skin with bony scutes (osteoderms)
notes: 'The crown group appeared in the Late Cretaceous (Campanian, about 83.5 million years ago); crocodilians
  and birds are the only surviving archosaurs. Three living families: Crocodylidae, Alligatoridae and Gavialidae.
  Molecular studies place gharials closer to crocodiles than to alligators, contradicting older morphological trees.'
