id: rauisuchia__rauisuchidae
name: Rauisuchidae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Rauisuchidae, unranked clade), downloaded 2026-11-16
parent: loricata
wikipedia: Rauisuchidae
summary: Large predatory Triassic pseudosuchians up to about 6 m long, close relatives of crocodylomorphs within
  Loricata.
diagnosis:
- Most inclusive clade with Rauisuchus but not Prestosuchus, Poposaurus or Crocodylus (definition, Nesbitt 2011)
- Large, quadrupedal carnivores with pillar-erect hips
notes: Which genera belong to Rauisuchidae, Prestosuchidae or Poposauridae has long been disputed. In Nesbitt's
  sense rauisuchids lie within Loricata, close to Crocodylomorpha.
