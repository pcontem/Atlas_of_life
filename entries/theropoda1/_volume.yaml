title: Theropoda I
root: theropoda
attach_to: saurischia
built: '2026-11-26'
size_measure: length
method: Ages, authorities, species and formations from the Paleobiology Database; descriptive data paraphrased from
  the cited literature and English Wikipedia; images from Wikimedia Commons and PhyloPic with their licences. Classification
  from recent phylogenetic analyses checked against PBDB (docs/TREE_REVIEW.md). Genus list checked against PBDB,
  Wikipedia and recent literature by the census of 2026-11-25 (data/raw/census/theropoda1). Theropoda I covers non-avian
  theropods outside Maniraptora (basal theropods, Ceratosauria, Megalosauroidea, Allosauroidea, Megaraptora,
  Tyrannosauroidea, Compsognathidae and Ornithomimosauria); Maniraptora, including birds, is left for later volumes.
restoration_checks:
- posture: near-horizontal spine and bipedal stance, with the hands held palms facing inwards rather than downwards
- integument drawn according to the evidence for the group (filamentous or feathered in Compsognathidae, Proceratosauridae
  and some other coelurosaurs; scaly skin impressions in large tyrannosaurids, abelisaurids and carcharodontosaurids)
- skull, teeth and cranial ornaments (crests, horns, nasal bosses) match the genus; lips covering the teeth are
  now the usual reconstruction
- hand and foot structure (number and size of the fingers, claw shape) agree with the material
