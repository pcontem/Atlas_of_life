parent: avetheropoda
wikipedia: Coelurosauria
summary: Theropods more closely related to birds than to carnosaurs, including tyrannosauroids, compsognathids,
  ornithomimosaurs and maniraptorans.
diagnosis:
- Contains compsognathids, tyrannosauroids, ornithomimosaurs and maniraptorans
- Includes the birds, the only living dinosaurs
notes: Megaraptorans have been recovered in the group in recent years but their place is unclear. Maniraptora, which
  holds the birds, is left to later volumes.
