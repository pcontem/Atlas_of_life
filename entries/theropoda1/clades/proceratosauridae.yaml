wikipedia: Proceratosauridae
summary: Tyrannosauroids from the Middle Jurassic to the Early Cretaceous, generally small with long three-fingered
  arms.
diagnosis:
- Generally small bodies with fairly long three-fingered arms able to grasp prey
- Exceptions are the large Yutyrannus and Sinotyrannus
notes: Yutyrannus and Sinotyrannus are only possible proceratosaurids.
