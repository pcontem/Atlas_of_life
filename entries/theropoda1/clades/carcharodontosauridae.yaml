wikipedia: Carcharodontosauridae
summary: Allosauroids including some of the largest land predators known, such as Giganotosaurus and Carcharodontosaurus.
diagnosis:
- Named as a family by Stromer in 1931 and now a clade within Carnosauria
- Several genera rivalled Tyrannosaurus and Spinosaurus in size
notes: Acrocanthosaurus, Giganotosaurus, Mapusaurus, Carcharodontosaurus and Tyrannotitan are the best-known genera.
