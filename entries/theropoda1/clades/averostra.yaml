wikipedia: Theropoda
summary: The clade of theropods that holds Ceratosauria and Tetanurae and so most large predatory dinosaurs.
diagnosis:
- Joins the ceratosaurs and the tetanurans as sister groups
- Contains Ceratosauria and Tetanurae
notes: The name covers the two great branches of non-coelophysoid theropods, Ceratosauria (mostly southern) and
  Tetanurae (which includes the birds).
