taxon_rank_source: Paleobiology Database taxonomy (taxon Compsognathidae, family), downloaded 2026-11-26
parent: coelurosauria
wikipedia: Compsognathidae
summary: Small, generally conservative coelurosaurian carnivores of the Jurassic and Cretaceous, possibly polyphyletic.
diagnosis:
- Small carnivores of conservative form
- Skin impressions in Compsognathus, Sinosauropteryx and Sinocalliopteryx show diverse integument
notes: The family is potentially polyphyletic. Its bird-like features helped inspire the link between dinosaurs
  and birds.
