id: neotheropoda
name: Neotheropoda
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Neotheropoda, unranked clade), downloaded 2026-11-26
parent: theropoda
wikipedia: Theropoda
summary: The theropod clade that holds Coelophysoidea and Averostra and so most theropods other than the earliest
  members of the group.
diagnosis:
- Includes the coelophysoids and the averostrans (ceratosaurs and tetanurans)
- Excludes the earliest theropods
notes: Basal members whose position among coelophysoids and averostrans is unsettled sit directly in this group,
  for example Dilophosaurus, Liliensternus and Zupaysaurus; the old family Dilophosauridae is not kept as a clade
  here.
