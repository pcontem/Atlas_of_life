taxon_rank: superfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Coelophysoidea, superfamily), downloaded 2026-11-26
parent: neotheropoda
wikipedia: Coelophysoidea
summary: Slender carnivorous theropods of the Late Triassic and Early Jurassic that lived on probably every continent.
diagnosis:
- Slender carnivorous bodies with a superficial similarity to coelurosaurs and some species with delicate cranial
  crests
- Sizes from about 1 to 6 m in length
notes: The external covering of coelophysoids is unknown and artists have drawn them scaly or feathered. Some species
  may have lived in packs, judging from sites where many individuals lie together. Most dinosaurs once placed in
  the dubious Podokesauridae are now coelophysoids.
