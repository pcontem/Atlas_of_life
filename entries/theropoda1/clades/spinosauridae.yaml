id: spinosauridae
name: Spinosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Spinosauridae, family), downloaded 2026-11-26
parent: megalosauroidea
wikipedia: Spinosauridae
summary: Large fish-eating theropods with long, narrow, crocodile-like skulls, known from the Cretaceous of Africa,
  Europe, South America and Asia.
diagnosis:
- Long low narrow skulls with conical, weakly serrated or unserrated teeth
- Jaw tips fanned into a spoon-shaped rosette behind which a notch sits in the upper jaw
notes: The family holds ten to seventeen genera depending on the author. The two subfamilies are Baryonychinae and
  Spinosaurinae.
