id: megaraptora
name: Megaraptora
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Megaraptora, unranked clade), downloaded 2026-11-26
parent: tetanurae
wikipedia: Megaraptora
summary: Carnivorous theropods whose derived members have large hand claws and powerfully built forelimbs.
diagnosis:
- Large strong forelimbs with a uniquely shaped ulna in the Megaraptoridae
- No complete skeleton is known
notes: Analyses disagree on the position of the group, which has been recovered among allosauroids and among coelurosaurs,
  so the clade is attached to Tetanurae, the deepest group they share.
