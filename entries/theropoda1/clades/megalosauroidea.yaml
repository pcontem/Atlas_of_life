id: megalosauroidea
name: Megalosauroidea
rank: clade
taxon_rank: superfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Megalosauroidea, superfamily), downloaded 2026-11-26
parent: tetanurae
wikipedia: Megalosauroidea
summary: Basal tetanuran theropods from the Middle Jurassic to the Late Cretaceous, including Megalosaurus, Torvosaurus
  and the spinosaurids.
diagnosis:
- Defined as Megalosaurus bucklandii and all taxa closer to it than to Allosaurus fragilis or Passer domesticus
- Includes Megalosaurus, Torvosaurus and Spinosaurus
notes: The group may be paraphyletic with respect to Allosauroidea, so some members could be closer to allosauroids
  than to each other. Some recent studies revive Carnosauria for Megalosauroidea plus Allosauroidea.
