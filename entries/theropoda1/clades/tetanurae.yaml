taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Tetanurae, unranked clade), downloaded 2026-11-26
parent: averostra
wikipedia: Tetanurae
summary: The clade of theropods more closely related to birds than to Ceratosaurus, holding most predatory dinosaur
  diversity.
diagnosis:
- Includes megalosauroids, allosauroids and coelurosaurs, the last including birds
- Sister group of Ceratosauria that split from it probably in the Late Triassic
notes: Tetanurans appear in the fossil record by the Early Jurassic, about 190 million years ago. The name means
  stiff tails.
