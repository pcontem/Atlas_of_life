parent: abelisauridae
wikipedia: Brachyrostra
summary: A clade of short-snouted abelisaurids that includes Carnotaurus and its relatives from Argentina and Brazil,
  plus Caletodraco from France.
diagnosis:
- Relatively short and unusually shaped skulls compared with other theropods
- Contains Carnotaurus, Aucasaurus and their close relatives
notes: The group was proposed by Canale and colleagues in 2008 after they found that the South American abelisaurids
  known then formed one sub-clade.
