wikipedia: Theropoda
summary: One of the three major dinosaur clades, ancestrally carnivorous bipeds that include the birds as their
  only living members.
diagnosis:
- Hollow bones and three toes with claws on each limb
- Ancestrally carnivorous with several groups evolving into herbivores and omnivores
- Feathers known in many coelurosaurian members and possibly present in others
notes: Theropods are generally classed as saurischians and so are closer to sauropodomorphs than to ornithischians.
  They first appeared in the Late Triassic, and birds evolved from small coelurosaurian theropods in the Jurassic.
  This volume covers the non-avian theropods outside Maniraptora; Maniraptora and the birds are treated in later
  volumes.
