wikipedia: Allosauridae
summary: A family of medium to large bipedal Late Jurassic allosauroids named by Marsh in 1878.
diagnosis:
- General neotheropod anatomy that makes the family hard to define
- Typical Allosaurus fragilis skull of about 0.85 m with serrated teeth
notes: Allosauridae was first named by Othniel Charles Marsh in 1878.
