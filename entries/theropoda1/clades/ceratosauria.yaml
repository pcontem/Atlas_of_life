wikipedia: Ceratosauria
summary: Theropods that share a more recent common ancestor with Ceratosaurus than with birds, found chiefly in
  the Southern Hemisphere.
diagnosis:
- Three major clades, Ceratosauridae, Noasauridae and Abelisauridae
- The oldest member, Saltriovenator, dates to about 199 million years ago
notes: Coelophysoids and dilophosaurids were once included but most recent studies exclude them. Most members lived
  in the Southern Hemisphere, though not exclusively.
