summary: A tyrannosaurid subfamily from the Late Cretaceous of the United States and Canada, sister to Tyrannosaurinae.
diagnosis:
- First used by Currie, Hurum and Sabath and defined as Albertosaurus plus Gorgosaurus
- Sister clade of Tyrannosaurinae
notes: A 2007 analysis also included Maleevosaurus, often treated as a juvenile of Tarbosaurus, but that placement
  is not accepted.
