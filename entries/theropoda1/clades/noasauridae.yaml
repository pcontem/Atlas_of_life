parent: ceratosauria
wikipedia: Noasauridae
summary: Ceratosaurs close to the short-armed abelisaurids but mostly with a more ordinary theropod build.
diagnosis:
- Noasaurines have sharp outward-splayed teeth and a downturned lower jaw
- Elaphrosaurines have toothless jaws and were at least partly herbivorous
notes: Elaphrosaurinae is placed in the family by some studies. At least some noasaurids had pneumatised neck vertebrae.
  Masiakasaurus and Limusaurus are the best-known examples of the two groups.
