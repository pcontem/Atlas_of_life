parent: tyrannosauroidea
wikipedia: Tyrannosauridae
summary: Large Late Cretaceous coelurosaurs of North America and Asia with two subfamilies and up to fifteen genera.
diagnosis:
- Two subfamilies, Albertosaurinae and Tyrannosaurinae
- Known only from the Late Cretaceous of North America and Asia
notes: The number of genera is disputed and some experts accept as few as three. Well-known genera include Tyrannosaurus,
  Albertosaurus, Gorgosaurus, Daspletosaurus and Tarbosaurus.
