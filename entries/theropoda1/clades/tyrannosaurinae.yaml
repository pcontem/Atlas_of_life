summary: One of the two tyrannosaurid subfamilies, usually larger and more robust than the albertosaurines.
diagnosis:
- At least three tribes and several genera
- Overall more robust and larger than Albertosaurinae, the alioramins being gracile
notes: Includes Lythronax, one of the oldest tyrannosaurid genera, from the Late Cretaceous of western North America
  and east Asia.
