id: megalosauridae
name: Megalosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Megalosauridae, family), downloaded 2026-11-26
parent: megalosauroidea
wikipedia: Megalosauridae
summary: A family of large basal tetanurans that appeared in the Middle Jurassic and was among the first big radiations
  of large theropods.
diagnosis:
- Two main subfamilies, Megalosaurinae and Afrovenatorinae, plus the basal Eustreptospondylus
- Relatively primitive basal tetanurans
notes: The defining member, Megalosaurus bucklandii, was named in 1824 by William Buckland from finds at Stonesfield,
  Oxfordshire. Several genera placed in the family differ between analyses.
