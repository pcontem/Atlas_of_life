id: baryonychinae
name: Baryonychinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Baryonychinae, subfamily), downloaded 2026-11-26
parent: spinosauridae
wikipedia: Baryonychinae
summary: A spinosaurid subfamily from the Early Cretaceous of Europe and West Africa defined by Baryonyx and its
  relatives.
diagnosis:
- Large bipedal predators with elongated crocodile-like skulls, jaw tips fanning into rosettes and a premaxillary
  notch
- Robust forelimbs with three-fingered hands bearing an enlarged first-digit claw
notes: The clade was named by Charig and Milner in 1986 and later defined by Sereno and colleagues in 1998 and Holtz
  and colleagues in 2004.
