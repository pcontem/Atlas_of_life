id: ornithomimosauria
name: Ornithomimosauria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Ornithomimosauria, unranked clade), downloaded 2026-11-26
parent: coelurosauria
wikipedia: Ornithomimosauria
summary: Fast omnivorous or herbivorous theropods that superficially resembled ostriches, from the Cretaceous of
  Laurasia and possibly Africa.
diagnosis:
- Ostrich-like fast bodies with a toothless beak in the advanced forms
- Appeared in the Early Cretaceous and persisted to the Late Cretaceous
notes: Primitive members include Nqwebasaurus, Pelecanimimus, Shenzhousaurus, Hexing and Deinocheirus, whose arms
  reached 2.4 m.
