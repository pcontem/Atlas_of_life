id: ornithomimidae
name: Ornithomimidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Ornithomimidae, family), downloaded 2026-11-26
parent: ornithomimosauria
wikipedia: Ornithomimidae
summary: Cursorial ostrich-like theropods known chiefly from the Late Cretaceous of Asia and North America.
diagnosis:
- Small skull with large eyes on a long slender neck and a toothless beak
- Long slender forelimbs and long legs for running
notes: Also reported from the Lower Cretaceous Wonthaggi Formation of Australia.
