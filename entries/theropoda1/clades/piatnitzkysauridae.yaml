parent: megalosauroidea
wikipedia: Piatnitzkysauridae
summary: A small family of megalosauroid or basal allosauroid theropods from the Jurassic, named after Piatnitzkysaurus.
diagnosis:
- 'Three to four genera: Condorraptor, Marshosaurus, Piatnitzkysaurus and possibly Xuanhanosaurus'
- Known so far only from Jurassic beds, mostly in the western hemisphere
notes: Piatnitzkysaurus and Condorraptor come from the Cañadón Asfalto Formation of Argentina. Including Xuanhanosaurus
  would extend the range to Asia.
