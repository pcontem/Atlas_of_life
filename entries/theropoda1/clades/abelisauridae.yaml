taxon_rank_source: Paleobiology Database taxonomy (taxon Abelisauridae, family), downloaded 2026-11-26
parent: ceratosauria
wikipedia: Abelisauridae
summary: Stocky-limbed ceratosaurs with ornamented skulls that thrived on Gondwana and its fragments in the Cretaceous.
diagnosis:
- Stocky hind limbs and extensive grooved and pitted ornamentation of the skull bones
- Forelimbs vestigial in many members such as Carnotaurus
notes: Fossils are known from Africa, South America, western Europe, India and Madagascar. The putative abelisaurid
  Eoabelisaurus from Patagonia would push the origin back to the Early Jurassic, while some genera survived to the
  end of the Mesozoic.
