  parent: spinosaurinae
  placement: PBDB places it in Spinosaurinae
- name: Ngexisaurus
  author: Zhao 1983
  status: nomen nudum
  ref: Listed in the English Wikipedia "List of informally named dinosaurs" (revision 1387441643), which includes
