  source: English Wikipedia
  parent: coelurosauria
  placement: PBDB places it in Coelurosauria
- name: Kol
  author: Turner et al. 2009
  status: nomen inquirendum
  ref: PBDB lists Kol ghuva (Turner et al. 2009), but the English Wikipedia title "Kol" is a disambiguation page
    and no taxon article was found; check the primary literature before an entry is written.
  source: PBDB
  parent: coelurosauria
  placement: PBDB places it in Coelurosauria
- name: Yezosaurus
  author: Muramoto and Obata 1977
  status: junior synonym
  ref: English Wikipedia redirects "Yezosaurus" to the mosasaur Taniwhasaurus (revision 1363060548); Yezosaurus
    mikasaensis Caldwell et al. 2008 is a marine reptile, not a theropod
  source: English Wikipedia
  parent: tyrannosauridae
  placement: PBDB lists it under Tyrannosauridae, which the Wikipedia article contradicts; kept here only to record
    the rejected name
- name: Dromiceiomimus
