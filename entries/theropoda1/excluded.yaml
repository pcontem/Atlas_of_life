- name: Syntarsus
  author: Raath 1969
  status: junior synonym
  ref: Name preoccupied by a colydiine beetle genus and replaced by Megapnosaurus (English Wikipedia, "Syntarsus",
    revision 1073404658; Ivie et al. 2001)
  source: English Wikipedia
  parent: coelophysidae
  placement: PBDB places it in Coelophysoidea; its type species belongs to Megapnosaurus, in Coelophysidae
- name: Fenestrosaurus
  author: Osborn 1924
  status: junior synonym
  ref: Redirects to Oviraptor in English Wikipedia (revision 1357658525 of "Oviraptor"); named in Osborn 1924
  source: English Wikipedia
  parent: theropoda
  placement: PBDB lists it in Theropoda; the genus belongs to Oviraptorosauria, outside this volume
- name: Vitakridrinda
