restoration_checks:
- neck length and neck posture consistent with the cervical material of this genus or its close relatives
- body proportions and limb posture (bipedal, facultatively bipedal or columnar quadrupedal) match the limb and
  girdle material
- skull shape and dentition (leaf-shaped, peg-like or spatulate teeth) match the material of this genus
- skin covering, osteoderms (titanosaurs), tail-tip whiplash or spines only where the fossils of the group support
  them
