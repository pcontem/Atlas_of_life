name: Lingwulong
rank: genus
parent: diplodocoidea
incertae_sedis: true
placement_note: Xu and colleagues (2018) described it as a diplodocoid (flagellicaudatan), while Mannion and Moore
  (2025) recovered it as sister of Cetiosauriscus, either outside Flagellicaudata or inside Diplodocidae; Diplodocoidea
  is used as the clade closest to both.
authority: Xu et al. 2018
type_species: Lingwulong shenqi
type_species_note: Monotypic genus; the only species is the type.
summary: Lingwulong is a Middle Jurassic sauropod from Ningxia, China, once seen as the oldest known diplodocoid
  and earliest neosauropod.
size:
  length_m: null
  note: No body-length estimate was read in the sources consulted.
age:
  first_ma: 174.7
  last_ma: 161.5
  early_interval: Aalenian
  late_interval: Callovian
  pbdb_occurrences: 1
  note: Source unit uncertain. It was first attributed to the Yanan Formation (Aalenian, about 174.0–171.7 Ma);
    the cited Wikipedia revision says some argue it comes from the younger Zhiluo Formation.
