fossil_material:
  holotype: LM V001a, the rear of a skull with dentary teeth in their original positions; the paratype and holotype
    may belong to one individual.
  material: Remains of seven to ten individuals of different ages from quarries at Ciyaopu near Lingwu, covering
    nearly the whole skeleton.
  completeness: multiple
  exceptional: ''
biology: It had a U-shaped snout, unlike the square snout of most diplodocoids, and an ornamented upper margin of
  the orbit.
