fossil_material:
  holotype: FMNH P 25107, a partial postcranial skeleton found in 1900 in the Colorado River valley near Fruita,
    Colorado, collected by Riggs and the Field Columbian Museum.
  material: The holotype is still the most complete specimen; only a few others are thought to belong to the genus,
    making it one of the rarer Morrison sauropods.
  completeness: partial
  exceptional: ''
biology: Regarded as a high browser, possibly cropping or nipping vegetation as high as about 9 m above the ground.
