name: Guaibasaurus
rank: genus
parent: sauropodomorpha
incertae_sedis: true
placement_note: Most analyses recover it as a sauropodomorph, but some suggest a theropod; Bonaparte et al. (1999)
  found it a possible basal theropod and gave it its own family (Wikipedia revision); PBDB places it in Guaibasauridae.
authority: Bonaparte et al. 1999
type_species: Guaibasaurus candelariensis
type_species_note: Monotypic genus; the only species is the type.
summary: Guaibasaurus is a small basal saurischian from the Late Triassic Caturrita Formation of Rio Grande do Sul,
  Brazil, usually recovered as a sauropodomorph.
