fossil_material:
  holotype: MCN PV2355, a well-preserved partial postcranial skeleton.
  material: Two further specimens, UFRGS PV0725T (a nearly complete postcranial skeleton lacking one forelimb, both
    feet and the neck) and MCN PV 10112 (a block with articulated and isolated elements).
  completeness: multiple
  exceptional: ''
biology: One skeleton lies in a posture like the resting position of birds, otherwise known mainly from maniraptoran
  dinosaurs.
