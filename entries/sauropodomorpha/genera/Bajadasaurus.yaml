name: Bajadasaurus
rank: genus
parent: dicraeosauridae
incertae_sedis: false
placement_note: ''
authority: Gallina et al. 2019
type_species: Bajadasaurus pronuspinax
type_species_note: Monotypic genus; the only species is the type.
summary: Bajadasaurus is a dicraeosaurid sauropod from the Early Cretaceous of Patagonia known from a skull and
  neck with elongated spines.
size:
  length_m: null
  note: The cited text compares dicraeosaurids with Asian elephants but gives no length for this genus.
