fossil_material:
  holotype: A single specimen found in 2010, including a largely complete skull and parts of the neck; the number
    was not read. Bone fusion shows the individual was adult.
  material: Skull and neck vertebrae from the Bajada Colorada Formation, Argentina; the skull is crushed.
  completeness: partial
  exceptional: ''
biology: Its very long neural spines have been discussed as part of a defence system; its skull and neck were later
  restudied in detail.
