name: Shunosaurus
rank: genus
parent: sauropoda
incertae_sedis: false
placement_note: ''
authority: Dong et al. 1983
type_species: Shunosaurus lii
type_species_note: Monotypic genus; S. ziliujingensis is a nomen nudum (Wikipedia revision).
summary: Shunosaurus is a sauropod from the Shaximiao Formation of Sichuan, China, one of the best anatomically
  known sauropods with 94% of its elements identified.
size:
  length_m: [9.5, 11]
  mass_kg: [3000, 3000]
  note: First estimated at 11 m, later finds suggested a smaller size; Paul estimated 9.5 m and 3 t (Wikipedia revision).
age:
  first_ma: 174.7
  last_ma: 154.8
  early_interval: Aalenian
  late_interval: Oxfordian
  pbdb_occurrences: 5
  note: The Shaximiao Formation was long thought Middle Jurassic, but detrital zircons give a maximum age of 159
    +/- 2 Ma, in the Oxfordian (Wikipedia revision).
