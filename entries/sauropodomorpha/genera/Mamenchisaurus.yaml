fossil_material:
  holotype: Not read in the sources consulted; the type species M. constructus was named by Young in 1954 from remains
    found during construction work near Yibin, Sichuan.
  material: Many partial skeletons of several species from the Shaximiao Formation and other units of China, plus
    Mongolia and Thailand.
  completeness: multiple
  exceptional: ''
biology: Researchers question the number of referred species and fragments; the genus is sometimes called a wastebasket
  taxon.
