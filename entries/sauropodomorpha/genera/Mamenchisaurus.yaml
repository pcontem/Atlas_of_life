authority: Young 1954
type_species: Mamenchisaurus constructus
type_species_note: Named for the road construction during which the first fossil was found (cited Wikipedia revision).
summary: Mamenchisaurus is a genus of long-necked sauropods of the Late Jurassic of China, with a taxonomy that
  remains confused.
size:
  length_m: [15, 26]
  note: Most species were 15–26 m long, possibly up to 35 m from two undescribed vertebrae (cited Wikipedia revision).
