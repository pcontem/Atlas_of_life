type_species_note: Monotypic genus; originally Brachiosaurus brancai Janensch 1914.
summary: Giraffatitan is a very tall brachiosaurid sauropod from the Late Jurassic Tendaguru Formation of Tanzania.
size:
  length_m: [21.8, 22.46]
  note: Length of the subadult specimen HMN SII; a larger fibula suggests animals of 23–26 m. Mass estimates range
    widely, from 15 to 78 t, so none is given.
