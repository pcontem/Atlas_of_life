type_species_note: Named by Owen in 1854; the original fossils were destroyed in London in the Blitz. Two species
  are valid according to the cited Wikipedia revision; M. hislopi (PBDB) is left out.
summary: Massospondylus is a bipedal sauropodomorph from the Early Jurassic of southern Africa, among the first
  dinosaurs named and one of the best known early sauropodomorphs.
