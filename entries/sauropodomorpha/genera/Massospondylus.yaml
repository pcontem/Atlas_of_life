fossil_material:
  holotype: Not read in the sources consulted; the original fossils described by Owen (1854) were destroyed in the
    Blitz.
  material: A plethora of specimens from southern Africa, including egg clutches with embryos.
  completeness: multiple
  exceptional: Clutches of eggs, some with embryos, among the oldest amniote eggs and embryos known.
biology: Probably a herbivore, although some authors have speculated that basal sauropodomorphs were omnivores.
  It is now considered bipedal at all ages; the embryos had proportionally longer arms and a very large head. The
  eggshell was extremely thin, under 0.1 mm. Growth rate varied with environmental factors such as food availability.
