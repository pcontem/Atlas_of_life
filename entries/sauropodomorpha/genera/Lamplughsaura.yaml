name: Lamplughsaura
rank: genus
parent: sauropodomorpha
incertae_sedis: true
placement_note: The cited Wikipedia revision says it has been classified as either a basal sauropod or a more basal
  sauropodomorph; PBDB places it in Sauropoda.
authority: Kutty et al. 2007
type_species: Lamplughsaura dharmaramensis
type_species_note: Monotypic genus; the only species is the type.
summary: Lamplughsaura is a large quadrupedal sauropodomorph from the Early Jurassic Dharmaram Formation of India,
  known from several partial skeletons.
size:
  length_m: [10, 10]
  note: Largest known specimen, up to about 10 m long; the skull is 27 cm long.
