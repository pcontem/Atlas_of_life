fossil_material:
  holotype: DFMMh/FV 291, a disarticulated but associated individual from the Langenberg quarry, Süntel Formation,
    Lower Saxony.
  material: About 650 bones from at least several individuals found in an area of 60–80 m square; most specimens
    are adults.
  completeness: multiple
  exceptional: ''
biology: The 2006 study of bone histology showed that most specimens were adult, supporting insular dwarfism from
  isolation of a sauropod population on an island in the Lower Saxony basin.
