name: Europasaurus
rank: genus
parent: macronaria
incertae_sedis: true
placement_note: Sander et al. (2006) placed it in Macronaria outside Brachiosauridae and Titanosauromorpha; the
  atlas backbone had listed it in Brachiosauridae and PBDB gives Camarasauromorpha; Macronaria is the clade all
  agree on.
authority: Sander et al. 2006
type_species: Europasaurus holgeri
type_species_note: Monotypic genus; the only species is the type.
summary: Europasaurus is a small macronarian sauropod from the Late Jurassic of northern Germany, regarded as an
  island dwarf.
size:
  length_m: null
  note: No body-length figure was read in the sources consulted; it is much smaller than other macronarians.
