fossil_material:
  holotype: Not verified. The four specimens named in the revision cited are CM 572 (H. priscus), CM 879 (H. utterbacki,
    treated as H. priscus), CMNH 10380 (H. delfsi) and MWC 8028 (H. sp.).
  material: Four known specimens, mostly vertebrae; the H. delfsi skeleton is the only one complete enough to mount,
    at the Cleveland Museum of Natural History, with a speculative replica skull because the real skull was not
    found.
  completeness: partial
  exceptional: ''
biology: No behavioural data were read in the sources consulted; the genus occurs in several zones of the Morrison
  Formation.
