type_species_note: Monotypic genus; the only species is the type. It was named Coloradia brevis by Bonaparte in
  1979 and the genus name was replaced because Coloradia was preoccupied.
summary: Coloradisaurus is a massospondylid sauropodomorph from the Late Triassic (Norian) Los Colorados Formation
  of La Rioja Province, Argentina, known from two specimens.
