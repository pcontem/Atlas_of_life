name: Yimenosaurus
rank: genus
parent: sauropodomorpha
incertae_sedis: true
placement_note: The cited Wikipedia revision calls it a plateosaurid, PBDB gives only Prosauropoda, and the atlas
  backbone had listed it with the massospondylids; the analyses behind these placements were not checked.
authority: Bai et al. 1990
type_species: Yimenosaurus youngi
type_species_note: Monotypic genus; the only species is the type.
summary: Yimenosaurus is a large Early Jurassic sauropodomorph from the Fengjiahe Formation of Yunnan, China, known
  from a skull and partial skeletons.
