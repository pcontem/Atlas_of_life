    the skull was long confused with those of Camarasaurus and Brachiosaurus until 1909.
  completeness: multiple
  exceptional: ''
biology: Interpreted as a generalised browser that probably held its head raised; like other diplodocids its tail
  may have been used to make loud cracking sounds or, in a more recent suggestion, as a sensory organ.
