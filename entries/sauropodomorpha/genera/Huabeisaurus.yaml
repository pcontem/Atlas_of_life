fossil_material:
  holotype: Probably HBV-20001, a partially articulated individual from the upper member of the Huiquanpu Formation;
    the number must be confirmed in the naming paper.
  material: Teeth, neck, back, sacral and tail vertebrae, ribs, complete pectoral and pelvic girdles and nearly
    complete limbs from one individual, plus a paratype humerus from a lower layer.
  completeness: near-complete
  exceptional: ''
biology: Remains were found in a fluvial setting and probably belong to a single individual that was partly disarticulated
  before burial.
