name: Liaoningotitan
rank: genus
parent: macronaria
incertae_sedis: true
placement_note: Zhou et al. (2018) found it to be a somphospondylan titanosauriform more derived than Euhelopus,
  Mo et al. (2022) found it unstable and perhaps close to Diamantinasaurus, and Shan (2025) found it a euhelopodid
  (cited Wikipedia revision).
authority: Zhou et al. 2018
type_species: Liaoningotitan sinensis
type_species_note: Monotypic genus; the only species is the type.
summary: Liaoningotitan is a medium-sized titanosauriform sauropod from the Early Cretaceous Yixian Formation of
  Liaoning, China.
size:
  length_m: [10, 10]
  note: Estimate by comparison with Euhelopus in the cited Wikipedia revision (shoulder height about 2 m).
