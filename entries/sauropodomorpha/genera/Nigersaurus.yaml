fossil_material:
  holotype: Not read in the sources consulted; first remains were described in 1976 and more complete material in
    1999.
  material: Skull and skeletal remains from Gadoufaoua, among the most common vertebrate fossils of the area.
  completeness: multiple
  exceptional: ''
biology: Probably a browser that fed with its head close to the ground, replacing its more than 500 teeth about
  every 14 days; its jaw bones are rotated so that all teeth sit at the front.
