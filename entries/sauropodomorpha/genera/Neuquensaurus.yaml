fossil_material:
  holotype: Six caudal vertebrae, MLP Ly 1-6-V-28-1, are the holotype of the species; four lectotypes were chosen
    in 1978.
  material: Fossils described in 1893, early twentieth-century collections and a well preserved partially articulated
    specimen described in 2005.
  completeness: multiple
  exceptional: ''
biology: A derived saltasaurine; its closest relatives were Saltasaurus, Rocasaurus and Bonatitan.
