fossil_material:
  holotype: Not read in the sources consulted; the fossils were found in 1996 in the Yellow Cat Member of the Cedar
    Mountain Formation, eastern Utah.
  material: Skeletal remains from the Yellow Cat Member; a study of 2001 described 115 gastroliths found with a
    Cedarosaurus specimen.
  completeness: partial
  exceptional: Gastroliths (stomach stones) were found with a specimen.
biology: Gastroliths found with a specimen were studied in 2001 by Sanders, Manley and Carpenter; they were mostly
  rounded, the largest being the most irregular.
