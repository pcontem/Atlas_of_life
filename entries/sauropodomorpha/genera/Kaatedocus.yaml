name: Kaatedocus
rank: genus
parent: diplodocoidea
incertae_sedis: true
placement_note: Tschopp, Mateus and Benson (2015) found Kaatedocus to be an advanced diplodocine close to Barosaurus,
  whereas Whitlock and Wilson (2020) found it to be the most basal dicraeosaurid (as summarised by the cited Wikipedia
  revision); the deepest atlas clade they share is Diplodocoidea.
authority: Tschopp and Mateus 2013
type_species: Kaatedocus siberi
type_species_note: Monotypic genus; the only species is the type.
summary: Kaatedocus is a comparatively small flagellicaudatan sauropod known from a skull and neck found in the
  Morrison Formation of Wyoming.
size:
  length_m: [14, 14]
  note: Single estimate for the type individual (Wikipedia revision cited); the skull and neck together are about
    3.8 m long.
