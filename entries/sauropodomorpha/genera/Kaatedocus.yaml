fossil_material:
  holotype: Probably SMA 004, an exceptionally complete neck with skull from the Howe-Stephens Quarry, Wyoming;
    the number must be checked against the naming paper.
  material: Skull and cervical vertebrae from the lower Morrison Formation; a skull from the earlier Howe Quarry
    (AMNH FARB 7530) was re-assigned to the genus in 2015.
  completeness: partial
  exceptional: ''
biology: The neck had at least 14 vertebrae, a typical number for diplodocids.
