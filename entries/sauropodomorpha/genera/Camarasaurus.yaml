fossil_material:
  holotype: Not read in the sources consulted; named by Cope in 1877.
  material: More than 530 specimens from the Morrison Formation, including nearly complete skeletons; several skeletons
    from the Carnegie Quarry at Dinosaur National Monument.
  completeness: multiple
  exceptional: Skin impressions have been found on one specimen.
biology: Probably a selective feeder that fed at heights of 2–5 m; several specimens show injuries or disease such
  as bite marks and arthritis.
