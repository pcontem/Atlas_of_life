summary: Camarasaurus is the most common sauropod of the Late Jurassic Morrison Formation, known from over 530 specimens
  and several nearly complete skeletons.
size:
  length_m: [15, 23]
  note: C. lentus was about 15 m long; C. supremus, too incomplete for a precise figure, would reach almost 23 m
    if proportioned like the smaller species (cited Wikipedia revision).
