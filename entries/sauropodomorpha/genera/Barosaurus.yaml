fossil_material:
  holotype: Four caudal vertebrae found in 1889 in South Dakota; later excavations recovered vertebrae and limb
    bones of the same individual. The specimen number was not read in the sources consulted.
  material: Specimens from the Morrison Formation of Utah and Montana, plus possible remains from Colorado, Wyoming
    and Oklahoma; a mounted skeleton of about 27.5 m is displayed at the Royal Ontario Museum.
  completeness: multiple
  exceptional: A skin impression is known (see the gallery).
biology: Known from the Kimmeridgian of the Morrison Formation, about 152–150 Ma, where it lived alongside other
  giant sauropods.
