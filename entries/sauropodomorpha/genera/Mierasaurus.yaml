fossil_material:
  holotype: UMNH.VP.26004, a partial skeleton with a disarticulated skull and mandible, teeth, many vertebrae, a
    partial forelimb and a complete left hindlimb, from the Cedar Mountain Formation.
  material: Two juvenile elements are also referred (a lower jaw, UMNH.VP.26010, and a femur, UMNH.VP.26011).
  completeness: partial
  exceptional: ''
biology: Its feet lie deeper in the sediment than the other bones, suggesting that it died after being mired in
  soft mud.
