fossil_material:
  holotype: A skeleton found in June 1965 by a Polish-Mongolian expedition, now in Ulaanbaatar (catalogue number
    MPC-D100/...); the full number was not read.
  material: The holotype lacks the neck and skull; two much less complete specimens are known, including a shoulder
    blade and coracoid (ZPAL MgD-I/25c).
  completeness: partial
