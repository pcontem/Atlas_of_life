fossil_material:
  holotype: ULBRA-PVT280, found in 2009 in the Buriol ravine at São João do Polêsine, Brazil - a single skeleton
    with parts of the skull, vertebrae, left forelimb and left hindlimb.
  material: Further well-preserved specimens were described in 2018; the braincase of CAPPA/UFSM 0035 was described
    in 2020.
  completeness: partial
  exceptional: ''
biology: It superficially resembles predatory theropods, with finely serrated, slightly curved teeth, but has sauropodomorph
  traits such as a downturned jaw tip and a long deltopectoral crest on the humerus.
