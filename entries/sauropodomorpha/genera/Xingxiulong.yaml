fossil_material:
  holotype: Not read in the sources consulted. X. chengi is based on three specimens from Sankeshu Village, Lufeng
    County; X. yueorum has the holotype LF2015-NO01 (Zhangjiaao Member).
  material: Three specimens of X. chengi (two adults and an immature individual) that together form a mostly complete
    skeleton; a partial articulated skeleton of X. yueorum.
  completeness: multiple
  exceptional: ''
biology: The authors of the Wikipedia revision note that, unlike sauropods, it may still have been bipedal.
