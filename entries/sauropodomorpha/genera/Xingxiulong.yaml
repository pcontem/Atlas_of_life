type_species_note: Named by Wang et al. in 2017; a second species, X. yueorum, was named in 2025.
summary: Xingxiulong is a bipedal basal sauropodiform from the Early Jurassic Lufeng Formation of Yunnan, China,
  with two species.
size:
  length_m: [4, 5]
  note: Adults of X. chengi, 1-1.5 m tall at the hip (Wikipedia revision); X. yueorum was larger.
