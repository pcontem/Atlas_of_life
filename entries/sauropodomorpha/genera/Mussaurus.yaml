fossil_material:
  holotype: Not read in the sources consulted; the first nest with juveniles was described by Bonaparte and Vince
    in 1979.
  material: Numerous specimens of varying age from one locality, juveniles to adults; adults were first described
    in 2013.
  completeness: multiple
  exceptional: A nest with eggs and hatchlings; many ages together at one site.
biology: Young were small quadrupeds and adults medium-sized bipeds. Many specimens of different ages at one locality
  suggest it was one of the earliest dinosaurs to live in groups.
