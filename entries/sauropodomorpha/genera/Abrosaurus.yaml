name: Abrosaurus
rank: genus
parent: macronaria
incertae_sedis: true
placement_note: Originally described as a camarasaurid and now seen as a basal macronarian (cited Wikipedia revision);
  PBDB places it in Mamenchisauridae, so only Macronaria is used.
authority: Ouyang 1989
type_species: Abrosaurus dongpoensis
type_species_note: Monotypic genus; the only species is the type.
summary: Abrosaurus is a small macronarian sauropod known from a skull from the Middle Jurassic Dashanpu quarry
  of Sichuan, China.
size:
  length_m: [9.1, 9.1]
  note: Given as no more than about 9.1 m; an upper bound in the cited Wikipedia revision.
