name: Sauroposeidon
rank: genus
parent: macronaria
incertae_sedis: true
placement_note: First described as a brachiosaurid close to Brachiosaurus and Giraffatitan, but later specimens
  from the Cloverly Formation suggested closer ties to titanosaurs within Somphospondyli (as summarised by the cited
  Wikipedia revision; PBDB gives Somphospondyli).
authority: Wedel et al. 2000
type_species: Sauroposeidon proteles
type_species_note: Monotypic genus; the only species is the type.
summary: Sauroposeidon is a gigantic long-necked sauropod from the Early Cretaceous of the southern United States.
