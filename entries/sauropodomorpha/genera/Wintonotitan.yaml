name: Wintonotitan
rank: genus
parent: macronaria
incertae_sedis: true
placement_note: Hocknull et al. (2009) found it to be a non-titanosaurian titanosauriform and several later analyses
  agree (cited Wikipedia revision); the atlas has no clade for Titanosauriformes, so Macronaria is used.
authority: Hocknull et al. 2009
type_species: Wintonotitan wattsi
type_species_note: Spelled wattsii in the cited Wikipedia revision; PBDB has wattsi.
summary: Wintonotitan is a titanosauriform sauropod from the Cenomanian Winton Formation of Queensland, Australia,
  known from partial postcranial remains.
