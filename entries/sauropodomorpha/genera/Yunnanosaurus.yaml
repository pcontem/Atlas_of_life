fossil_material:
  holotype: Not read for the type species. The holotype of Y. youngi, CXMVZA 185, has ten neck, fourteen back and
    seventeen tail vertebrae, three fused sacrals, both pubes, both ischia and the right ilium (Fengjiahe Formation,
    Yuanmou County).
  material: Skeletons from the Lufeng Formation and, for Y. youngi, the Fengjiahe Formation.
  completeness: multiple
  exceptional: ''
biology: A moderately built, ground-dwelling quadrupedal herbivore that could also walk on two legs.
