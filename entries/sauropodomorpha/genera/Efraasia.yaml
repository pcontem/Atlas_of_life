name: Efraasia
rank: genus
parent: sauropodomorpha
incertae_sedis: true
placement_note: The cited Wikipedia revision says modern analyses recover it as a basal sauropodomorph, a little
  more derived than Thecodontosaurus but less than Plateosaurus; PBDB gives no family. The atlas queue had listed
  it under Plateosauridae.
authority: Galton 1973
type_species: Efraasia minor
type_species_note: The only valid species since 2003 (Wikipedia revision); the genus name was given in 1973 by Galton
  for Efraasia diagnostica.
summary: Efraasia is a lightly built basal sauropodomorph from the Late Triassic (Norian) of Germany, named from
  material first assigned to three other genera.
size:
  length_m: [6, 7]
  note: Adult length; Yates (2003) estimated 6.5 m. The most complete fossils are of juveniles 2-3 m long (Wikipedia
    revision).
