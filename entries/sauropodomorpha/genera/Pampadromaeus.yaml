fossil_material:
  holotype: ULBRA-PVT016, a disarticulated but well preserved partial skeleton of one individual (Alemoa Member,
    "Janner" locality).
  material: Known from the holotype only, with most skull bones and lower jaws, dorsal, sacral and tail vertebrae,
    shoulder girdle and forelimb elements, an ilium and hindlimb elements.
  completeness: partial
  exceptional: ''
biology: Some traits are shared with theropods, such as a downturned premaxilla and unserrated front teeth; its
  skull suggests that the pneumatisation of archosaur groups evolved independently at least three times.
