fossil_material:
  holotype: Not read in the sources consulted; the genus was named by H. von Meyer in 1837 from fossils found in
    1834 by J. F. Engelhardt.
  material: Remains of well over 100 individuals from sites across Europe, notably near Halberstadt and Trossingen
    (Germany) and Frick (Switzerland).
  completeness: multiple
  exceptional: ''
biology: A bipedal herbivore with a small skull, a long flexible neck, plump plant-crushing teeth, powerful hind
  limbs and short muscular arms with grasping hands whose large claws may have served for defence and feeding. It
  showed strong developmental plasticity, with adult size varying widely.
