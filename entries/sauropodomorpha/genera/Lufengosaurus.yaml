fossil_material:
  holotype: IVPP V15 (L. huenei), a nearly complete skeleton with a well-preserved skull.
  material: Many specimens from the Lufeng Formation, among them eggs with embryos.
  completeness: multiple
  exceptional: Preserved collagen reported by Lee et al. (2017); eggs with embryos described by Reisz et al. (2013).
biology: Its skull was redescribed in 2005 by Barrett and colleagues, which established it as a valid genus separate
  from Massospondylus and Yunnanosaurus.
