type_species_note: The type species is L. huenei; its holotype was named by Young in 1941 (Wikipedia revision).
  Check the species list - most authors treat L. magnus as a junior synonym of L. huenei.
summary: Lufengosaurus is a massospondylid sauropodomorph from the Early Jurassic of Yunnan, China, known from many
  specimens including nearly complete skeletons.
