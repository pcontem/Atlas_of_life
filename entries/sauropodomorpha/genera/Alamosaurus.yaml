fossil_material:
  holotype: USNM 10486, a left scapula found in 1921 in the Naashoibito Member of the Ojo Alamo Formation, New Mexico;
    the paratype is the right ischium USNM 10487.
  material: Many isolated vertebrae and limb bones from the Maastrichtian of New Mexico, Texas and Utah; some of
    these may belong to a distinct genus.
  completeness: fragmentary
  exceptional: ''
biology: One of the geologically youngest specimens is the holotype, in the latest Maastrichtian.
