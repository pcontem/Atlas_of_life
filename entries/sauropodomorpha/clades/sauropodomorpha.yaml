wikipedia: Sauropodomorpha
summary: The long-necked, plant-eating dinosaurs, from small Triassic bipeds to the giant sauropods, and their kin.
diagnosis:
- Saurischian dinosaurs that include the sauropods and the early forms once grouped as "prosauropods"
- The earliest members were small bipeds of 1–2 m that ate meat or a mixed diet, and herbivory soon became the rule
- A trend towards larger body size, longer necks and quadrupedal posture, ending in the sauropods
notes: Named by Friedrich von Huene in 1932, who split it into the basal Prosauropoda and the giant Sauropoda. Analyses
  since the 2000s place Sauropoda inside a paraphyletic "Prosauropoda", so that name is no longer used as a natural
  group; the early forms are placed in several families that arose from one lineage. Sauropodomorpha is the sister
  group of Theropoda within Saurischia, although a small minority of authors have grouped it with Ornithischia.
  The oldest known members come from the Late Triassic Ischigualasto Formation, and the group ended with the non-avian
  dinosaurs 66 million years ago. Remains are known from every continent, including Antarctica.
