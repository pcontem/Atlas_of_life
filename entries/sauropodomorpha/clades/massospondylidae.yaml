id: massospondylidae
name: Massospondylidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Massospondylidae, family), downloaded 2026-11-16
parent: sauropodomorpha
wikipedia: Massospondylidae
summary: Early massopod sauropodomorphs of the Late Triassic and Early Jurassic, found on most continents including
  Antarctica.
diagnosis:
- Stem-based group defined by Sereno as all animals closer to Massospondylus carinatus than to Plateosaurus engelhardti
  and Saltasaurus loricatus
- Known from Asia, Africa, North and South America and Antarctica
- Late Triassic to Early Jurassic
notes: First named by Friedrich von Huene in 1914. Apaldetti and colleagues (2011) found Adeopapposaurus, Coloradisaurus,
  Glacialisaurus, Massospondylus, Leyesaurus and Lufengosaurus to be massospondylids, but Sarahsaurus, Seitaad and
  Ignavusaurus outside it. In 2019 a South African specimen assigned to Massospondylus was moved to the new genus
  Ngwevu.
