parent: macronaria
wikipedia: Brachiosauridae
summary: Very large, long-necked sauropods with spoon-shaped teeth, such as Brachiosaurus.
diagnosis:
- Quadrupedal herbivores, generally very large, with long necks that reached tall trees
- Broad, thick, spoon-shaped teeth, with the maxillary teeth twisted at the tip
- Dorsal vertebrae with rod-like transverse processes and an ischium with a short pubic peduncle
notes: Named by Elmer Riggs in 1904. Defined as all titanosauriforms closer to Brachiosaurus than to Saltasaurus.
  It is one of the three main groups of Titanosauriformes, with Euhelopodidae and Titanosauria. The group was widespread
  on northern and southern continents in the Jurassic, and its range shrank in the Early Cretaceous; it is unclear
  whether that reflects extinction or a poor fossil record. Europasaurus is a possible island dwarf.
