taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Diplodocoidea, unranked clade), downloaded 2026-11-16
parent: sauropoda
wikipedia: Diplodocoidea
summary: Whip-tailed sauropods that include some of the longest animals known, such as Diplodocus and Supersaurus.
diagnosis:
- Most members had very long necks and long, whip-like tails
- Dicraeosaurids are the only known sauropods in which a short neck re-evolved
- Highest tooth replacement rates known in any vertebrate, as in Nigersaurus
notes: Named by Paul Upchurch in 1995. A study of snout shape and tooth microwear suggests that square-snouted forms
  such as Apatosaurus, Diplodocus, Nigersaurus and Rebbachisaurus browsed non-selectively near the ground, while
  the narrow-snouted Dicraeosaurus, Suuwassea and Tornieria fed more selectively at mid height.
