id: sauropodiformes
name: Sauropodiformes
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Sauropodiformes, unranked clade), downloaded 2026-11-16
parent: sauropodomorpha
wikipedia: Sauropodiformes
summary: Sauropodomorphs made up of the true sauropods and their closest relatives outside that group.
diagnosis:
- 'Node-based definition of Sereno (2007): the least inclusive clade containing Saltasaurus and Mussaurus'
- 'Stem-based redefinition of McPhee and colleagues (2014): the least inclusive clade containing Saltasaurus but
  not Massospondylus'
- Spans the emergence of very large body size and of quadrupedal posture
notes: Named by Paul Sereno in 2007. McPhee and colleagues changed the definition in 2014 because Mussaurus is unstable
  in the analyses and because the group covers a key evolutionary transition, from the rise of massive size to quadrupedal
  locomotion. The Wikipedia article shows a cladogram from a 2025 study.
