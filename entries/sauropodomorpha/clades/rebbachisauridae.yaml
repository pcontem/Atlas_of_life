id: rebbachisauridae
name: Rebbachisauridae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Rebbachisauridae, unranked clade), downloaded 2026-11-16
parent: diplodocoidea
wikipedia: Rebbachisauridae
summary: Cretaceous diplodocoid sauropods known mostly from fragmentary remains in South America, Africa, North
  America and Europe.
diagnosis:
- Cervical neural spines not divided in two, unlike diplodocids and dicraeosaurids, so the group is considered more
  primitive than those two
- Teeth with low-angle internal wear facets and asymmetrical enamel
- At least some members, such as Nigersaurus, had tooth batteries, a feeding adaptation that arose independently
  three times among dinosaurs
notes: Rebbachisaurus, the first member found, was placed by McIntosh in 1990 in the Diplodocidae; more discoveries
  showed that it and its relatives form their own family. Whitlock defined the subfamilies Nigersaurinae and Limaysaurinae
  in 2011, and a 2015 analysis moved Rebbachisaurus closer to Nigersaurus, so that Rebbachisaurinae replaced Nigersaurinae.
  Khebbashia is a clade inside the family. Central Asian records are uncertain.
