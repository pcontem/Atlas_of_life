id: diplodocinae
name: Diplodocinae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Diplodocinae, unranked clade), downloaded 2026-11-16
parent: diplodocidae
wikipedia: Diplodocinae
summary: The slender, long-necked diplodocids, from the Late Jurassic to the Early Cretaceous of four continents.
diagnosis:
- Subfamily of diplodocids that is the sister group of Apatosaurinae
- Existed about 161.2 to 136.4 million years ago
- Known from North America, Europe, Africa and South America
notes: Genera placed in it include Tornieria, Supersaurus, Leinkupal, Galeamopus, Diplodocus, Barosaurus and Ardetosaurus.
  The Wikipedia article reproduces a cladogram of Diplodocidae after Tschopp, Mateus and Benson (2015).
