id: lognkosauria
name: Lognkosauria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Lognkosauria, unranked clade), downloaded 2026-11-16
parent: titanosauria
wikipedia: Lognkosauria
summary: Giant titanosaurs of the Cretaceous of South America, Africa and possibly Asia, among the heaviest dinosaurs
  known.
diagnosis:
- Wide, unusually thick cervical rib loops and a relatively narrow neural canal
- Huge vaulted neural arches and very wide dorsal vertebrae with wing-like side processes
- Extremely wide rib cage
notes: Named by Calvo and colleagues in 2007. Members include Futalognkosaurus, Notocolossus, Drusilasaura and Traukutitan.
