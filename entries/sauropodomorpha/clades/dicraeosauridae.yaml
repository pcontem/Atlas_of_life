parent: diplodocoidea
wikipedia: Dicraeosauridae
summary: Short-necked diplodocoids, the sister group of the diplodocids, found in South America, Africa and North
  America.
diagnosis:
- Relatively short neck, unusual among sauropods
- Sister group of Diplodocidae within Flagellicaudata
- Members found in North America, Africa and South America, from the Early or Middle Jurassic to the Early Cretaceous
notes: 'The group was first described by Werner Janensch in 1914 with Dicraeosaurus from Tanzania. The Asian taxa
  Lingwulong and Tharosaurus have been suggested as dicraeosaurids, but some authors disagree. The position of Suuwassea,
  the only North American member, is disputed: some analyses place it in Diplodocidae or at the base of Diplodocoidea.
  Amargasaurus is among the youngest members.'
