taxon_rank_source: Paleobiology Database taxonomy (taxon Diplodocidae, unranked clade), downloaded 2026-11-16
parent: diplodocoidea
wikipedia: Diplodocidae
summary: Long-necked, long-tailed sauropods of the Late Jurassic, including some of the longest animals ever to
  walk the Earth.
diagnosis:
- Among the longest sauropods thanks to very long necks and tails; some species reached 30 m or more
- Nasal openings at the top of the skull, although the fleshy nostrils sat lower on the snout
- Neck typically of 15 vertebrae
notes: Named by Othniel Charles Marsh in 1884. The largest members, such as Supersaurus and Apatosaurus, may have
  approached 40 tonnes, while the South American Leinkupal laticauda was only about 9 m long. A 2006 study found
  no evidence for a trunk in Diplodocus. Diplodocidae is split into the subfamilies Apatosaurinae and Diplodocinae.
