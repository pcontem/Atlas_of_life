id: sauropoda
name: Sauropoda
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Sauropoda, unranked clade), downloaded 2026-11-16
parent: sauropodiformes
wikipedia: Sauropoda
summary: The giant long-necked, four-legged plant-eaters, which include the largest animals that ever lived on land.
diagnosis:
- Very long neck and tail with a small head compared with the body
- Four thick, pillar-like legs
- Some members reached enormous size; the group includes the largest known land animals
notes: Named by Othniel Charles Marsh in 1878. The oldest unequivocal sauropods come from the Early Jurassic; Isanosaurus
  and Antetonitrus were first described as Triassic sauropods, but their age (and, for Antetonitrus, sauropod status)
  was later questioned. Sauropod-like tracks from the Late Triassic of Greenland may point to an earlier origin.
  By the Late Jurassic, about 150 million years ago, sauropods were widespread.
