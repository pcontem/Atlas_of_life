id: turiasauria
name: Turiasauria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Turiasauria, unranked clade), downloaded 2026-11-16
parent: sauropoda
wikipedia: Turiasauria
summary: Eusauropods of the Middle Jurassic to Early Cretaceous of Europe, North America and Africa, with heart-shaped
  teeth.
diagnosis:
- Eusauropods closer to Turiasaurus riodevensis than to Saltasaurus loricatus
- Heart-shaped teeth, considered a synapomorphy
- Vertical neural spines
notes: Erected by Royo-Torres and colleagues in 2006 for Turiasaurus, Galvesaurus and Losillasaurus from the Villar
  del Arzobispo Formation of Spain; their analysis put the group outside Neosauropoda. Later finds extended it to
  North America, Africa, Madagascar and India, and suggest an origin in Gondwana in the Middle Jurassic. A tooth
  from the Early Jurassic Hasle Formation of Denmark may be a turiasaur.
