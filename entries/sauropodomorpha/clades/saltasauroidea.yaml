id: saltasauroidea
name: Saltasauroidea
rank: clade
taxon_rank: superfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Saltasauroidea, superfamily), downloaded 2026-11-16
parent: titanosauria
wikipedia: Saltasauroidea
summary: A superfamily of titanosaurs uniting the aeolosaurins and saltasaurids and some intermediate genera.
diagnosis:
- Defined by Carballido and colleagues (2022) as all taxa closer to Saltasaurus than to Patagotitan
- Sister group of Colossosauria within Eutitanosauria
- Contains Saltasauridae and Nemegtosauridae, with Aeolosaurini inside it or close to it
notes: França and colleagues used the name in 2016 for a clade of Aeolosaurini, Saltasauridae and the genera Baurutitan,
  Diamantinasaurus and Isisaurus, without discussing it; Carballido and colleagues supported it in 2022 as a useful
  way to subdivide titanosaurs.
