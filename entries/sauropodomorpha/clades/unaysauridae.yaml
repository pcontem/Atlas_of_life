id: unaysauridae
name: Unaysauridae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Unaysauridae, unranked clade), downloaded 2026-11-16
parent: sauropodomorpha
wikipedia: Unaysauridae
summary: Late Triassic early sauropodomorphs from Brazil, India and Zimbabwe, among the oldest long-necked forms.
diagnosis:
- Defined by Müller and colleagues (2018) as the most inclusive clade with Unaysaurus tolentinoi but not Plateosaurus
  engelhardti or Saltasaurus loricatus
- Expanded cranial part of the medial condyle of the astragalus
- Promaxillary fenestra in the skull
notes: Placed as the sister of Plateosauria by Müller and colleagues. Unaysaurus and Jaklapallisaurus had earlier
  been assigned to Plateosauridae, and Beccari and colleagues (2021) questioned the validity of Unaysauridae, finding
  Unaysaurus and Macrocollum inside Plateosauridae.
