id: macronaria
name: Macronaria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Macronaria, unranked clade), downloaded 2026-11-16
parent: sauropoda
wikipedia: Macronaria
summary: Sauropods with a large nasal opening, a group that includes camarasaurids, brachiosaurids and titanosaurs.
diagnosis:
- External naris larger than the eye socket, which gave the clade its name
- Robust, spatulate, broad-crowned teeth
- Relatively long forelimbs compared with the hind limbs, clearest in brachiosaurs
notes: 'Named by Sereno in 1997 and used by Wilson and Sereno in 1998 to split Neosauropoda into Macronaria and
  the outgroup Diplodocoidea. Macronarians lived from the Middle Jurassic (Bathonian) to the Late Cretaceous (Maastrichtian)
  and are known from every continent except Antarctica in the sources cited, including Argentina, the United States,
  Portugal, China and Tanzania. They were not all giants: the group includes small forms.'
