parent: macronaria
wikipedia: Euhelopodidae
summary: Sauropods of disputed membership centred on Euhelopus and its close relatives, mostly from East Asia.
diagnosis:
- Contains Euhelopus and its close relatives, most of them from East Asia
- 'Phylogenetic definition of D''Emic (2012): neosauropods closer to Euhelopus zdanskyi than to Neuquensaurus australis'
notes: 'Carl Wiman recognised the group in 1929 as Helopodidae, a name already used for a bird, so Romer proposed
  Euhelopus and Euhelopodinae in 1956 as replacements. Its affinities are debated: some studies place Euhelopus
  near titanosaurs in Somphospondyli, and others find it close to mamenchisaurids. A study by Wilson and Upchurch
  concluded that it was closely related to titanosaurs. The 2021 description of Silutitan placed that genus as the
  sister of Euhelopus.'
