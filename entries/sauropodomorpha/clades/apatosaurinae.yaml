id: apatosaurinae
name: Apatosaurinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Apatosaurinae, subfamily), downloaded 2026-11-16
parent: diplodocidae
wikipedia: Apatosaurinae
summary: The stocky, shorter-necked diplodocids, certainly Apatosaurus and Brontosaurus, from the Morrison Formation.
diagnosis:
- More robust, stockier build and proportionally shorter neck than other diplodocids
- Two genera certain, Apatosaurus and Brontosaurus (2015 study); Amphicoelias and a species of Atlantosaurus may
  also belong
- All members known from the Late Jurassic Morrison Formation of the western United States, about 157 to 146.8 million
  years ago
notes: Fossils were first found in 1877 by crews working for Othniel Charles Marsh. Several fairly complete specimens
  give a good view of the anatomy of the group.
