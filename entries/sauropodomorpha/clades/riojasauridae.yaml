id: riojasauridae
name: Riojasauridae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Riojasauridae, unranked clade), downloaded 2026-11-16
parent: sauropodomorpha
wikipedia: Riojasauridae
summary: Late Triassic sauropodomorphs of South Africa and Argentina, comprising Riojasaurus and Eucnemesaurus.
diagnosis:
- Defined as the most inclusive clade with Riojasaurus incertus but not Plateosaurus engelhardti, Massospondylus
  carinatus or Anchisaurus polyzelus
- Stem taxon of non-sauropod sauropodomorphs, smaller than the later sauropods
- Late Carnian to Norian
notes: Named by Yates in 2007. Riojasaurus comes from the Los Colorados Formation of La Rioja, Argentina, and Eucnemesaurus
  from the lower Elliot Formation of South Africa. Yates (2007) recovered the family as the earliest branch of Massopoda;
  a 2020 analysis placed it closer to Sauropoda than to Massospondylidae.
