taxon_rank_source: Paleobiology Database taxonomy (taxon Titanosauria, unranked clade), downloaded 2026-11-16
parent: macronaria
wikipedia: Titanosauria
summary: A diverse group of sauropods found on every continent, the last long-necked sauropods and including some
  of the largest land animals known.
diagnosis:
- Last surviving group of long-necked sauropods, still thriving at the end of the Cretaceous
- Fossils on every continent, including Antarctica
- Includes giants such as Patagotitan, Argentinosaurus and Puertasaurus
notes: 'Named by Bonaparte and Coria in 1993; the name alludes to the Titans through Titanosaurus, now considered
  a nomen dubium. Titanosaurs have the least complete fossil record of any major sauropodomorph group: no complete
  skeleton is known, and nearly complete skulls are known for only four genera (Nemegtosaurus, Rapetosaurus, Sarmientosaurus
  and Tapuiasaurus). Some members carried bony osteoderms.'
