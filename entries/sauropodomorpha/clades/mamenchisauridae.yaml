id: mamenchisauridae
name: Mamenchisauridae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Mamenchisauridae, unranked clade), downloaded 2026-11-16
parent: sauropoda
wikipedia: Mamenchisauridae
summary: Jurassic and Early Cretaceous sauropods with extremely long necks, from Asia and Africa, some of them gigantic.
diagnosis:
- Proportionately extremely long necks
- Some members among the largest of all sauropods
- Known from the Jurassic and Early Cretaceous of Asia and Africa
notes: The family was erected by Young and Zhao in 1972 in the description of Mamenchisaurus hochuanensis. A comprehensive
  analysis by Moore and colleagues (2020) recovered Euhelopus and kin, normally regarded as somphospondylians, as
  relatives of mamenchisaurids in some runs. Fossils of Mamenchisaurus and Omeisaurus come from the Shaximiao Formation;
  Wamweracaudia from Tanzania extends the group into Africa, and Siberian and Thai remains suggest a wider range.
