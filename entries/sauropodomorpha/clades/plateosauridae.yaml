id: plateosauridae
name: Plateosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Plateosauridae, family), downloaded 2026-11-16
parent: sauropodomorpha
wikipedia: Plateosauridae
summary: Late Triassic plateosaurian sauropodomorphs of Europe, Greenland, Africa and Asia.
diagnosis:
- Stem-based group defined by Sereno (1998) as all animals closer to Plateosaurus engelhardti than to Massospondylus
  carinatus
- Now restricted to Plateosaurus, Yimenosaurus, Euskelosaurus and Issi
- Recovered as the sister of Massopoda within Plateosauria in a 2017 analysis
notes: Named by Othniel Charles Marsh in 1895. Yates (2003) sank Sellosaurus into Plateosaurus, and Gresslyosaurus
  is either a separate genus or a synonym. Recent analyses suggest that Prosauropoda is a junior synonym of Plateosauridae.
  The 2021 description of Issi saaneq recovered Issi as the sister of Plateosaurus, with Macrocollum and Unaysaurus
  also inside the family.
