wikipedia: Anseriformes
summary: Waterfowl, the screamers, magpie goose, ducks, geese and swans, with about 178 living species.
diagnosis:
- Males (except screamers) have a penis, a trait lost in Neoaves
- Mostly adapted to life on the water surface, with webbed feet
notes: Three living families, Anhimidae, Anseranatidae and Anatidae; fossil Presbyornithidae and possibly the Cretaceous
  vegaviids belong to the group.
