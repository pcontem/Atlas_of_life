wikipedia: Bird
summary: The crown group of birds, the last common ancestor of all living birds and all its descendants.
diagnosis:
- Toothless beaked jaws, hard-shelled eggs and a high metabolic rate
- Very light skeleton with air-filled bones linked to the respiratory system and fused skull bones in adults
notes: The name Aves is used here for the crown group (Neornithes in PBDB); its stem relatives are in the Avialae
  volume. Living birds split into Palaeognathae and Neognathae; neognaths are Galloanserae and Neoaves. This volume
  holds the palaeognaths and Galloanserae; Neoaves will follow in later volumes, and the passerines still sit in
  the tree outline.
