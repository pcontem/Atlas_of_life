parent: aves
wikipedia: Palaeognathae
summary: Tinamous, ratites and their fossil relatives, the sister group of all other living birds.
diagnosis:
- Large vomer joined to the premaxillae and maxillopalatines in front
- Vomer fused behind to the pterygoid, with the palatines fused beneath this joint (Cracraft 1974)
notes: Includes the flying tinamous and lithornithids and the flightless ratites (ostriches, rheas, cassowaries
  and emus, kiwis, moa and elephant birds), whose flightlessness probably evolved several times. Fossil families
  of uncertain position, such as Ergilornithidae, Eremopezidae and Remiornithidae, are placed here as in the cited
  revision.
