summary: Ducks, geese and swans, water birds found on every continent except Antarctica.
diagnosis:
- Broad, elongated body; diving species rounder
- Webbed feet and a flattened bill
notes: Living species range from the cotton pygmy goose (26.5 cm, 164 g) to the trumpeter swan (183 cm, 17.2 kg);
  the extinct flightless Garganornis reached about 22 kg. Subfamilies are not separated in the atlas.
