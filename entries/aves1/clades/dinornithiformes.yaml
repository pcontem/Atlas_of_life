wikipedia: Moa
summary: Moa, extinct giant flightless birds of New Zealand.
diagnosis:
- Spine joined to the back of the skull, so the head was carried forward as in kiwis
- Flightless, with no wings
notes: Nine species in six genera lived in the Late Pleistocene and Holocene; the families Dinornithidae, Emeidae
  and Megalapterygidae are not separated in the atlas. They died out after the arrival of people in New Zealand.
