summary: Ostriches and their extinct relatives, flightless palaeognaths of Africa and formerly Eurasia.
diagnosis:
- Large flightless running birds with a keel-less breastbone
- Two toes on each foot in the living species
notes: The living species are the common and Somali ostriches (Struthio); Pachystruthio of the Late Pliocene and
  Early Pleistocene of Eurasia was among the largest birds ever.
