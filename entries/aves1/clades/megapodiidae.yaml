wikipedia: Megapode
summary: Megapodes or mound-builders, galliforms that incubate their eggs in mounds or pits.
diagnosis:
- Large legs and feet with sharp claws, used to build incubation mounds or pits
- Stocky, medium to large bodies with small heads
notes: Scrubfowl, brush turkeys and malleefowl; the largest are Alectura and Talegalla.
