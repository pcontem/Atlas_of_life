parent: palaeognathae
wikipedia: Lithornithidae
summary: Extinct flying palaeognaths of the Paleocene and Eocene of North America and Europe, similar to tinamous.
diagnosis:
- Long slender probing bill with a rhynchokinetic skull and fairly unfused cranial bones
- Weakly fused pygostyle and a splenial bone; wings better developed than in tinamous
notes: Possibly paraphyletic; the youngest specimen comes from the mid-Eocene Messel Pit, and Late Cretaceous members
  are possible.
