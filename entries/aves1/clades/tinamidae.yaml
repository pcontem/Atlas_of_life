parent: palaeognathae
wikipedia: Tinamou
summary: Tinamous, plump ground birds of Central and South America and the only flying living palaeognaths.
diagnosis:
- Plump compact body with a slender neck, small head and usually short down-curved bill
- Three forward toes, with the hind toe raised or missing; females usually larger than males
notes: 46 living species in two subfamilies; sizes run from the 43 g dwarf tinamou to the grey tinamou of up to
  2 kg and 49 cm.
