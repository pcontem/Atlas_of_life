wikipedia: Galliformes
summary: Landfowl, heavy-bodied ground birds with about 290 living species, from quails to turkeys.
diagnosis:
- Rounded body and short, rounded wings for short flights
- Anisodactyl feet, and backward spurs in some adult males
notes: Five living families (Megapodiidae, Cracidae, Numididae, Odontophoridae, Phasianidae); sizes range from 15
  to 120 cm. Fossil stem galliforms such as Gallinuloididae and Quercymegapodiidae are placed directly in the order.
