summary: Extinct long-legged waterfowl from the Late Cretaceous to the Early Miocene.
diagnosis:
- Mix of features once linking them to shorebirds and flamingos
- Now accepted as waterfowl close to ducks, geese and screamers
notes: Found in North America, South America, East Asia, Australia and possibly North Africa; Teviornis from the
