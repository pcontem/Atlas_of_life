summary: Chachalacas, guans and curassows, large tropical galliforms of the Americas.
diagnosis:
- Large, turkey-like birds, many fairly long-tailed
- Mostly dull plumage, with colourful facial ornaments in curassows and some guans
notes: Guans and curassows live in trees, the smaller chachalacas in more open scrub; the family is very vocal.
