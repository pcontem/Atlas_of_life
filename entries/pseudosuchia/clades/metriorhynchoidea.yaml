id: metriorhynchoidea
name: Metriorhynchoidea
rank: clade
taxon_rank: superfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Metriorhynchoidea, superfamily), downloaded 2026-11-16
parent: thalattosuchia
wikipedia: Metriorhynchoidea
summary: Thalattosuchians closer to Metriorhynchus than to teleosaurs, culminating in the fully marine metriorhynchids.
diagnosis:
- Largest clade within Thalattosuchia containing Metriorhynchus but not Teleosaurus or Macrospondylus (PhyloCode
  definition, 2024)
- Derived members (Euthalattosuchia) with skull and skeleton adapted to a fully marine life
notes: Named by Fitzinger (1843). Includes basal forms such as Teleidosaurus, Zoneait and Eoneustes, and the family
  Metriorhynchidae; ranges from the Toarcian to the Valanginian, possibly the Aptian.
