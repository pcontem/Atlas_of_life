diagnosis: ['Small, paddle-like forelimbs', No osteoderms, A shark-like tail fluke]
notes: Named by Fitzinger (1843); subfamilies Metriorhynchinae and Geosaurinae. Phylogenetic studies of the 2000s
  showed that several traditional genera (Geosaurus, Dakosaurus, Cricosaurus) were not natural groups and split
  them.
