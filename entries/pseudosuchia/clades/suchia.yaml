id: suchia
name: Suchia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Suchia, unranked clade), downloaded 2026-11-16
parent: pseudosuchia
wikipedia: Suchia
summary: 'Nearly all pseudosuchians: aetosaurs, gracilisuchids, poposauroids, "rauisuchians" and crocodylomorphs,
  leaving out ornithosuchids.'
diagnosis:
- Least inclusive clade containing Aetosaurus, Rauisuchus, Prestosuchus and Crocodylus (definition, Nesbitt 2011)
- A distinctive postorbital–squamosal bar between the upper and lower temporal openings, the single synapomorphy
  listed by Sereno (1991)
notes: Formalized by Krebs (1974) as an order of crurotarsal reptiles linking Triassic pseudosuchians with crocodilians.
  Benton and Clark (1988) listed many diagnostic traits, but Sereno (1991) showed most also occur in ornithosuchids,
  phytosaurs or avemetatarsalians. Ornithosuchidae is usually the only pseudosuchian group outside it.
