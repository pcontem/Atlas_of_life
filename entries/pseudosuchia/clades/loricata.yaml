id: loricata
name: Loricata
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Loricata, unranked clade), downloaded 2026-11-16
parent: paracrocodylomorpha
wikipedia: Loricata
summary: Crocodylomorphs and most "rauisuchians" — large, mostly quadrupedal Triassic predators such as Prestosuchus
  and Postosuchus.
diagnosis:
- Includes Crocodylomorpha and the large carnivorous "rauisuchians" that form its stem (Nesbitt 2011)
- Mostly quadrupedal predators with pillar-erect hips, in contrast to the varied poposauroids
notes: The name goes back to Merrem (1820), who used it for crocodilians; Nesbitt (2011) revived it for the clade
  of crocodylomorphs and rauisuchians, the sister group of Poposauroidea within Paracrocodylomorpha.
