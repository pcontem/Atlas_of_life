parent: alligatoridae
wikipedia: Alligatorinae
summary: Alligators and their closest extinct relatives; only the genus Alligator survives.
diagnosis:
- Alligator mississippiensis and all species closer to it than to Caiman crocodylus (stem-based definition)
- Sister group of Caimaninae
notes: Alligators and caimans split in North America in the late Cretaceous or early Paleogene; the oldest named
  alligatorine, Mandrasuchus, is earliest Paleocene.
