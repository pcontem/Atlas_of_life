id: mekosuchinae
name: Mekosuchinae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Mekosuchinae, unranked clade), downloaded 2026-11-16
parent: crocodyloidea
wikipedia: Mekosuchinae
summary: Cenozoic crocodilians of Australasia, which survived on Pacific islands until the arrival of humans.
diagnosis:
- Crocodyloids of Australasia closer to Mekosuchus (clade membership)
- Varied skulls, from deep-snouted, blade-toothed land forms such as Quinkana to semi-aquatic hunters
notes: Named by Balouet and Buffetaut (1987). Dominant crocodilians of the region from the Eocene; lasted into the
  Late Pleistocene in Australia and the Holocene in Fiji, New Caledonia and Vanuatu. Placement within Crocodyloidea
  is disputed.
