id: caimaninae
name: Caimaninae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Caimaninae, unranked clade), downloaded 2026-11-16
parent: alligatoridae
wikipedia: Caiman
summary: 'Caimans: Central and South American alligatorids, plus giant extinct forms such as Purussaurus and Mourasuchus.'
diagnosis:
- No bony septum between the nostrils
- Belly armour of overlapping scutes made of two sutured parts
- Longer, sharper teeth than alligators
notes: Defined by Brochu (1999) as Caiman crocodylus and all species closer to it than to Alligator. The derived
  clade Jacarea holds the living Caiman and Melanosuchus.
