id: gavialidae
name: Gavialidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Gavialidae, family), downloaded 2026-11-16
parent: gavialoidea
wikipedia: Gavialidae
summary: 'Gharials and false gharials: crocodilians with long, narrow snouts, with many extinct relatives.'
diagnosis:
- Very long, slender snout
- Webbed feet and nearly equal teeth (features used by Adams 1854)
- Crown group of the gharial and the false gharial
notes: Proposed by Adams (1854). Molecular studies place the false gharial (Tomistoma) with the gharial, so Gavialidae
  now includes tomistomines; gryposuchines are also usually included. The recently extinct Hanyusuchus belongs here.
