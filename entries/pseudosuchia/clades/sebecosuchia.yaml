id: sebecosuchia
name: Sebecosuchia
rank: clade
taxon_rank: suborder
taxon_rank_source: Paleobiology Database taxonomy (taxon Sebecosuchia, suborder), downloaded 2026-11-16
parent: notosuchia
wikipedia: Sebecosuchia
summary: 'Deep-snouted, land-living crocodyliforms with serrated teeth: baurusuchids and sebecids.'
diagnosis:
- Deep, laterally compressed snout
- Ziphodont teeth (serrated and laterally compressed)
- External nostrils at the tip of the snout, suggesting life on land
notes: Constructed by Simpson (1937) and used by Colbert (1946) for Sebecus and Baurusuchidae. Razanandrongobe pushes
  its origin to the Middle Jurassic; sebecids lasted to the late Miocene or early Pliocene in the Greater Antilles.
