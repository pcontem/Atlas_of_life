id: revueltosauridae
name: Revueltosauridae
rank: clade
taxon_rank: family
taxon_rank_source: English Wikipedia, “Revueltosaurus”, revision 1374681074 (family Revueltosauridae of the genus
  Revueltosaurus; no PBDB record)
parent: suchia
wikipedia: Revueltosaurus
summary: Small Late Triassic suchians built around Revueltosaurus, long mistaken for early ornithischian dinosaurs
  because of their teeth.
diagnosis:
- Leaf-shaped teeth like those of early ornithischians
- Body armour of osteoderms, possibly forming a tail club at the end of the tail
notes: Revueltosaurus is placed at the base of Suchia as the sister group of aetosaurs (Parker 2005, 2022). Skeletons
  showed that it is a pseudosuchian, which removed most supposed Triassic ornithischians known only from teeth.
  In the tree it sits in Suchia, beside Aetosauria (docs/TREE_REVIEW.md).
