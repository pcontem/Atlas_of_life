taxon_rank_source: Paleobiology Database taxonomy (taxon Baurusuchidae, unranked clade), downloaded 2026-11-16
parent: sebecosuchia
wikipedia: Baurusuchidae
summary: Late Cretaceous hypercarnivorous land crocodyliforms of South America and Asia.
diagnosis:
- Deep snout with ziphodont teeth
- Enlarged, canine-like lower tooth fitting a deep notch in the upper jaw
- Curved tooth row
notes: Named by Price (1945). Defined under the PhyloCode as the least inclusive clade containing Cynodontosuchus,
  Pissarrachampsa and Baurusuchus; subfamilies Baurusuchinae and Pissarrachampsinae have been proposed.
