id: pholidosauridae
name: Pholidosauridae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Pholidosauridae, unranked clade), downloaded 2026-11-16
parent: neosuchia
wikipedia: Pholidosauridae
summary: Aquatic Middle Jurassic–Paleocene neosuchians, including the giant Sarcosuchus.
diagnosis:
- Aquatic neosuchians, usually closest to Dyrosauridae
- Some reached very large sizes (Sarcosuchus up to about 9.5 m)
notes: Named by von Zittel and Eastman (1902). Whether it is monophyletic, or paraphyletic with respect to Dyrosauridae,
  is unresolved. Suchosaurus, once placed here, is a spinosaurid dinosaur.
