wikipedia: Pseudosuchia
summary: 'The crocodile line of archosaurs: living crocodilians and every archosaur closer to them than to birds.'
diagnosis:
- Archosaurs more closely related to crocodilians than to birds (branch-based definition)
- Often a massively built skull with a narrow, elongated snout and a short, strong neck
- Body usually protected by two or more rows of bony scutes (osteoderms) along the back
notes: Named by Zittel (1887–1890) for a few crocodile-like Triassic reptiles; now used as the stem-based name for
  the whole crocodile line, the sister group of Avemetatarsalia. Crurotarsi, a node-based name built around phytosaurs,
  covers nearly the same animals if phytosaurs are pseudosuchians. Triassic pseudosuchians were far more varied
  than today's crocodilians, including armoured herbivores, sail-backed forms and bipeds; only crocodylomorphs survived
  the end of the Triassic.
