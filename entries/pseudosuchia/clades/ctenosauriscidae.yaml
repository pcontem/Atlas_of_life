id: ctenosauriscidae
name: Ctenosauriscidae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Ctenosauriscidae, unranked clade), downloaded 2026-11-16
parent: poposauroidea
wikipedia: Ctenosauriscidae
summary: Early to Middle Triassic poposauroids with tall "sails" of elongated neural spines on their backs.
diagnosis:
- Large sail formed by elongated neural spines
- Poposauroids closer to Ctenosauriscus than to Poposaurus (stem-based definition, Butler et al. 2011)
notes: Named by Kuhn (1964). Known from Africa, Asia, Europe and North America (latest Olenekian to Anisian); among
  the earliest archosaurs, representing the first global radiation of the group. Lotosaurus has been found close
  to them.
