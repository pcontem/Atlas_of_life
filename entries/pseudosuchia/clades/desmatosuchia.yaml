id: desmatosuchia
name: Desmatosuchia
rank: clade
taxon_rank: suborder
taxon_rank_source: Paleobiology Database taxonomy (taxon Desmatosuchia, suborder), downloaded 2026-11-17
parent: aetosauridae
wikipedia: Aetosauria
summary: One of the two main divisions of aetosaurs, including Stagonolepis and the spiny-armoured desmatosuchines.
diagnosis:
- Snout tip expanded sideways into a flattened "shovel" in many members
- Distinguished from Aetosaurinae mainly by skull shape and osteoderm structure
notes: Named by Case (1920). Contains Stagonolepidinae (Stagonolepis, Polesinesuchus) and Desmatosuchinae in the
  cited aetosaur phylogeny. Wikipedia covers it in the Aetosauria article.
