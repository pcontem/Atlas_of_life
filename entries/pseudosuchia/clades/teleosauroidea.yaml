parent: thalattosuchia
wikipedia: Teleosauroidea
summary: 'Jurassic–Early Cretaceous thalattosuchians: the slender, fish-eating teleosaurids and the robust, macropredatory
  machimosaurids.'
diagnosis:
- Largest clade within Thalattosuchia containing Teleosaurus but not Metriorhynchus (PhyloCode definition, 2024)
- Back armour of osteoderms like other crocodyliforms; less specialised for the open sea than metriorhynchoids
notes: 'The superfamily name dates from Saint-Hilaire (1831). Two main families: Teleosauridae and Machimosauridae
  (Johnson et al. 2020).'
