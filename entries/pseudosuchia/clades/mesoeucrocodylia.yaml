id: mesoeucrocodylia
name: Mesoeucrocodylia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Mesoeucrocodylia, unranked clade), downloaded 2026-11-16
parent: crocodyliformes
wikipedia: Mesoeucrocodylia
summary: 'Crocodyliforms that include Eusuchia and the forms once called "Mesosuchia": notosuchians, neosuchians
  and their relatives.'
diagnosis:
- Frontal bones of the skull fused into a single element
- A partial secondary palate formed by the backward extension of the sutured palatine bones
- Ear opening (otic aperture) closed behind by the squamosal bone
notes: Erected to replace the paraphyletic "Mesosuchia" after Benton and Clark (1988) showed Eusuchia nested within
  it. Appears in the Early Jurassic. Whether Thalattosuchia belongs here is disputed; in the tree it sits outside
  (docs/TREE_REVIEW.md). Bronzati et al. (2012) call the Notosuchia + Neosuchia clade Metasuchia.
