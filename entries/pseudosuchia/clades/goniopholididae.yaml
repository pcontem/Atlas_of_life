id: goniopholididae
name: Goniopholididae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Goniopholididae, family), downloaded 2026-11-16
parent: neosuchia
wikipedia: Goniopholididae
summary: Medium-sized, semi-aquatic Laurasian neosuchians that resembled living crocodilians.
diagnosis:
- Back armour of two rows of paired, rectangular osteoderms with peg-and-groove joints
- Belly osteoderms, unlike living crocodilians
notes: Named by Cope (1875). Middle Jurassic to Late Cretaceous of Asia, Europe and North America; the Early Jurassic
  Calsoyasuchus may be the oldest member, but this is disputed.
