id: paracrocodylomorpha
name: Paracrocodylomorpha
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Paracrocodylomorpha, unranked clade), downloaded 2026-11-16
parent: suchia
wikipedia: Paracrocodylomorpha
summary: 'Poposauroids and loricatans: the pseudosuchian branch that leads to crocodilians, together with bipedal
  and sail-backed Triassic relatives.'
diagnosis:
- Least inclusive clade containing Poposaurus and Crocodylus niloticus (definition, Nesbitt 2011)
- 'Two branches: Poposauroidea and Loricata'
notes: Named by Parrish (1993), who found Poposaurus and its relatives closer to crocodylomorphs than to rauisuchids,
  breaking up the old "Rauisuchia". Most of its lineages died out at the end of the Triassic; only crocodylomorphs
  survived.
