id: sebecidae
name: Sebecidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Sebecidae, family), downloaded 2026-11-16
parent: sebecosuchia
wikipedia: Sebecidae
summary: Land crocodiles of the Late Cretaceous and Cenozoic, the last surviving non-crocodilian crocodylomorphs.
diagnosis:
- Least inclusive clade with Sebecus, Bretesuchus, Barinasuchus and Sahitisuchus (PhyloCode definition, 2024)
- Sebecosuchian deep snout and ziphodont teeth (shared with Sebecus)
notes: Apex land predators in South America after the dinosaurs; the Spanish Ogresuchus, once the oldest member,
  may be an atoposaurid (2026 study).
