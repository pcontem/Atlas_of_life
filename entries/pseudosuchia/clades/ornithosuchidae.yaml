id: ornithosuchidae
name: Ornithosuchidae
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Ornithosuchidae, unranked clade), downloaded 2026-11-16
parent: pseudosuchia
wikipedia: Ornithosuchidae
summary: Triassic pseudosuchians with a down-turned snout and an unusual ankle, able to walk on two legs for short
  spells.
diagnosis:
- Distinctive downturned tip of the snout
- A "crocodile-reversed" ankle joint, unique among archosaurs
- Quadrupedal but facultatively bipedal
notes: Named by von Huene (1908). Four genera are known from the Carnian–Norian of Argentina, Brazil and the United
  Kingdom (Ornithosuchus, Venaticosuchus, Dynamosuchus, Riojasuchus). Usually placed near the base of Pseudosuchia;
  definitions by Sereno (1991) and Nesbitt (2011) differ.
