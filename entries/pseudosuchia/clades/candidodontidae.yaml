parent: notosuchia
wikipedia: Candidodontidae
summary: Small Cretaceous notosuchians with distinctive, similar-sized cheek teeth.
diagnosis:
- Large supratemporal fenestrae covering most of the skull roof
- Postcaniniform teeth of similar size and shape
notes: First used in 2002, formally defined in 2004 and redefined in 2009 as a stem-based group including Candidodon,
  Malawisuchus and possibly Mariliasuchus. Added to the tree on 2026-11-16.
