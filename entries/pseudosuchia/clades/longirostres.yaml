id: longirostres
name: Longirostres
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Longirostres, unranked clade), downloaded 2026-11-16
parent: crocodylia
wikipedia: Longirostres
summary: Crocodiles and gharials with their extinct relatives, to the exclusion of alligators and caimans.
diagnosis:
- 'Crown group: the last common ancestor of Crocodylus niloticus and Gavialis gangeticus and all its descendants
  (Harshman et al. 2003)'
- Supported by DNA studies, which found crocodiles closer to gharials than to alligators
notes: Replaces the morphology-based grouping Brevirostres (crocodiles + alligators). Some recent morphological
  analyses agree with the molecular result (Rio and Mannion 2021).
