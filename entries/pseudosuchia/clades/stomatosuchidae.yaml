id: stomatosuchidae
name: Stomatosuchidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Stomatosuchidae, family), downloaded 2026-11-16
parent: neosuchia
wikipedia: Stomatosuchidae
summary: Cenomanian neosuchians of North Africa with flattened, duck-shaped skulls.
diagnosis:
- Flattened, elongate, duck-shaped skull with U-shaped jaws (platyrostral)
- Jaws less strongly bowed than in Mourasuchus
notes: 'Named by Stromer (1925). Two genera: Stomatosuchus, whose only skull was destroyed in World War II, and
  Laganosuchus.'
