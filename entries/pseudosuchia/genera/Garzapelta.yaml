name: Garzapelta
rank: genus
parent: aetosauria
incertae_sedis: true
placement_note: PBDB places it in Stagonolepidoidea; its armour mixes features of the paratypothoracin Rioarribasuchus
  and of desmatosuchines (English Wikipedia), so it is left in Aetosauria without a finer placement here.
authority: Reyes et al. 2024
type_species: Garzapelta muelleri
type_species_note: Monotypic genus; the only species is the type.
summary: Garzapelta is an aetosaur from the Late Triassic Cooper Canyon Formation of Texas, known mainly from associated
  osteoderms.
