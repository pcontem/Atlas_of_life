name: Akanthosuchus
rank: genus
parent: alligatoroidea
incertae_sedis: true
placement_note: An alligatoroid regarded as a possible alligatorine; its position inside Alligatoroidea has not
  been settled.
authority: O'Neill et al. 1981
type_species: Akanthosuchus langstoni
type_species_note: PBDB gives no type species; taken as the only species listed.
summary: Paleocene alligatoroid from New Mexico with unusual spiked and blade-shaped armour plates.
size:
  length_m: null
  note: Moderately sized; the femur of the holotype is 137 mm long, but the specimen may not have been fully grown.
