fossil_material:
  holotype: Not stated in the sources consulted for this draft; the genus was named by Cope in 1867.
  material: Fossils from the Calvert, Peace River and Chandler Bridge formations and other deposits of the eastern
    United States.
  completeness: fragmentary
  exceptional: ''
biology: Like living gharials it had a long, slender snout with interlocking teeth whose shape varied between species,
  but it was marine, living in estuaries and shallow coastal waters.
