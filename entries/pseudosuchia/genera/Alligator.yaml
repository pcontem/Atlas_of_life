fossil_material:
  holotype: Living genus — the name-bearing type of the type species is not covered by the sources used.
  material: Two living species, plus eight fossil species from North America and East Asia.
  completeness: multiple
  exceptional: ''
biology: Lives in fresh and brackish water and tolerates cooler climates than most crocodilians. Kills smaller prey
  with one bite and drowns or "death-rolls" larger prey; walks with a sprawling gait or a belly-off-the-ground "high
  walk".
