fossil_material:
  holotype: Not stated in the sources consulted for this draft; A. wegeneri has the fragmentary type specimen GDF-700
    (Paris), and a more complete specimen, AMNH 24450, is held at the AMNH.
  material: Remains of seven species from Brazil, Argentina, Niger, Cameroon, Tunisia and Madagascar.
  completeness: multiple
  exceptional: ''
biology: Characterised by varied tooth types and distinct skull elements; the sources consulted give no direct evidence
  of diet.
