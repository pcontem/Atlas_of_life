fossil_material:
  holotype: AMNH 6758 - parts of the skull, lower jaw and a complete cervical series, with other bones, from the
    Petrified Forest Member of the Chinle Formation near Cameron, Arizona.
  material: The holotype plus later specimens from Arizona and New Mexico described in the 1980s-2000s literature.
