fossil_material:
  holotype: Von Meyer named it in 1837 from isolated, blunt, conical teeth from Switzerland.
  material: Fossils are known from England, France, Germany, Portugal, Switzerland and Tunisia; an Early Cretaceous
    species was proposed but contested.
  completeness: multiple
  exceptional: ''
biology: Blunt teeth with many longitudinal lines; M. rex reached an estimated 7.15 m, with a 155 cm skull.
