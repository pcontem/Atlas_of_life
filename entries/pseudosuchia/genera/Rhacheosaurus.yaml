fossil_material:
  holotype: A partial posterior skeleton described by von Meyer in 1831, subsequently lost.
  material: The lost holotype and a referred small, complete skeleton with extensive soft-tissue impressions.
  completeness: partial
  exceptional: A referred skeleton with extensive soft-tissue impressions.
biology: Thought to have specialised in feeding on small prey, with the related long-snouted Cricosaurus feeding
  mostly on fish (English Wikipedia summary).
