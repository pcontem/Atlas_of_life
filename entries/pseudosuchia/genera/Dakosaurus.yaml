fossil_material:
  holotype: Named from an isolated tooth that Plieninger called Geosaurus maximus in 1846; Quenstedt erected the
    genus in 1856.
  material: Fossils come from the Late Jurassic of England, France, Switzerland, Germany, Poland, Russia, Argentina
    and Mexico; teeth are known from the Oxfordian.
  completeness: multiple
  exceptional: ''
biology: A carnivore that probably spent its life at sea and most likely mated there; whether it bore live young
  is unknown. D. andiniensis has a short, tall snout, nicknamed 'Godzilla' in press reports.
