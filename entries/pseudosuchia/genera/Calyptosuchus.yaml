fossil_material:
  holotype: Not stated in the sources consulted for this draft; the species was named by Long and Ballew in 1985.
  material: Abundant remains, mostly osteoderms, from the Chinle, Tecovas, Santa Rosa and Petrified Forest formations;
    redescribed by Parker in 2018.
  completeness: multiple
  exceptional: ''
biology: Heavily armoured with a pig-like snout probably used to uproot plants; its dorsal and lateral osteoderms
  were not fully fused.
