fossil_material:
  holotype: Living genus — the name-bearing type of the type species is not covered by the sources used.
  material: The living false gharial; fossils referred to the genus from the Paleogene to the Quaternary of Africa,
    Europe and Asia, most of them probably other genera.
  completeness: multiple
  exceptional: ''
biology: Uses its long, narrow snout to catch fish. Its skeleton resembles true crocodiles, but molecular studies
  consistently place it with the gharial in Gavialidae.
