fossil_material:
  holotype: Living genus — the name-bearing type of the type species is not covered by the sources used.
  material: Living species, plus fossils of five extinct species from the Miocene to the Pleistocene of Africa,
    South Asia and South America.
  completeness: multiple
  exceptional: ''
biology: The most recent common ancestor of the living species probably had lingual salt glands for osmoregulation,
  which may have helped the genus spread across the tropics.
