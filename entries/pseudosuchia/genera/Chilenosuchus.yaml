name: Chilenosuchus
rank: genus
parent: aetosauria
incertae_sedis: true
placement_note: Its armour resembles Typothorax and it has been placed in Typothoracisinae, but many other differences
  leave its position within the aetosaurs uncertain (English Wikipedia).
authority: Casamiquela 1980
type_species: Chilenosuchus forttae
type_species_note: Monotypic genus; the only species is the type.
summary: Chilenosuchus is an aetosaur known from poorly preserved remains in the El Bordo Formation of northern
  Chile, of uncertain age.
