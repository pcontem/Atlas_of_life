fossil_material:
  holotype: Not stated in the sources consulted for this draft; S. robertsoni was named by Agassiz in 1844 from
    the Lossiemouth Sandstone, Scotland.
  material: Remains of S. robertsoni from Scotland and of S. olenkae (a skull and forelimb studied by Sulej and
    Dróżdż) from the Drawno Beds of Poland.
  completeness: multiple
  exceptional: ''
biology: A quadrupedal animal covered in thick armour, with a toothless upturned beak-like tip and peg-like back
  teeth suited to chewing tough plants such as horsetails, ferns and cycads; S. olenkae may have dug in soft ground.
