fossil_material:
  holotype: A nearly complete skull from the Solimões Formation, Amazonian Brazil (Price 1964).
  material: Skulls, jaws and partial skeletons of several species from Brazil, Colombia, Venezuela, Argentina and
    Bolivia.
  completeness: multiple
  exceptional: ''
biology: More than 40 small conical teeth per jaw side; its flat, broad snout suggests an unusual way of feeding,
  discussed by Cidade et al.
