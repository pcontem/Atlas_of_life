fossil_material:
  holotype: NMMNH P-4957, a nearly complete premaxillary tooth, with paratype teeth (NMMNH P-4958-9 and others);
    the description was originally based on 32 teeth.
  material: Many specimens, mostly teeth, from New Mexico, Arizona and North Carolina; three species are currently
    recognised.
  completeness: fragmentary
  exceptional: ''
biology: Originally interpreted as a basal ornithischian from its teeth, it is now treated as a pseudosuchian; the
  sources consulted give no direct evidence of diet.
