name: Nundasuchus
rank: genus
parent: pseudosuchia
incertae_sedis: true
placement_note: Analyses cited by the English Wikipedia (Nesbitt et al. 2014; Ezcurra 2016) place it variously as
  a suchian related to Paracrocodylomorpha or near the base of Pseudosuchia, so it is placed in Pseudosuchia.
authority: Nesbitt et al. 2014
type_species: Nundasuchus songeaensis
type_species_note: Monotypic genus; the only species is the type.
summary: Nundasuchus is a crurotarsan archosaur from the Middle Triassic Manda beds of Tanzania, with an upright
  limb posture.
