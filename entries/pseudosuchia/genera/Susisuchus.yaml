fossil_material:
  holotype: Partial articulated skeleton of S. anatoceps with skull, lower jaw, forelimbs, parts of the axial skeleton
    and osteoderms — Crato Formation (Nova Olinda Member), Araripe Basin, Brazil (Salisbury et al. 2003).
  material: The holotype is the most complete specimen. S. jaguaribensis (2009) rests on fragmentary remains from
    the Lima Campos Basin, about 115 km away; a further limb specimen from the Crato Formation was tentatively assigned
    as cf. Susisuchus.
  completeness: partial
  exceptional: Traces of soft tissue around both forelimbs and the digits of the right hand; the carcass is thought
    to have dried out before burial.
biology: Susisuchus was among the first mesoeucrocodylians with a tetraserial paravertebral shield, four rows of
  osteoderms along the back, which gave the trunk more lateral flexibility for swimming while keeping it rigid enough
  for semi-erect walking. It kept amphicoelous (concave-ended) vertebrae, a primitive trait, so it is regarded as
  a transitional form. Salisbury et al. argued that high-walking limited its size.
