fossil_material:
  holotype: A single partial articulated skeleton of S. anatoceps from the Nova Olinda Member of the Crato Formation,
    lacking most hind-limb bones; catalogue number not given in the sources consulted.
  material: The holotype, the most complete known specimen, plus fragmentary remains of S. jaguaribensis from the
    Lima Campos Basin.
  completeness: partial
  exceptional: Traces of soft tissue; the carcass was probably desiccated before burial.
biology: The sources consulted describe its anatomy and burial but give no direct evidence of diet or habits.
