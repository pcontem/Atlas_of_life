name: Susisuchus
rank: genus
parent: neosuchia
incertae_sedis: true
placement_note: PBDB lists Susisuchus under Eusuchia, and White et al. (2022) place the susisuchids with the hylaeochampsids
  inside it, whereas Salisbury et al. (2006) placed Susisuchus outside Eusuchia as its sister taxon; it is therefore
  kept in Neosuchia, the deepest group they share.
authority: Salisbury et al. 2003
type_species: Susisuchus anatoceps
type_species_note: ''
summary: Early Cretaceous crocodyliform from the Crato Formation of Brazil with a segmented back shield like that
  of eusuchians but simple vertebrae.
size:
  length_m: null
  note: The sources give no body length; Salisbury et al. (2003), as summarised on Wikipedia, argue that the high-walking
    posture would have kept it below about 50 kg.
