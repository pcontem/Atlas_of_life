  holotype: A natural mould of part of a thorax found around 1830 in the Berriasian Obernkirchen Sandstone near
    Bückeburg, Germany (P. schaumburgensis).
  material: Remains of several species from Germany, England and France; Scandinavian material has been referred
    to the genus.
