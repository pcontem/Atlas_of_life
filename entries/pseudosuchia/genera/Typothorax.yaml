fossil_material:
  holotype: Not stated in the sources consulted for this draft; named by Cope in 1875.
  material: Abundant remains, mostly armour, from the Chinle, Garita Creek, Cooper Canyon and Trujillo formations
    (90 PBDB occurrences).
  completeness: multiple
  exceptional: ''
biology: Typothorax and other aetosaurs had small, leaf-shaped teeth unsuited to meat; its lateral scutes bore horns
  hooked backwards and its flanks and belly had ornamented scutes.
