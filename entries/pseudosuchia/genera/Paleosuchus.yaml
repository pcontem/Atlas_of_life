type_species_note: PBDB gives no type species. Magnusson 1992 (Catalogue of American Amphibians and Reptiles) names
  Crocodilus trigonatus Schneider 1801 as the type of Paleosuchus Gray 1862; Gray proposed it as a subgenus of Caiman.
summary: Dwarf caimans — the smallest crocodilians of the Americas, two living species in South American rivers,
  with a few Miocene and Pleistocene fossils.
