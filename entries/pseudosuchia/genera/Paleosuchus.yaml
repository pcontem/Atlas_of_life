biology: The genus has two living species, the smooth-fronted (Schneider's) dwarf caiman P. trigonatus and Cuvier's
  dwarf caiman P. palpebrosus, both South American. Unlike other caimans it has no ridge between the eyes and four
  teeth in each premaxilla instead of five. A 2019 study found evidence of cryptic lineages within P. trigonatus.
  The name means "ancient crocodile" (Greek palaios + the crocodile god Sobek).
