name: Pseudhesperosuchus
rank: genus
parent: crocodylomorpha
incertae_sedis: true
placement_note: A 2002 analysis (Clark and Sues) left it unresolved among sphenosuchians, neither closer to crocodylians
  nor to Sphenosuchus; the 2025 redescription (Leardi) is not checked here for a finer placement.
authority: Bonaparte 1969
type_species: Pseudhesperosuchus jachaleri
type_species_note: Monotypic genus; the only species is the type.
summary: Pseudhesperosuchus is a sphenosuchian crocodylomorph from the Late Triassic Los Colorados Formation of
  north-western Argentina.
