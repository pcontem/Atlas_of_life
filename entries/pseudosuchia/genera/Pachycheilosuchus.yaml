fossil_material:
  holotype: SMU 75278, a right maxilla — bonebed near the top of the Glen Rose Formation, Erath County, Texas (Rogers
    2003).
  material: Remains of at least 13 other individuals covering most of the skeleton except hands, feet and part of
    the skull. Earlier "Glen Rose form" specimens (a skull and two partial skeletons) lack the lipped jaw and procoelous
    vertebrae and belong to a different, undescribed animal.
  completeness: multiple
  exceptional: A 49 mm crocodyloid egg was found with the skeletal fossils; one maxilla has an oval puncture, probably
    from a larger predator.
biology: The maxillae have overhanging lips and a tooth row set in from the margin, and the snout was short and
  flat. Procoelous vertebrae occur in the neck, back and part of the tail, but their slight dimple on the rear face
  and the lack of other eusuchian traits suggest procoely evolved independently. The ulna is strongly curved. The
  bonebed formed in a shallow, protected, nearshore brackish setting.
