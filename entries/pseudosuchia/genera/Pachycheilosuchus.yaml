summary: Small Early Cretaceous crocodyliform from the Glen Rose Formation of Texas with procoelous vertebrae and
  a neck shield of six fused scutes.
size:
  length_m: [0.635, 1.15]
  note: Rogers (2003) estimated 63.5–80 cm in total length by two methods; Iijima and Kubo (2020), via vertebrae,
    estimated up to 1.15 m. Longest thigh bone 91.2 mm. At least some individuals were mature.
