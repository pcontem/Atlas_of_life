fossil_material:
  holotype: Holotype of D. hatcheri described by Holland (1909); the first remains were teeth found in North Carolina
    in the 1850s.
  material: Skulls, jaws, vertebrae, osteoderms and teeth from 12 U.S. states and northern Mexico.
  completeness: multiple
  exceptional: Bite marks on Late Cretaceous turtle shells and dinosaur bones attributed to it.
biology: Robust teeth built for crushing; may have lived up to 50 years, growing at a modern-crocodile rate for
  longer. Probably fed on sea turtles, fish and other aquatic and land prey.
