name: Diplocynodon
rank: genus
parent: eusuchia
incertae_sedis: true
placement_note: Usually an alligatoroid (PBDB; Lee & Yates 2018), but recent work (Walter et al. 2025) places it
  outside crown Crocodylia.
authority: Pomel 1847
type_species: Diplocynodon ratelii
type_species_note: PBDB gives no type species; D. ratelii was named with the genus by Pomel (1847).
summary: Freshwater eusuchian of Paleocene–Miocene Europe, known from many species and articulated skeletons from
  Messel and the Geiseltal.
size:
  length_m: [1, 5.9]
  note: Some species probably did not exceed 1 m, others reached about 3 m; the largest, D. hantoniensis, measured
    5.9 m.
