fossil_material:
  holotype: Type of D. ratelii (Pomel 1847), from France.
  material: Many skulls and articulated skeletons, notably from the Messel Pit and the Geiseltal, Germany.
  completeness: multiple
  exceptional: Most articulated skeletons from Messel and the Geiseltal contain gastroliths.
biology: Almost exclusively found in freshwater settings; probably an opportunistic aquatic predator.
