name: Brachychampsa
rank: genus
parent: alligatoridae
incertae_sedis: true
placement_note: Possibly a basal caiman or a basal alligatorine (Walter et al. 2022); once also placed outside Alligatoridae.
authority: Gilmore 1911
type_species: Brachychampsa montana
type_species_note: PBDB gives no type species; B. montana was named with the genus (Gilmore 1911).
summary: Broad-snouted alligatorid of the latest Cretaceous of western North America, with crushing rear teeth.
