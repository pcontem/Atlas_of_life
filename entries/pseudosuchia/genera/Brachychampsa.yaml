fossil_material:
  holotype: Type material of B. montana from the Hell Creek beds, Montana (Gilmore 1911).
  material: Skulls and postcranial remains from Montana, Utah and New Mexico; other referred material is less certain.
  completeness: multiple
  exceptional: ''
biology: Heterodont teeth, with blunt rear teeth probably used to crush hard prey.
