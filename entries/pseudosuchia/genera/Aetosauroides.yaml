type_species_note: The English Wikipedia lead names A. scagliai as the type species; PBDB gives no type species.
summary: Aetosauroides is an extinct aetosaur from the Late Triassic of South America, one of the oldest members
  of its group.
size:
  length_m: [1.3, 2.4]
  note: Most individuals were about 1.3 m long; one large individual reached 2.4 m (histology suggests an age of
    about 23 years); males may have reached about 2 m if the sexual dimorphism suggested in the literature is real.
