  notes:
  - The English Wikipedia article "Caiman" covers the caimans as a group (Caimaninae), not the genus alone; biology
    and size text is written at that level. Replace with genus- or species-level sources (C. crocodilus, C. latirostris,
    C. yacare).
  - PBDB lists C. sclerops (Schneider 1801) as a species without ages; check whether it is a valid species or a
    synonym of C. crocodilus.
  - Size (length) of the living species is missing; source it from species-level articles (G8).
  - Type species rests on a Wikipedia taxobox with conflicting versions; confirm it and cite the original description
    (Spix 1825) — PBDB's primary reference (Mook 1921) is not the naming work.
  - Images were chosen from Commons captions and licences, not visually checked (the shell cannot download them);
    the media-fetch workflow stores the files. Check them against the contact sheet.
