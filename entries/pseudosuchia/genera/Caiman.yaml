fossil_material:
  holotype: Living genus — the name-bearing type of the type species is not covered by the sources used.
  material: The living spectacled, broad-snouted and yacare caimans, plus fossil species of the Miocene to Pleistocene
    of South America listed by PBDB (for example C. wannlangstoni, C. brevirostris, C. venezuelensis, C. paranensis).
  completeness: multiple
  exceptional: ''
biology: Caimans live in marshes, swamps, lakes and mangrove rivers of Central and South America and are mostly
  nocturnal. They eat chiefly fish, and also insects, birds, small mammals and reptiles. Females build large nests,
  more than 1.5 m wide, lay 10–50 eggs that hatch in about six weeks, and lead the young to shallow pools; in summer
  or drought they may dig burrows and aestivate. This description is given in the source for caimans in general,
  not for this genus alone.
