name: Thikarisuchus
rank: genus
parent: neosuchia
incertae_sedis: true
placement_note: English Wikipedia places it in the neosuchian family Wannchampsidae; the atlas has no clade for
  that family, so it sits in Neosuchia (the backbone had it in Pholidosauridae, which the source does not support).
authority: Allen et al. 2025
type_species: Thikarisuchus xenodentes
type_species_note: Monotypic genus; the only species is the type.
summary: Thikarisuchus is a small heterodont neosuchian from the Cenomanian Blackleaf Formation of Montana, known
  from a juvenile skull and partial skeleton.
