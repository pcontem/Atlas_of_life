fossil_material:
  holotype: An incomplete skull from Gadoufaoua, Niger, on which de Broin and Taquet based the genus in 1966.
  material: The best remains, including skulls and postcrania, were collected by Paul Sereno's teams in 1997 and
    2000; S. hartti is known from fragmentary material.
  completeness: multiple
  exceptional: ''
biology: Telescoped eyes and a long snout making up 75% of skull length; the longest reported skull is 1.7 m.
