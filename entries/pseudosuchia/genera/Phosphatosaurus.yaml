fossil_material:
  holotype: Catalogue number not given in the sources consulted; named from the phosphate deposits of southern Tunisia
    by Bergounioux (1955).
  material: Tunisian specimens of P. gavialoides; further remains from Mali and Niger (the Niger specimen not identified
    to species) are reported in the literature.
  completeness: fragmentary
  exceptional: ''
biology: A long-snouted marine crocodylomorph with blunt teeth and a spoon-shaped snout tip; the sources consulted
  give no more on diet.
