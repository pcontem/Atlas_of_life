fossil_material:
  holotype: Wagner (1858) named the genus from three skulls found in a quarry at Daiting, Bavaria; the type specimen
    is not identified in the article consulted.
  material: Fossils are known from the Late Jurassic of England, France, Switzerland, Germany, Argentina (Vaca Muerta),
    Cuba and Mexico.
  completeness: multiple
  exceptional: ''
biology: Known species were about three metres long or less. The genus has repeatedly been treated as a synonym
  of Metriorhynchus, Geosaurus or Dakosaurus.
