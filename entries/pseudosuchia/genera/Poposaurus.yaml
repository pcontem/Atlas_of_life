fossil_material:
  holotype: Not stated in the sources consulted for this draft; named by Mehl in 1915 from the Popo Agie Formation,
    Wyoming; the first remains were found near Lander in 1904.
  material: Remains from Wyoming, Utah, Arizona, Texas and Virginia; most of the skeleton is known except the skull.
  completeness: multiple
  exceptional: ''
biology: Like theropod dinosaurs it was an obligate biped, although it is more closely related to living crocodilians
  than to dinosaurs.
