  holotype: A well-preserved rostrum from the Pauini River, Brazil (Gürich 1912), probably destroyed in the 1943
    bombing of Hamburg.
  material: Skulls and jaws of five species from Argentina, Colombia, Venezuela, Brazil and Peru.
