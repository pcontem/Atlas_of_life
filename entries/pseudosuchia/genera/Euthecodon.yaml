fossil_material:
  holotype: Type material of E. nitriae from Wadi Natrun, Egypt (Fourtau 1920).
  material: Many skulls and jaws from Kenya, Ethiopia, Libya and elsewhere in Africa.
  completeness: multiple
  exceptional: ''
biology: Its gharial-like snout evolved independently and suggests a mainly fish diet; it lived alongside many other
  crocodiles until it died out in the Pleistocene.
