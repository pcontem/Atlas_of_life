fossil_material:
  holotype: Not stated in the sources consulted for this draft; the first remains were found by Eduard Suess in
    a coal mine and named by Seeley in 1881.
  material: D. carcharidens from Austria (Grünbach Formation), Italy and Hungary, and D. ibericus from Spain; many
    teeth and jaws from Romania are recorded in PBDB.
  completeness: fragmentary
  exceptional: ''
biology: Its teeth were ziphodont, with flattened sides and serrated edges; it is an indicator of faunal exchange
  between Europe and Africa in the Cretaceous.
