fossil_material:
  holotype: A largely articulated skeleton lacking most of the pelvis and tail, from the Winton Formation of Queensland;
    catalogue number not given in the sources consulted.
  material: The holotype only.
  completeness: partial
  exceptional: Partly digested bones of a juvenile ornithopod dinosaur (a chicken-sized animal weighing about 1.7
    kg) in the abdomen.
biology: Described as a macro-generalist predator; the stomach contents show it ate dinosaurs, and the species name
  means broken dinosaur killer.
