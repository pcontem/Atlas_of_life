fossil_material:
  holotype: Largely articulated, crushed skeleton lacking most of the pelvis, hind limbs and tail, with stomach contents —
    upper Winton Formation, central-western Queensland, Australia (White et al. 2022).
  material: One specimen, found in 2010 in a concretion while sauropod bones were being excavated; osteoderms were preserved
    with it but not in articulation.
  completeness: partial
  exceptional: Partly digested bones (vertebrae and limb bones) of a juvenile ornithopod dinosaur, probably about 1.7 kg,
    in the abdomen; revealed by neutron tomography.
biology: The skull shape suggests a macro-generalist able to take prey larger than itself, probably an opportunistic feeder
  rather than a dinosaur specialist. The preserved meal is the first evidence of a crocodyliform eating a dinosaur, and the
  state of the bones suggests the prey had been dismembered as living crocodilians do. All paravertebral osteoderms were single-keeled,
  so the back armour was fully segmented and more flexible in the water than the tightly interlocking armour of goniopholids
  and pholidosaurids. Some vertebrae are procoelous and others amphicoelous, which may mark a transitional condition.
