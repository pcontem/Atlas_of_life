name: Stegomosuchus
rank: genus
parent: crocodyliformes
incertae_sedis: true
placement_note: English Wikipedia calls it a protosuchian crocodylomorph (family Stegomosuchidae), but Whetstone
  and Whybrow (1983) found the only specimen too poorly preserved to classify; kept in Crocodyliformes.
authority: von Huene 1922
type_species: Stegomosuchus longipes
type_species_note: The species was named Stegomus longipes by Emerson and Loomis (1904); the genus name Stegomosuchus
  is by von Huene (1922).
summary: Stegomosuchus is a small crocodylomorph known from one partial skeleton, mostly impressions, from the Early
  Jurassic Portland Formation of Massachusetts.
size:
  length_m: null
  note: Skull about 35 mm long; snout-to-pelvis length about 149 mm; Walker regarded the specimen as a juvenile,
    so no adult range is given.
age:
  first_ma: 201.4
  last_ma: 199.5
  early_interval: Hettangian
  late_interval: ''
  pbdb_occurrences: 0
  note: No PBDB occurrences. English Wikipedia gives the late Hettangian (about 200.5-200 Ma); the whole Hettangian
    stage of the ICS chart is used here. Originally thought to be Triassic.
species:
- name: Stegomosuchus longipes
  authority: (Emerson and Loomis 1904)
  first_ma: 201.4
