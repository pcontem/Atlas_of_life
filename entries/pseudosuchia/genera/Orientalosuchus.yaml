name: Orientalosuchus
rank: genus
parent: crocodylia
incertae_sedis: true
placement_note: Named for a group first read as early alligatoroids endemic to Asia; later studies argue the Orientalosuchina
  are crocodyloids (English Wikipedia).
authority: Massonne et al. 2019
type_species: Orientalosuchus naduongensis
type_species_note: Monotypic genus; the only species is the type.
summary: Orientalosuchus is a crocodylian from the Late Eocene Na Duong Formation of Vietnam, known from at least
  29 individuals and key to defining the Orientalosuchina.
