fossil_material:
  holotype: The type specimen of the species was largely neglected in the literature and was figured in 2018 and
    2020; its catalogue number is not given in the article consulted.
  material: Fossils come from Middle to Late Jurassic deposits of England, France and Germany.
  completeness: multiple
  exceptional: ''
biology: A carnivore that lived at sea; no eggs or nests are known, so its reproduction is unknown. Streamlined
  body and finned tail made it a more efficient swimmer than modern crocodilians.
