fossil_material:
  holotype: Type material of A. grangeri from Mongolia (Mook 1940).
  material: Skulls and skeletons from Europe and Asia referred to several species, most of them now nomina dubia.
  completeness: multiple
  exceptional: ''
biology: Its upper teeth fully overlapped the lower ones (an overbite), a primitive crocodylian trait.
