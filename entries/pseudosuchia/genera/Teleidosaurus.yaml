fossil_material:
  holotype: The original holotype was lost in the Second World War; a neotype from the 1980s (a lower jaw, partial
    skull and a cervical vertebra) replaced it, and plastotype casts survive.
  material: The plastotype NHM R.2681 is a complete skull and mandible.
  completeness: partial
  exceptional: ''
biology: Its skull has some metriorhynchid features but keeps ancestral thalattosuchian traits, especially in the
  lower jaw.
