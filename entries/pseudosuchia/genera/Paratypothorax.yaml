fossil_material:
  holotype: SMNS 5721, a series of articulated osteoderms with a few hip and leg bones.
  material: The best specimens come from Germany, including SMNS 19003 (unearthed in 1945 at the Schlipf Quarry
    near Murrhardt); also remains from the Chinle Group of the United States.
  completeness: multiple
  exceptional: ''
biology: Its large osteoderms were long misidentified as phytosaur armour and referred to Belodon.
