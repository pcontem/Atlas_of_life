fossil_material:
  holotype: A skull first assigned to Metriorhynchus superciliosus; postcranial remains were later found in the
    same quarry and the type species was first named in Dakosaurus.
  material: Skull and postcranial remains from the Kimmeridge Clay of Dorset and Wiltshire, the Virgula Marls of
    Switzerland and Oaxaca, Mexico.
  completeness: multiple
  exceptional: ''
biology: Seen as a transitional form between long-snouted, fish-eating metriorhynchids and short-snouted hypercarnivores
  such as Dakosaurus.
