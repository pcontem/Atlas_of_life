fossil_material:
  holotype: Not stated in the sources consulted for this draft; the genus was named by Brown in 1934, with P. richardsoni
    (AMNH 3024) from Arizona.
  material: Specimens of three species from Arizona (P. richardsoni), Nova Scotia (P. micmac) and southern Africa
    (P. haughtoni).
  completeness: multiple
  exceptional: ''
biology: Short jaws, a powerful tail and a double row of osteoderms along the back, with osteoderms also covering
  the belly and tail.
