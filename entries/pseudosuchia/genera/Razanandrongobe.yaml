fossil_material:
  holotype: Isolated bones including a maxilla fragment and teeth, found in 2003 in the Sakaraha Formation, Bathonian,
    Madagascar; Catalogue number not given in the sources consulted.
  material: Isolated bones and teeth; further material described by Dal Sasso et al. 2017.
  completeness: fragmentary
  exceptional: ''
biology: Teeth with large serrations and palate reinforcement suggest a diet that included bones and tendons (English
  Wikipedia).
