name: Razanandrongobe
rank: genus
parent: notosuchia
incertae_sedis: true
placement_note: PBDB places it in Baurusuchia; English Wikipedia calls it a ziphosuchian; left in Notosuchia.
authority: Maganuco et al. 2006
type_species: Razanandrongobe sakalavae
type_species_note: Monotypic genus; the only species is the type.
summary: Razanandrongobe is a large predatory ziphosuchian crocodyliform from the Middle Jurassic of Madagascar,
  about 7 m long.
size:
  length_m: [7.0, 7.0]
  note: About 7 m long, the largest known notosuchian (English Wikipedia); an estimate.
