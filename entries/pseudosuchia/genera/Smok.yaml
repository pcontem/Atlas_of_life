formations: []
fossil_material:
  holotype: ZPAL V.33/15, a partially complete braincase associated with a partially preserved skeleton, from Lisowice,
    Silesian Voivodeship, Poland.
  material: The holotype and further material from Lisowice; a second occurrence in southern Poland is reported
    by Niedźwiedzki and Budziszewska-Karwowska (2018).
  completeness: partial
  exceptional: ''
biology: A large predator; a 2019 study (Qvarnström and colleagues) reports tyrannosaurid-like bone eating in a
  Triassic archosaur, according to its title. Fuller details are not read here.
