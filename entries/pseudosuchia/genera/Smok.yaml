name: Smok
rank: genus
parent: poposauroidea
incertae_sedis: true
placement_note: English Wikipedia places Smok in Paracrocodylomorpha without a family; the backbone kept it in Poposauroidea,
  unresolved within it.
authority: Niedźwiedzki et al. 2012
type_species: Smok wawelski
type_species_note: Monotypic genus; the only species is the type.
summary: Smok is a large predatory pseudosuchian from the latest Triassic of Lisowice, southern Poland, first described
  as a theropod dinosaur.
size:
  length_m: [5.0, 6.0]
  note: About 5-6 m long with a skull 50-60 cm long (English Wikipedia); estimates, not measurements.
age:
  first_ma: 208.5
  last_ma: 205.0
  early_interval: Norian
  late_interval: Rhaetian
  pbdb_occurrences: 0
