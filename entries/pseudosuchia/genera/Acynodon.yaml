fossil_material:
  holotype: Type specimens of A. iberoccitanus and A. lopezi described by Buscalioni et al. (1997) from the Upper Cretaceous
    of southern Europe; A. adriaticus (Delfino et al. 2008) is from Villaggio del Pescatore, Italy.
  material: Skulls and teeth of several species from France, Spain, Italy and Romania; A. adriaticus is the only species with
    articulated postcranial material, in at least two specimens. Isolated teeth from Kozina, Slovenia, may belong to it.
  completeness: multiple
  exceptional: ''
biology: The skull is extremely brevirostrine, with a very short, broad snout and muscle arrangement for a strong bite. A.
  adriaticus had greatly enlarged molar-like teeth and no caniniform teeth, an adaptation to slow, hard-shelled prey; its
  small orbits suggest shallow, densely vegetated waters. Its postcranial skeleton shows semiaquatic proportions and double-keeled
  paravertebral osteoderms, and a rib section with at least 31 growth lines in an immature animal indicates slow, steady growth
  and a long life.
