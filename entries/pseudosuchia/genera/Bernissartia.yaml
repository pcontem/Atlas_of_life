fossil_material:
  holotype: Not stated in the sources consulted for this draft; named by Dollo in 1883 from Bernissart, Belgium.
  material: Skulls and skeletons from the Sainte-Barbe Clays Formation of Bernissart, plus remains from Spain, the
    United States, France and the United Kingdom recorded in PBDB.
  completeness: multiple
  exceptional: ''
biology: Probably semi-aquatic; long pointed front teeth suited it to catching fish, while broad flat back teeth
  could crush hard food such as shellfish and possibly bone.
