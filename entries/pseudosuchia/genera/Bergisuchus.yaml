  holotype: Not stated in the sources consulted for this draft; named by Kuhn in 1968 from material first collected
    by Dietrich Berg in 1966.
  material: A single incomplete snout, a few partial lower jaws and some teeth.
  completeness: fragmentary
  exceptional: ''
biology: A short, deep, narrow snout with serrated teeth, unlike the broad flat snouts of many crocodyliforms.
