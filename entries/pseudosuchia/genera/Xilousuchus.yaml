fossil_material:
  holotype: IVPP V 6026, a well-preserved partial skeleton including the skull, from the Heshanggou Formation, Hazhen
    commune, Ordos Basin, Fugu County, Shanxi.
  material: The holotype; the sources consulted describe no other specimens.
  completeness: partial
  exceptional: ''
biology: Described as a probable active hunter with long, powerful legs, a small head, a long neck and a sail along
  the neck and back; this reconstruction of habits is from the Wikipedia summary, not a direct study of behaviour.
