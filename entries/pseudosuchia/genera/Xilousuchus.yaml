name: Xilousuchus
rank: genus
parent: ctenosauriscidae
incertae_sedis: false
placement_note: ''
authority: Wu 1981
type_species: Xilousuchus sapingensis
type_species_note: Monotypic genus; the only species is the type.
summary: Xilousuchus is a sail-backed poposauroid pseudosuchian from the Early Triassic Heshanggou Formation of
  Shanxi, China, among the oldest known archosaurs.
size:
  length_m: [3.0, 4.0]
  note: Possibly 3-4 m long, with a skull about 25 cm and a neck about 45 cm (English Wikipedia, rev. 1364960478);
    an estimate, not a measurement.
age:
  first_ma: 250.8
  last_ma: 241.464
  early_interval: Olenekian
  late_interval: Anisian
  pbdb_occurrences: 1
  note: PBDB gives 250.8-241.464 Ma (Olenekian-Anisian); the English Wikipedia places the Heshanggou Formation fossils
    in the Olenekian. Intervals filled from the ICS chart.
