fossil_material:
  holotype: CPP 1235, a well-preserved posterior skull and partial rostrum (Três Antas Farm, Campina Verde, Minas
    Gerais; Adamantina Formation, Bauru Basin).
  material: Four partial skulls (CPP 1234-1237); the postcranial skeleton was described in a later study.
  completeness: fragmentary
  exceptional: ''
biology: A small pit on the premaxilla received the first lower tooth when the jaws closed; the skull was deep and
  laterally compressed with large blade-like teeth.
