fossil_material:
  holotype: Wikipedia gives MHNG V02232 as the designated holotype of the type species (M. brevirostris) after specimens
    were reassigned among genera.
  material: Specimens come from Kimmeridgian deposits of France and from the Oxford Clay of England, Germany and
    Chile; the earliest known specimen is a jaw found in the 1770s.
  completeness: multiple
  exceptional: ''
biology: A carnivore that lived in the oceans. Species were traditionally split into longirostrine (long, narrow
  jaws) and brevirostrine (short, broad jaws) skull groups.
