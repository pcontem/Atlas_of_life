fossil_material:
  holotype: L. maghrebensis has the holotype UCRC PV2 (Kem Kem Beds, Morocco); the type species L. thaumastos is
    from the Echkar Formation of Niger; its catalogue number was not read for this draft.
  material: Skull and jaw remains of two species from Niger, Morocco and Algeria.
  completeness: fragmentary
  exceptional: ''
biology: The name means pancake crocodile, for the shallow skull typical of stomatosuchids; the sources consulted
  give no direct evidence of diet.
