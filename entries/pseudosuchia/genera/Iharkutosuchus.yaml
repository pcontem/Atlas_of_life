  exceptional: ''
biology: Strongly heterodont, with some teeth complex and multicusped like those of mammals. The skull structure
  allowed grinding with a mobile lower jaw, supported by extensive horizontal wear facets, and together with the
  teeth points to a diet of fibrous plant material. Its enamel shows a pattern convergent with mammalian Hunter-Schreger
  bands.
