fossil_material:
  holotype: Type material of the type species from North America (Mook 1921 named the genus).
  material: Many jaws and teeth; isolated bulbous teeth are often referred to it although other lineages had similar
    teeth.
  completeness: multiple
  exceptional: ''
biology: Its bulbous rear teeth have traditionally been read as an adaptation for crushing molluscs.
