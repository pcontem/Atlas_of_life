fossil_material:
  holotype: Not stated in the sources consulted for this draft; S. miaoi was named by Young in 1948.
  material: Material of several species from China, plus unassigned remains from Kyrgyzstan collected in the 1980s
    and Thai remains.
  completeness: multiple
  exceptional: ''
biology: A long, narrow snout, a small skull table and a long mandibular symphysis are characteristic; the sources
  consulted give no direct evidence of diet.
