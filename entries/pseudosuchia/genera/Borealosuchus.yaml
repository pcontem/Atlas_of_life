fossil_material:
  holotype: Not stated in the sources consulted for this draft; the type species B. sternbergii (Gilmore 1910) comes
    from the Maastrichtian of the western United States.
  material: Abundant remains from the Hell Creek, Lance, Fort Union and Denver formations among others, plus an
    indeterminate species from the Demopolis Chalk of Alabama.
  completeness: multiple
  exceptional: ''
biology: Size estimates vary widely between species; the sources consulted give no direct evidence of diet or habits.
