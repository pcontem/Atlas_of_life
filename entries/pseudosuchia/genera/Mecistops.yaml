fossil_material:
  holotype: Living genus — the name-bearing type of the type species is not covered by the sources used.
  material: The two living species, plus the fossil M. nkondoensis and other PBDB occurrences from the Miocene to
    Pleistocene of Uganda, Kenya and the Democratic Republic of the Congo.
  completeness: multiple
  exceptional: ''
biology: Slender-snouted crocodiles live in heavily vegetated fresh waters of sub-Saharan Africa and feed mainly
  on fish, amphibians and crustaceans, occasionally taking small mammals, water snakes, turtles and birds. Females
  build a mound nest of rotting plants on the bank and lay on average 16 large eggs; incubation is long (often over
  110 days) and the incubation temperature sets the sex. The genus was long thought to hold one species; genetic
  work split it into the West African M. cataphractus and the Central African M. leptorhynchus, which diverged in
  the Miocene. Both are heavily hunted, have lost ground in several countries and have been little studied.
