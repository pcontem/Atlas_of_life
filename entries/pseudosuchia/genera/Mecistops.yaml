  notes:
  - Position inside Crocodylidae is debated — molecular and combined analyses put it basal to Crocodylus, some morphological
    analyses basal to Crocodylinae (see the cladograms in the cited Wikipedia revision); the atlas has no Crocodylinae
    clade, so it sits in Crocodylidae like Crocodylus.
  - Conservation status (IUCN) quoted in the source predates the split into two species; do not use it without a
    current source.
  - Check the bibliographic details of Gray 1844 and decide between M. cataphractus and M. leptorhynchus (via M.
    bennettii) as type species.
