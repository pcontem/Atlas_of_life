fossil_material:
  holotype: Not confirmed here; casts of AMNH 3160 are shown on Commons; the genus was named in the 1930s-1950s
    literature.
  material: Relatively complete fossil material, used to define the Sebecidae and Sebecosuchia; remains from Argentina,
    Peru, Colombia and elsewhere.
  completeness: multiple
  exceptional: ''
biology: Like other sebecosuchians it was entirely terrestrial and carnivorous.
