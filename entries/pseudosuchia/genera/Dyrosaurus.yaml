fossil_material:
  holotype: MNHN 1901-11, one tooth, one caudal vertebra and the ends of an ulna and radius, from Djebel Dyr, Algeria.
  material: The family Dyrosauridae was named by de Stefano in 1903 after this locality; other species have dorsal
    osteoderms with distinctive shapes.
  completeness: fragmentary
  exceptional: ''
biology: A large marine reptile; the dorsal osteoderms of D. maghribensis are not sutured and lack a serrated margin.
