fossil_material:
  holotype: LPRP/USP 0229a, an articulated, nearly complete skeleton including the skull (Buruti creek area, General
    Salgado, São Paulo; Adamantina Formation).
  material: The holotype only; teeth and skull bones of an unidentified sphagesaurid crocodyliform (LPRP/USP 0229b)
    lay in its abdominal cavity.
  completeness: near-complete
  exceptional: Stomach contents - remains of a sphagesaurid crocodyliform, direct evidence of predation between
    crocodyliform taxa.
biology: The sphagesaurid remains in the abdominal cavity are direct evidence that it preyed on other crocodyliforms.
