fossil_material:
  holotype: Not stated in the sources consulted for this draft; P. kirkpatricki was named by Chatterjee in 1985
    from the Post Quarry, Texas.
  material: Numerous fossils of P. kirkpatricki from the Post Quarry plus remains of P. alisonae from North Carolina;
    the postcranial skeleton was described by Weinbaum in 2013.
  completeness: multiple
  exceptional: ''
biology: It likely preyed on large herbivores such as dicynodonts and on small early dinosaurs; short forelimbs
  relative to the hind limbs suggest it may have been mainly bipedal.
