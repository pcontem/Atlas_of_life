  holotype: A complete skull and lower jaw with the front and parts of the rear of the postcranial skeleton, from
    the Maevarano Formation, Mahajanga Province.
  material: The holotype plus five more specimens covering most of the skeleton, and many isolated teeth; one tooth
    from the Kallamedu Formation of India.
