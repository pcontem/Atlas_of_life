  placement: the senior synonym named in the source
- name: Geminiraptor
  author: Senter et al. 2010
  status: junior synonym
  ref: Freimuth et al. 2026, Reassessment of the Early Cretaceous North American “troodontid” Geminiraptor suarezarum
    as a therizinosaur (PLOS ONE, doi:10.1371/journal.pone.0356471); its English Wikipedia page now redirects to
    Falcarius, whose second species is F. suarezarum.
