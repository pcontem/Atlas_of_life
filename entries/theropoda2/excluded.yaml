- name: Epidendrosaurus
  author: Zhang et al. 2002
  status: junior synonym
  ref: Its English Wikipedia page redirects to Scansoriopteryx; the Scansoriopterygidae revision (1368942667) calls
    it the likely synonym of Scansoriopteryx heilmanni.
  source: English Wikipedia
  parent: Scansoriopteryx
  placement: the senior synonym named in the source
- name: Geminiraptor
  author: Senter et al. 2010
  status: junior synonym
  ref: Freimuth et al. 2026, Reassessment of the Early Cretaceous North American “troodontid” Geminiraptor suarezarum
    as a therizinosaur (PLOS ONE, doi:10.1371/journal.pone.0356471); its English Wikipedia page now redirects to
    Falcarius, whose second species is F. suarezarum.
  source: Literature and English Wikipedia
  parent: Falcarius
  placement: the senior synonym named in the source
- name: Aurornis
  author: Godefroit et al. 2013
  status: junior synonym
  ref: The Wikipedia article (revision 1345554633) reports that a 2017 study of Anchiornis specimens (Pei et al.,
    Bulletin of the AMNH 411) found the traits of Aurornis within the variation of Anchiornis, warranting synonymisation.
    Not in the PBDB valid list. The genus was named for an unprovenanced specimen.
  source: English Wikipedia
  parent: Anchiornis
  placement: the senior synonym named in the source
- name: Heptasteornis
  author: Harrison & Walker 1975
  status: nomen dubium
  ref: Wikipedia revision 1305754247 calls it a dubious genus of alvarezsaurid known from the Late Cretaceous of
    Romania (Naish & Dyke 2004 identified it as an alvarezsaurid); Stoicescu et al. 2024 treat the Hațeg material
    as Elopteryx.
  source: English Wikipedia
  parent: alvarezsauria
  placement: the group named in the source (alvarezsaurid)
- name: Ojoraptorsaurus
  author: Sullivan et al. 2011
  status: nomen dubium
  ref: Wikipedia revision 1388161255 calls it a dubious oviraptorosaurian known only from pubic bones from the Naashoibito
    Member, Ojo Alamo Formation.
  source: English Wikipedia
  parent: oviraptorosauria
  placement: the group named in the source (oviraptorosaurian)
- name: Dalianraptor
  author: Gao & Liu 2005
  status: nomen dubium
  ref: Wikipedia revision 1387083364 calls it a dubious, possibly chimeric genus from the Jiufotang Formation, first
    thought to be a dromaeosaurid.
  source: English Wikipedia
  parent: paraves
  placement: deepest atlas group that fits the source (possible dromaeosaurid, chimeric holotype)
- name: Kakuru
  author: Molnar & Pledge 1980
  status: nomen dubium
  ref: Wikipedia revision 1305280624 calls it a dubious theropod known from an opalised tibia from Andamooka, South
    Australia.
