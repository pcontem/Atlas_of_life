name: Fukuivenator
rank: genus
parent: therizinosauria
incertae_sedis: true
placement_note: First described as a bizarre maniraptoran (Azuma et al. 2016); Hattori et al. (2021) and Liao et
  al. (2026) recover it as a basal therizinosaur, so it is "probable" here.
authority: Azuma et al. 2016
type_species: Fukuivenator paradoxus
type_species_note: The only valid species listed by PBDB.
summary: Bizarre small theropod from the Early Cretaceous Kitadani Formation of Japan, probably an early therizinosaur.
