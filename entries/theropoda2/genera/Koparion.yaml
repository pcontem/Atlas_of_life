parent: troodontidae
incertae_sedis: true
placement_note: Chure 1994 assigned the tooth to Troodontidae; Wikipedia revision 1362754182 calls it only a small
  coelurosaurian theropod, and Hunt & Lucas 2006 discuss a small theropod from the Upper Jurassic of New Mexico
  in the same context. No analysis places it more precisely.
