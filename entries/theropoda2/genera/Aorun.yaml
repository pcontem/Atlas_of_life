name: Aorun
rank: genus
parent: alvarezsauria
incertae_sedis: true
placement_note: Choiniere et al. 2013 described it as a coelurosaur; Wikipedia revision 1388182978 notes that some
  researchers consider it a carnosaurian, and the article on Shishugounykus lists it only as a possible alvarezsaur
  of the Shishugou Formation. The backbone placed it in Alvarezsauria.
authority: Choiniere et al. 2013
type_species: Aorun zhaoi
type_species_note: Taxobox and text of Wikipedia revision 1388182978 (the only species).
summary: Small carnivorous theropod from the Late Jurassic Shishugou Formation of Xinjiang, China, known from a
  skull and partial skeleton.
