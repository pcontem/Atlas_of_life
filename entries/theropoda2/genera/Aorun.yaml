fossil_material:
  holotype: IVPP V15709, a skull with lower jaws, a neck vertebra, a dorsal vertebra, three tail vertebrae, the
    left ulna and hand, the lower ends of both pubes and both lower legs; Xinjiang, China.
  material: Only the holotype.
  completeness: partial
  exceptional: ''
biology: The hand is slender, with very thin third and fourth metacarpals, closer to the hands of derived non-avian
  coelurosaurs than to those of basal theropods; the teeth are unserrated or have very fine serrations only on the
  back edge. The low tooth count suggests the holotype was a juvenile.
