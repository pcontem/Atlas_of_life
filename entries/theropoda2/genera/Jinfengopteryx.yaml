name: Jinfengopteryx
rank: genus
parent: paraves
incertae_sedis: true
placement_note: First described as an avialan (Ji et al. 2005); PBDB places it in Troodontidae and the cited Wikipedia
  revision calls it a maniraptoran of uncertain age and position.
authority: Ji et al. 2005
type_species: Jinfengopteryx elegans
type_species_note: The only valid species listed by PBDB.
summary: Feathered paravian from the Huajiying Formation of Hebei, China, with oval structures that may be seeds.
