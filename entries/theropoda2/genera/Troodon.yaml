fossil_material:
  holotype: A tooth (Leidy 1856).
  material: The holotype tooth; skeletons once referred to it are now placed in Stenonychosaurus and Latenivenatrix.
  completeness: fragmentary
  exceptional: ''
biology: Its name means "wounding tooth"; a 2025 paper proposed a neotype to keep the name valid, with Stenonychosaurus
  as a junior synonym.
