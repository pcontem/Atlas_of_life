fossil_material:
  holotype: Specimen found in 1996 in the Nemegt Formation, Mongolia (Lü et al. 2004, as Nemegtia).
  material: The holotype and two specimens found in 2007, one on a nest of eggs.
  completeness: multiple
  exceptional: Adult on a nest of eggs; beetle feeding traces on the bones.
biology: Toothless, with a short beaked snout; its first name, Nemegtia, was preoccupied and replaced in 2005.
