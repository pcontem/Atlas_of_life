fossil_material:
  holotype: IVPP V25026, a partially articulated skeleton of a subadult, Bayin-Gobi Formation, Inner Mongolia, China.
  material: Only the holotype.
  completeness: partial
  exceptional: Possible gut contents with hard tissue debris (Wang et al. 2025).
biology: Intestinal contents of the holotype were interpreted as direct evidence that this early alvarezsaurian
  ate animal prey; its arm was already shortened and modified.
