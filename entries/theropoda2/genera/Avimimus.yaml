fossil_material:
  holotype: Partial skeleton recovered by Russian palaeontologists in Mongolia (Kurzanov 1981).
  material: The holotype, a second nearly complete specimen described in 2000, isolated bones and a large bonebed
    of Avimimus sp.; a second species, A. nemegtensis, was named by Funston et al. (2018).
  completeness: multiple
  exceptional: ''
biology: Named for its many bird-like characteristics; a bonebed of Avimimus sp. was reported by Currie and colleagues.
