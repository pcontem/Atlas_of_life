fossil_material:
  holotype: Jaws (CMN 343) found in 1917 by Charles Hazelius Sternberg, once referred to Chirostenotes.
  material: The holotype jaws and very many isolated teeth, some possibly as old as the Late Jurassic.
  completeness: fragmentary
  exceptional: ''
biology: If all its teeth belonged to one genus, it would be among the longest-lasting and most widespread dinosaur
  genera.
