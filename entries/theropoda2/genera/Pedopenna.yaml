name: Pedopenna
rank: genus
parent: paraves
incertae_sedis: true
placement_note: Its feet resemble those of troodontids and dromaeosaurids but are more primitive; restorations show
  it as an anchiornithid, avialan or scansoriopterygid, so its position within Paraves is open.
authority: Xu and Zhang 2005
type_species: Pedopenna daohugouensis
type_species_note: The only valid species listed by PBDB.
summary: Small feathered maniraptoran from the Jurassic Daohugou Beds of China known from a hind limb with long
  feathers.
