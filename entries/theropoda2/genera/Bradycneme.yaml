name: Bradycneme
rank: genus
parent: maniraptora
incertae_sedis: true
placement_note: Harrison & Walker 1975 took it for a giant owl; later authors called it a troodontid, a basal tetanuran,
  an alvarezsaurid (Holtz 2011) or an indeterminate maniraptoran (Naish & Dyke 2004); Stoicescu et al. 2024 suggest
  it is a junior synonym of Elopteryx (Wikipedia revision 1376493136).
authority: Harrison & Walker 1975
type_species: Bradycneme draculae
type_species_note: Taxobox of Wikipedia revision 1376493136 (the only species).
summary: Maniraptoran known from a partial lower leg from the Maastrichtian Sânpetru Formation of Romania, first
  described as a giant owl and of uncertain identity.
size:
  length_m: null
  note: The holotype distal tibiotarsus is 37.8 mm wide (Wikipedia revision 1376493136); no body size can be given.
