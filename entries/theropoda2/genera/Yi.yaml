fossil_material:
  holotype: The only specimen, an adult found by the farmer Wang Jianrong in a quarry near Mutoudeng, Qinglong County,
    Hebei; sold to the Shandong Tianyu Museum of Nature in 2007.
  material: Only the holotype.
  completeness: partial
  exceptional: Membranous wing tissue and feathers.
biology: Had a long styliform wrist bone supporting a membrane wing; aerodynamic studies suggest such membrane-winged
  theropods were poor gliders (Dececchi et al. 2020).
