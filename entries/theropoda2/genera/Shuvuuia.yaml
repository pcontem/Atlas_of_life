fossil_material:
  holotype: Specimen from the Djadokhta Formation of Ukhaa Tolgod, Mongolia (Chiappe et al. 1998).
  material: Several specimens, including skulls.
  completeness: multiple
  exceptional: Feather-like fibres tested for beta-keratin (Schweitzer et al. 1999).
biology: Had a massively enlarged thumb with reduced second and third fingers and long, slender, short-toed legs
  suggesting good running; its vision and hearing were studied by Choiniere et al. (2021).
