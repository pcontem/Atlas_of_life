fossil_material:
  holotype: Skeleton from the Jianshangou Bed of the Yixian Formation, Sihetun, Liaoning, China (Ji et al. 1998).
  material: Several well-preserved skeletons; a second species, C. dongi, named in 2000.
  completeness: multiple
  exceptional: Wing and tail feathers; preserved cartilage and chondrocyte-like structures in specimen STM4-3.
biology: Its discovery fuelled debate on the bird–dinosaur relationship; it had a fan of feathers at the tip of
  the tail and short feathered arms.
