  holotype: A complete feathered skeleton from the Tiaojishan Formation, Liaoning, China (Lefèvre et al. 2017).
  material: Only the holotype.
  completeness: complete
  exceptional: Barbule-free remiges on the arms and long feathers on the legs to the toes.
biology: Its symmetrical, barbule-free arm feathers suggest it could not fly; some researchers think it is a junior
  synonym of Anchiornis.
