id: oviraptorosauria
name: Oviraptorosauria
rank: clade
taxon_rank: infraorder
taxon_rank_source: Paleobiology Database taxonomy (taxon Oviraptorosauria, infraorder), downloaded 2026-11-16
parent: maniraptora
wikipedia: Oviraptorosauria
summary: Feathered maniraptorans of the Cretaceous of Asia and North America with short, beaked, parrot-like skulls.
diagnosis:
- Short snout and massive beak-like lower jaws
- Teeth reduced to front pairs or lost in advanced members
- Extensively pneumatised skull and vertebrae; U-shaped furcula
notes: Ranged from turkey-sized Caudipteryx to the 8-m Gigantoraptor. Basal members include Incisivosaurus, Protarchaeopteryx
  and Ningyuansaurus. Some authors (Maryańska et al. 2002) proposed they were flightless birds.
