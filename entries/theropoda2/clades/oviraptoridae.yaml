id: oviraptoridae
name: Oviraptoridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Oviraptoridae, family), downloaded 2026-11-16
parent: oviraptorosauria
wikipedia: Oviraptoridae
summary: Toothless, beaked oviraptorosaurs known from the Late Cretaceous of Asia, many with crests on the skull.
diagnosis:
- Short snout with very deep lower jaws
- Bony spike intruding into the mandibular fenestra
- Nostrils placed high and far back; toothless jaws with two bony projections on the palate
notes: Most were 1–2 m long. Best known from the Gobi Desert of Mongolia and northern China; many nesting and embryo
  specimens are known.
