parent: maniraptora
wikipedia: Paraves
summary: Maniraptorans comprising dromaeosaurids, troodontids, anchiornithids and birds, many with an enlarged second-toe
  claw.
diagnosis:
- Enlarged claw on the second toe, held off the ground in some species
- Front tooth serrations much finer than the hooked rear ones in dromaeosaurids and troodontids
notes: Relationships among paravian groups are actively debated; anchiornithids, unenlagiids and halszkaraptorines
  move between positions in different analyses. Avialae (birds) is kept in the tree outside this volume.
