wikipedia: Eudromaeosauria
summary: '''True'' dromaeosaurs: small to large terrestrial predators of the Cretaceous, known almost only from
  the Northern Hemisphere.'
diagnosis:
- Generally larger size than other dromaeosaurids
- Several specialised features of the foot
notes: 'Includes dromaeosaurines, velociraptorines and saurornitholestines, whose composition varies between analyses;
  genera are therefore placed in Eudromaeosauria itself. Earliest definitive member: Yurgovuchia (about 139 Ma).'
