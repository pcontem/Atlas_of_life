id: scansoriopterygidae
name: Scansoriopterygidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Scansoriopterygidae, family), downloaded 2026-11-16
parent: maniraptora
wikipedia: Scansoriopterygidae
summary: Tiny Jurassic maniraptorans from China with a very long third finger, adapted for climbing and in some
  cases gliding.
diagnosis:
- Third finger longer than the first and second, unlike other theropods
- In Yi and Ambopteryx a long styliform wrist bone supporting a membranous wing
notes: 'Known from a few specimens from the Tiaojishan Formation. Placement varies among analyses: within Paraves,
  near Oviraptorosauria or as early avialans, so here it sits directly in Maniraptora.'
