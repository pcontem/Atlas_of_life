id: caenagnathidae
name: Caenagnathidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Caenagnathidae, family), downloaded 2026-11-16
parent: oviraptorosauria
wikipedia: Caenagnathidae
summary: Toothless oviraptorosaurs of the Cretaceous of North America and Asia with long, shallow jaws.
diagnosis:
- Jaws relatively long and shallow compared with oviraptorids
- Specialised beak and jaw articulation distinct from other oviraptorosaurs
notes: Includes the largest oviraptorosaurs, Beibeilong and Gigantoraptor (7.5–8 m). First named in 1940 as a family
  of flightless birds.
