id: microraptoria
name: Microraptoria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Microraptoria, unranked clade), downloaded 2026-11-16
parent: dromaeosauridae
wikipedia: Microraptoria
summary: Small, slender early dromaeosaurids of the Early Cretaceous of China, many with long feathers on the legs.
diagnosis:
- Slender proportions and long limbs
- Large serrated teeth and a hyperextendable second toe with curved claw
- Long hind-limb feathers in several members
notes: Definitive members are from the Barremian–Aptian Jehol Biota; some may have been capable fliers. Adult Microraptor
  was under 1 m long.
