id: troodontidae
name: Troodontidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Troodontidae, family), downloaded 2026-11-16
parent: paraves
wikipedia: Troodontidae
summary: Small, gracile, bird-like paravians from the Late Jurassic to Late Cretaceous, with many closely spaced
  teeth.
diagnosis:
- Large numbers of closely spaced teeth in the lower jaw
- Unusually long legs and a retractable second toe with a moderate sickle claw
- Among the highest encephalisation quotients of non-avian dinosaurs
notes: The oldest definitive member is Hesperornithoides (Late Jurassic, Wyoming). Specimens with feathers, eggs
  and embryos are known.
