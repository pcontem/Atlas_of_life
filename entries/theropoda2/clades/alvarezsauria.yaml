id: alvarezsauria
name: Alvarezsauria
rank: clade
taxon_rank: infraorder
taxon_rank_source: Paleobiology Database taxonomy (taxon Alvarezsauria, infraorder), downloaded 2026-11-16
parent: maniraptora
wikipedia: Alvarezsauroidea
summary: Lightly built maniraptorans whose later members had very short, stout arms ending in one large clawed finger.
diagnosis:
- Short, robust forelimbs, in derived forms with a single enlarged first finger and claw
- Long hind limbs suited to running
notes: Early members such as Haplocheirus and Bannykus had longer three-fingered arms; the specialised arm evolved
  within the group. Their position as maniraptorans is accepted by most recent analyses, though PBDB keeps them
  outside its Maniraptora.
