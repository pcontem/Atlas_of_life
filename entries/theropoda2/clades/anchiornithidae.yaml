id: anchiornithidae
name: Anchiornithidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Anchiornithidae, family), downloaded 2026-11-16
parent: paraves
wikipedia: Anchiornithidae
summary: Small feathered paravians, mostly from the Late Jurassic of China, of uncertain position near troodontids
  and early birds.
diagnosis:
- Small, lightly built feathered carnivores
- Long legs, arms and hands (forelimbs slightly reduced in Eosinopteryx)
notes: Classified variously as a family, a basal troodontid subfamily, archaeopterygids or a grade within Avialae
  or Paraves. Ostromia is from Germany.
