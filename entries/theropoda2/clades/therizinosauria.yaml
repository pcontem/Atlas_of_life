id: therizinosauria
name: Therizinosauria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Therizinosauria, unranked clade), downloaded 2026-11-16
parent: maniraptora
wikipedia: Therizinosauria
summary: Mostly herbivorous maniraptorans of the Cretaceous of Asia and North America, with long necks, broad bodies
  and huge hand claws.
diagnosis:
- Long neck, wide torso and four-toed hind feet used in walking
- Backward-pointing hip bones partly fused
- Leaf-shaped teeth and a toothless beak at the front of the jaws
notes: Sizes range from about 2 m (Jianchangosaurus, Beipiaosaurus) to about 10 m in Therizinosaurus. Jurassic fragments
  (Eshanosaurus) are doubtful members. Formerly called segnosaurs.
