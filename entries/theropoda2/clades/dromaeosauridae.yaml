id: dromaeosauridae
name: Dromaeosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Dromaeosauridae, family), downloaded 2026-11-16
parent: paraves
wikipedia: Dromaeosauridae
summary: Feathered, mostly carnivorous paravians of the Cretaceous, the 'raptors', with an enlarged sickle claw
  on the second toe.
diagnosis:
- Short T-shaped frontals bounding the supratemporal fenestra
- Raised, stalked parapophyses on the dorsal vertebrae
- Modified second toe; caudal chevrons and prezygapophyses elongated over several vertebrae
notes: Definitive dromaeosaurids are from North America, Europe and Asia; southern forms once included here are
  now often placed in Unenlagiidae.
