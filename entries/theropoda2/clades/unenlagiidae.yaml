id: unenlagiidae
name: Unenlagiidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Unenlagiidae, family), downloaded 2026-11-16
parent: paraves
wikipedia: Unenlagiidae
summary: Proposed family of long-snouted paravians, mainly from the Cretaceous of South America, of debated position.
diagnosis:
- Same membership as the dromaeosaurid subfamily Unenlagiinae
- Some members show features suggesting semiaquatic habits
notes: Traditionally a dromaeosaurid subfamily; since the 2010s some analyses place it outside Dromaeosauridae,
  near or within Avialae (Motta et al. 2020, 2025). Placed here in Paraves (M2).
