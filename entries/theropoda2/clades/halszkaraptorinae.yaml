id: halszkaraptorinae
name: Halszkaraptorinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Halszkaraptorinae, subfamily), downloaded 2026-11-16
parent: dromaeosauridae
wikipedia: Halszkaraptorinae
summary: Small, long-necked dromaeosaurids from the Late Cretaceous of Mongolia, possibly semiaquatic.
diagnosis:
- Long neck
- Flattened ulna with a sharp rear margin
- Shelf-like supratrochanteric process on the ilium
notes: Includes Halszkaraptor, Natovenator, Mahakala and Hulsanpes. Some analyses place the group in Unenlagiidae;
  whether it was semiaquatic is debated.
