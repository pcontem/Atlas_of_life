wikipedia: Maniraptora
summary: Coelurosaurs closer to birds than to Ornithomimus, including dromaeosaurids, troodontids, oviraptorosaurs,
  therizinosaurs and birds.
diagnosis:
- Long arms with three-fingered hands, reduced or fused in some lineages
- A half-moon shaped (semilunate) bone in the wrist
- A backward-pointing pubis in several groups (therizinosaurs, dromaeosaurids, avialans, some early troodontids)
notes: Alvarezsaurs and Ornitholestes are often but not always included. With Ornithomimosauria, Maniraptora forms
  Maniraptoriformes. The group appears in the Jurassic and survives today as birds (Avialae, kept in the tree outside
  this volume).
