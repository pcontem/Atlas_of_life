id: ceratopsia
name: Ceratopsia
rank: clade
taxon_rank: suborder
taxon_rank_source: Paleobiology Database taxonomy (taxon Ceratopsia, suborder), downloaded 2026-11-16
parent: marginocephalia
wikipedia: Ceratopsia
summary: The beaked, herbivorous horned-face dinosaurs of North America, Asia and Europe, from small bipedal Psittacosaurus
  to the huge frilled Triceratops.
diagnosis:
- A rostral bone, a toothless ossification at the tip of the upper jaw unique to ceratopsians, forming part of a
  hooked beak
- Early members small and bipedal; later ones large quadrupeds with facial horns and a frill over the neck
- Size from about 1 m and 23 kg to over 9 m and 9,100 kg
notes: Marsh named the group in 1890. The earliest known ceratopsian, Yinlong downsi, lived about 161 to 156 million
  years ago in the Late Jurassic of Asia, and the last, Triceratops prorsus, died out 66 million years ago. Ceratops,
  which gave the group its name, is a nomen dubium. Frills may have protected the neck, served for display or thermoregulation,
  or anchored muscles; none of these is settled.
