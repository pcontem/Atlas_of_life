id: leptoceratopsidae
name: Leptoceratopsidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Leptoceratopsidae, family), downloaded 2026-11-16
parent: ceratopsia
wikipedia: Leptoceratopsidae
summary: A family of small, primitive neoceratopsians from Asia, North America and possibly Europe.
diagnosis:
- Neoceratopsians more primitive and generally smaller than protoceratopsids and ceratopsids
- Defined as Leptoceratops gracilis and all species closer to it than to Triceratops horridus
notes: Nopcsa named it in 1923 as the subfamily Leptoceratopsinae, and Makovicky defined it as a stem-based family
  in 2001. Its internal relationships were unresolved in the 2019 analysis of Morschhauser and colleagues.
