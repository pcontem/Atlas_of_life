wikipedia: Marginocephalia
summary: Ornithischians with a bony shelf at the back of the skull, made up of the thick-skulled pachycephalosaurs
  and the horned ceratopsians.
diagnosis:
- A bony shelf or margin at the back of the skull, probably used for display
- Two subgroups, the thick-skulled Pachycephalosauria and the horned Ceratopsia
- Primarily herbivores; basally small facultative quadrupeds, with derived members large obligate quadrupeds
notes: 'Defined in the PhyloCode by Madzia and colleagues in 2021 by three specifiers: Ceratops montanus, Pachycephalosaurus
  wyomingensis and Triceratops horridus. Basal members used gastroliths to process plants, and tooth batteries evolved
  convergently in Neoceratopsia and Pachycephalosauria. The group arose in the Jurassic and became more common in
  the Cretaceous; primitive members are Asian and later forms reached North America.'
