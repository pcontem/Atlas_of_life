id: protoceratopsidae
name: Protoceratopsidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Protoceratopsidae, family), downloaded 2026-11-16
parent: ceratopsia
wikipedia: Protoceratopsidae
summary: Small basal ceratopsians from the Late Cretaceous of Asia, mostly China and Mongolia, with a modest frill
  and no large horns.
diagnosis:
- A wedge-shaped snout with tall, narrow nostrils set high on it
- An unusually small antorbital fenestra, with the antorbital fossa high on the skull joined by a slit to a maxillary
  sinus unique to the family
- Body length of about 1 to 2.5 m, with a frill and horns much smaller than in ceratopsids
notes: Granger and Gregory named it in 1923. Protoceratopsids had constantly replaced tooth batteries for slicing
  plants and a hooked beak, and may have had cheeks.
