id: chasmosaurinae
name: Chasmosaurinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Chasmosaurinae, subfamily), downloaded 2026-11-16
parent: ceratopsidae
wikipedia: Chasmosaurinae
summary: The ceratopsid subfamily with prominent brow horns and long frills without long spines, species-rich in
  the Campanian and Maastrichtian of western North America.
diagnosis:
- Prominent brow horns and long frills lacking long spines
- Frill edges with epoccipital hornlets whose shape allows species to be told apart from fragmentary remains
notes: Named by Lambe in 1915. Chasmosaurines appeared in the early Campanian and died out at the Cretaceous-Paleogene
  extinction. They evolved in Laramidia and are known definitively from western Canada, the western United States
  and northern Mexico.
