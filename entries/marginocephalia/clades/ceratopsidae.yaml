id: ceratopsidae
name: Ceratopsidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Ceratopsidae, family), downloaded 2026-11-16
parent: ceratopsia
wikipedia: Ceratopsidae
summary: The large frilled and horned ceratopsians of the Late Cretaceous, mostly from western North America, including
  Triceratops, Centrosaurus and Styracosaurus.
diagnosis:
- Quadrupedal herbivores with beaks and rows of shearing teeth at the back of the jaw
- Elaborate nasal horns and a thin parietal-squamosal shelf extending back and up into a frill
- 'Two subfamilies: Chasmosaurinae, with long triangular frills and large brow horns, and Centrosaurinae, with nasal
  horns or bosses and shorter frills'
notes: Marsh named the family in 1888. All but one known species come from western North America, which formed the
  island continent of Laramidia in most of the Late Cretaceous. Horns and frills are the main means of recognising
  species; their purpose is not entirely clear, and defence against predators is only one proposed use.
