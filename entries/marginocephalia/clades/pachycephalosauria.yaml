id: pachycephalosauria
name: Pachycephalosauria
rank: clade
taxon_rank: suborder
taxon_rank_source: Paleobiology Database taxonomy (taxon Pachycephalosauria, suborder), downloaded 2026-11-16
parent: marginocephalia
wikipedia: Pachycephalosauria
summary: The thick-skulled, bipedal herbivores or omnivores of the Cretaceous of North America and Asia, with domed,
  flat or wedge-shaped skulls.
diagnosis:
- Heavily ossified, thickened skull roofs, domed, flat or wedge-shaped, with domes often ringed by nodes or spikes
- Bipedal build with short forelimbs, long legs, a short thick neck and a heavy tail
- Large orbits and a large optic nerve, pointing to good vision
notes: Named by Maryańska and Osmólska in 1974. No complete skeleton is known, and isolated skull fragments are
  often all that is found. The oldest definite pachycephalosaur is Zavacephale from the Early Cretaceous of Mongolia;
  earlier candidates such as Stenopelix, which a 2017 analysis placed in Ceratopsia, are doubted.
