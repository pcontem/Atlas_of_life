id: psittacosauridae
name: Psittacosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Psittacosauridae, family), downloaded 2026-11-16
parent: ceratopsia
wikipedia: Psittacosaurus
summary: The Early Cretaceous Asian family of bipedal, parrot-beaked ceratopsians centred on Psittacosaurus.
diagnosis:
- Obligate bipeds as adults, with a high skull and a robust beak
- Early members of the ceratopsian line, though closer to Triceratops than Yinlong
- Known from Asia, with the close relative Aquilops from North America
notes: Osborn created the family in 1923 for Psittacosaurus, which he thought might be related to Ankylosauria.
  Hongshanosaurus, once placed here as a separate genus, is now regarded as a junior synonym of Psittacosaurus,
  and the family is considered an early offshoot of the line leading to derived ceratopsians.
