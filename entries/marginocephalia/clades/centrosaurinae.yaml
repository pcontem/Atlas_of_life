id: centrosaurinae
name: Centrosaurinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Centrosaurinae, subfamily), downloaded 2026-11-16
parent: ceratopsidae
wikipedia: Centrosaurinae
summary: The ceratopsid subfamily with a large nasal horn and an ornamented frill, known mainly from northern Laramidia
  (Alberta, Montana, Alaska).
diagnosis:
- A large nasal horn, or a nasal boss, and short supratemporal horns
- A frill ornamented with projections, shorter and more rectangular than in chasmosaurines
- Skull, snout and frill shapes that differ from other ceratopsians in morphometric analysis
notes: Lambe named it in 1915 with Centrosaurus as the type genus. The PhyloCode defines it as the largest clade
  containing Centrosaurus apertus but not Chasmosaurus belli or Triceratops horridus, and it is divided into three
  tribes, among them Nasutoceratopsini. Isolated taxa are known from China and Utah.
