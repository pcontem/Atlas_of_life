name: Micropachycephalosaurus
rank: genus
parent: marginocephalia
incertae_sedis: true
placement_note: Originally described as a pachycephalosaur; later considered a basal marginocephalian or a ceratopsian,
  the cited analyses disagreeing (Butler and Zhao 2009; Fonseca 2024).
authority: Dong 1978
type_species: Micropachycephalosaurus hongtuyanensis
type_species_note: Only species of the genus (PBDB).
summary: Micropachycephalosaurus is a small, doubtfully placed marginocephalian from the Late Cretaceous of Shandong,
  China.
size:
  length_m: [1, 1]
  note: Likely up to 1 m when fully grown (cited Wikipedia revision).
