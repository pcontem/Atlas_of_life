fossil_material:
  holotype: YPM 1820, a skull collected in 1888 by John Bell Hatcher — Lance Formation, Wyoming.
  material: More than a hundred skulls and many skeletons, from Lance, Hell Creek and Frenchman formations.
  completeness: multiple
  exceptional: Skin impressions with large basement scales are known.
biology: Large herbivore with a beak and shearing teeth; basement scales up to 9 cm across.
