  holotype: ZPAL MgD-I/126, a medium-sized skull — Barun Goyot Formation, Hermiin Tsav, Gobi Desert, Mongolia.
  material: Many specimens from the Polish-Mongolian expeditions of the 1970s; other Barun Goyot protoceratopsid
    names were treated as synonyms by Makovicky in 2006.
