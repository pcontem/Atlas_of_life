fossil_material:
  holotype: Partial skull and skeleton of one of two individuals found in 1910 (number not given in the sources
    used) — Scollard Formation, Alberta.
  material: One complete and two mostly complete skeletons found in 1947 and further specimens from Montana and
    Wyoming; older Montana referrals went to Montanoceratops and Cerasinops.
  completeness: multiple
  exceptional: ''
biology: Mixture of primitive and derived ceratopsian features.
