fossil_material:
  holotype: AMNH 6254, a nearly complete skull, jaws and skeleton ("Red Mesa skeleton") — Öösh (Oshih) Formation,
    Artsa Bogdo Basin, Mongolia.
  material: Hundreds of individuals of all ages, many complete skeletons, from China, Mongolia, Russia and Thailand
    records in PBDB.
  completeness: multiple
  exceptional: One individual preserves long filaments on the tail.
biology: Obligate biped as an adult, with a high skull and a robust beak.
