fossil_material:
  holotype: Specimen from the Djadokhta Formation described by Granger and Gregory in 1923 (catalogue number not
    given in the sources used).
  material: Hundreds of specimens, including growth series and the "Fighting Dinosaurs" pair with a Velociraptor.
  completeness: multiple
  exceptional: The "Fighting Dinosaurs" specimen preserves a Protoceratops and a Velociraptor locked in combat.
biology: Herbivore with prominent jaws and teeth suited to chopping plants; skull and frill grew rapidly during
  maturation.
