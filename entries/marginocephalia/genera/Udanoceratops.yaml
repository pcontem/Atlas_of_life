fossil_material:
  holotype: Partial skeleton of an adult encased in calcium carbonate, found in the 1980s by the Joint Soviet-Mongolian
    expedition (collection number not given in the sources used) — Djadokhta Formation, Udan-Bayr locality, Mongolia.
  material: Holotype only; the incomplete skull was probably 60–70 cm long.
  completeness: partial
  exceptional: ''
biology: Very deep and robust lower jaw, possibly strong enough to cleave bone; the holotype bears damage to its
  mandible that may have been caused by such a bite.
