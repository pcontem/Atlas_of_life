name: Baminornis
rank: genus
parent: avialae
incertae_sedis: true
placement_note: Described as the earliest short-tailed bird with a pygostyle (Chen et al. 2025); later authors reinterpreted
  the structure as part of the synsacrum (Brusatte 2025 commentary and later work).
authority: Chen et al. 2025
type_species: Baminornis zhenghensis
type_species_note: The only valid species listed by PBDB.
summary: Late Jurassic avialan from the Nanyuan Formation of Fujian, China, first described as the oldest bird with
  a pygostyle.
