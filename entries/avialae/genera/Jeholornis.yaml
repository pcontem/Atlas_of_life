fossil_material:
  holotype: An articulated skeleton of J. prima from the Jiufotang Formation, Hebei (number in Zhou and Zhang 2002).
  material: Many specimens from the Jiufotang and Yixian formations, including the types of J. palmapenis and J.
    curvipes.
  completeness: multiple
  exceptional: Feather impressions; plant seeds associated with the gut.
biology: Few small blunt teeth and seeds of cycads, Ginkgo or similar plants in the gut show a seed-eating diet;
  legs not built for running.
