name: Jixiangornis
rank: genus
parent: jeholornithiformes
incertae_sedis: true
placement_note: Described as close to Jeholornis; Lefèvre et al. (2014) found it closer to Pygostylia, while Wang
  et al. (2020) kept it among jeholornithiforms.
authority: Ji et al. 2002
type_species: Jixiangornis orientalis
type_species_note: The only valid species listed by PBDB.
summary: Toothless long-tailed avialan from the Yixian Formation of China, known from one juvenile skeleton.
