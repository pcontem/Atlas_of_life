formations: []
fossil_material:
  holotype: The Solnhofen Specimen (BSP 1999), found near Eichstätt in the 1960s and first described in 1988 as
    Archaeopteryx; now in the Bürgermeister-Müller-Museum, Solnhofen.
  material: Known only from the holotype skeleton.
  completeness: partial
  exceptional: ''
biology: Differed from Archaeopteryx chiefly in its shorter tail and fourth toe; Mayr and colleagues (2007) and
  others regard it as a specimen of Archaeopteryx lithographica, while Senter and Robins (2003) supported a separate
  genus.
