fossil_material:
  holotype: The genus was named by Meyer (1861) for an isolated feather from the Solnhofen limestone; the name-bearing
    specimen of A. lithographica is to be confirmed in the literature.
  material: About a dozen skeletons and the isolated feather from the Tithonian limestones of southern Germany;
    teeth from Spain and France are referred to archaeopterygids.
  completeness: multiple
  exceptional: Feather impressions, including asymmetrical flight feathers.
biology: Had small teeth, three clawed fingers, a long bony tail and broad rounded wings with modern-type flight
  feathers; lived on islands of a shallow tropical European archipelago.
