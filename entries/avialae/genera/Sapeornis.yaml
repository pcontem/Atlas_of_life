type_species_note: The only valid species listed by PBDB.
summary: Large short-tailed early bird from the Early Cretaceous of China with long wings and teeth only at the
  upper jaw tip.
size:
  length_m: [0.3, 0.33]
  note: About 30–33 cm long without the tail feathers (Wikipedia revision cited).
