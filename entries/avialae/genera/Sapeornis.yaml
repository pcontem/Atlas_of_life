fossil_material:
  holotype: An incomplete skeleton from the Jiufotang Formation at Shangheshou near Chaoyang, Liaoning, found in
    2000 (number in Zhou and Zhang 2002).
  material: Several specimens from the Jiufotang and Yixian formations.
  completeness: multiple
  exceptional: Gastroliths in IVPP V12375.
biology: A handful of teeth in the upper jaw tip and small gastroliths in one specimen; arms about one and a half
  times the leg length suggest a large wing area, though the shoulder girdle seems poorly suited to flapping.
