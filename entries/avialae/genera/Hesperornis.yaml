fossil_material:
  holotype: Material named by Marsh (1872) from the Niobrara Chalk of Kansas (specimen in the original description).
  material: Many specimens from marine rocks of North America and Eurasia.
  completeness: multiple
  exceptional: ''
biology: Had teeth set in grooves along with a beak and swam by its feet like cormorants; it could hardly move on
  land.
