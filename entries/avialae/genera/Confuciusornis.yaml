fossil_material:
  holotype: IVPP V11553, a nearly complete adult skeleton of C. sanctus with a pair of long tail feathers and the
    impression of the horny beak; paratype IVPP 11521 is fragmentary.
  material: Very many specimens from the Yixian and Jiufotang formations, many with feathers.
  completeness: multiple
  exceptional: Feathers, including the long paired tail streamers of some individuals.
biology: Had a toothless beak; how it fed and flew is still debated in the cited literature.
