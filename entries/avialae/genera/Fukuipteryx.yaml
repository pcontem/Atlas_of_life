name: Fukuipteryx
rank: genus
parent: avialae
incertae_sedis: true
placement_note: Imai et al. (2019) recovered it as a non-ornithothoracine avialan with a pygostyle, outside the
  main pygostylian lineages; its exact position is unresolved.
