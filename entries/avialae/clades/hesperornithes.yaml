parent: ornithurae
wikipedia: Hesperornithes
summary: Toothed foot-propelled diving birds of Cretaceous seas and fresh waters, many flightless.
diagnosis:
- Short femur and metatarsus with a long tibia, legs set far back on the body
- Vestigial wings in the larger hesperornithids
notes: Smaller basal forms (Enaliornithidae, Brodavidae) may have flown. They lived in the Northern Hemisphere;
  the families named within the group are not separated in the atlas.
