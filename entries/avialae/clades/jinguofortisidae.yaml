id: jinguofortisidae
name: Jinguofortisidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Jinguofortisidae, family), downloaded 2026-11-27
parent: pygostylia
wikipedia: Jinguofortisidae
summary: Early Cretaceous pygostylians from northern China with the scapula and coracoid fused into one bone.
diagnosis:
- Scapula and coracoid fused into a scapulocoracoid
- Boomerang-shaped furcula without a hypocleidium
- Minor metacarpal strongly bowed; alular digit ending level with the end of the major metacarpal
notes: Erected by Wang and colleagues (2018) for Jinguofortis and Chongmingia; Cratonavis (Li et al. 2023) was found
  as the sister taxon of Chongmingia.
