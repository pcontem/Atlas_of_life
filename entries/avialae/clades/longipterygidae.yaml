id: longipterygidae
name: Longipterygidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Longipterygidae, family), downloaded 2026-11-27
parent: enantiornithes
wikipedia: Longipterygidae
summary: Early Cretaceous enantiornitheans from China with a very long snout carrying teeth only at its tip.
diagnosis:
- Toothed snout making up more than 60 percent of the skull, with teeth restricted to the jaw tips
- Pygostyle longer than the foot bones; toes of even length joined at the same level
notes: All definitive specimens come from the Yixian and Jiufotang formations (about 125-120 million years ago);
  Gorgonavis from Spain may belong to the family.
