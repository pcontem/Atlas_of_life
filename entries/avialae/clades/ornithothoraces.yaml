parent: pygostylia
wikipedia: Ornithothoraces
summary: The clade of Enantiornithes and Euornithes, birds with a modern flight apparatus in the chest.
diagnosis:
- Large keeled breastbone (possibly evolved convergently in the two branches)
- Elongated coracoids, a modified shoulder joint and a semi-rigid rib cage
notes: The oldest known members, the enantiornitheans Protopteryx, Eopengornis and Cruralispennia and the euornithine
  Archaeornithura, come from the Huajiying Formation of China, about 130.7 million years old; Noguerornis may be
  older.
