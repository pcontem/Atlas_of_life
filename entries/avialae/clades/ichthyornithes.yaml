summary: Toothed, tern-like flying birds of the Late Cretaceous of North America, very close to modern birds.
diagnosis: [Toothed jaws, Very close to the common ancestor of modern birds]
notes: First recorded about 95 million years ago (Cenomanian); only Ichthyornis and Janavis are known from fossils
