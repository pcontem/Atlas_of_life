taxon_rank_source: Paleobiology Database taxonomy (taxon Pygostylia, unranked clade), downloaded 2026-11-27
parent: avialae
wikipedia: Pygostylia
summary: Avialans with a short tail ending in a pygostyle, from Confuciusornis and its relatives to modern birds.
diagnosis:
- Short tail whose last vertebrae are fused into a pygostyle
- Long unfused bony tail of Archaeopteryx and other basal avialans lost
notes: Named by Chatterjee (1997) as an apomorphy-based group of short-tailed avialans; Chiappe later defined it
  as the node joining Confuciusornithidae and Neornithes, and both usages are still in use. In this atlas it holds
  Confuciusornithidae, Omnivoropterygidae (Sapeornis), Jinguofortisidae and Ornithothoraces.
