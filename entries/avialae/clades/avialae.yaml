wikipedia: Avialae
summary: The clade of birds and their closest relatives, all theropods nearer to living birds than to dromaeosaurids
  and troodontids.
diagnosis:
- Feathered wings used in flapping flight (the apomorphy-based definition of Gauthier 2001)
- Proatlas bones of the neck lost in most members, though still present in Archaeopteryx
notes: Definitions differ. Most authors use a branch-based clade (theropods closer to birds than to Deinonychus
  or Dromaeosaurus); the PhyloCode definition of Benito and colleagues (2022) also excludes troodontids, and Agnolín
  and Novas (2013) restricted the name to the smallest clade of Archaeopteryx and modern birds. Archaeopteryx, from
  the Late Jurassic of Germany, is usually treated as the earliest avialan capable of powered flight, although a
  few analyses (Hartman et al. 2019) place it and the anchiornithids outside the group. Avialans diversified widely
  in the Cretaceous; teeth were lost several times independently and the bony tail was shortened to a pygostyle
  in Pygostylia. In this atlas the crown group (Aves, the living birds and their Mesozoic members) is kept for the
  Aves volumes.
