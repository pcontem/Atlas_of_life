taxon_rank_source: Paleobiology Database taxonomy (taxon Enantiornithes, subclass), downloaded 2026-11-27
parent: ornithothoraces
wikipedia: Enantiornithes
summary: The "opposite birds", the most abundant and diverse avialans of the Cretaceous, mostly small, toothed and
  with clawed wing fingers.
diagnosis:
- Reversed shoulder joint, with the scapula forming the socket and the coracoid the ball
- Teeth and clawed fingers retained in almost all species
notes: Known only from the Cretaceous and spread across the globe; over seventy species have been named, many from
  fragmentary bones. Complete articulated specimens come mostly from Las Hoyas (Spain) and the Jehol Group (China),
  and hatchlings are preserved in Burmese amber. Families recognised in the atlas are Pengornithidae, Longipterygidae,
  Bohaiornithidae and Avisauridae; most other genera are placed directly in the clade, since proposed families such
  as Alexornithidae, Cathayornithidae and Gobipterygidae lack consensus support.
