id: songlingornithidae
name: Songlingornithidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Songlingornithidae, family), downloaded 2026-11-27
parent: ornithuromorpha
wikipedia: Songlingornithidae
summary: Early Cretaceous ornithuromorphs from the Yixian and Jiufotang formations of China, including Yanornis.
diagnosis:
- Mosaic of modern features (pygostyle with a fan of tail feathers) and primitive ones (gastralia, pubic symphysis)
- Toothed jaws
notes: Named by Hou (1997) for Songlingornis; the later name Yanornithidae is a junior synonym. Some studies include
  the hongshanornithids, and one found Hollanda from Mongolia inside the group.
