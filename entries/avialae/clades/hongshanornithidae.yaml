parent: ornithuromorpha
wikipedia: Hongshanornithidae
summary: Small toothed ornithuromorphs of the Early Cretaceous of China with long legs, probably waders.
diagnosis:
- Legs long in proportion to the wings
- Teeth in the jaws and probably no beak
notes: Defined as the node joining Hongshanornis longicresta and Longicrusavis houi. Since 2012 several studies
  have found them close to the songlingornithids.
