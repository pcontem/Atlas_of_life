id: archaeopterygidae
name: Archaeopterygidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Archaeopterygidae, family, Huxley 1871), downloaded 2026-11-27
parent: avialae
wikipedia: Archaeopterygidae
summary: Long-tailed, toothed early birds from the latest Jurassic and earliest Cretaceous of Europe, usually limited
  to Archaeopteryx and Wellnhoferia.
diagnosis:
- Jaws with small teeth and a long bony tail, as in other dinosaurs of the time
- Three separate clawed fingers on each hand, with asymmetrical flight feathers of modern bird structure
notes: Xu and colleagues (2011) defined the clade as all animals closer to Archaeopteryx than to the house sparrow
  or Dromaeosaurus. Protarchaeopteryx and Jinfengopteryx, once referred here, are now treated as an oviraptorosaur
  and a troodontid; Jurapteryx is probably a synonym of Archaeopteryx. A few analyses have placed Anchiornis and
  Xiaotingia in the family, but most later studies keep them in Anchiornithidae, and some (Hartman et al. 2019)
  put the archaeopterygids outside Avialae. Teeth from the Berriasian of Cherves-de-Cognac and Angeac-Charente in
  France are attributed to the family (Louchart et al. 2017). PBDB treats Archaeopterygidae as an invalid subgroup
  of Avialae; the family is kept here following the cited literature.
