summary: Toothless or nearly toothless Early Cretaceous ornithuromorphs from China related to Schizooura.
diagnosis:
- Low mandibular symphysis without teeth in the type genus
- Robust furcula with a well-developed hypocleidium and broad coracoids
notes: Named by Zelenkov (2015); the same name given by Wang and colleagues (2019) with Mengciusornis is a junior
  synonym.
