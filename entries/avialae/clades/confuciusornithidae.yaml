parent: pygostylia
wikipedia: Confuciusornithidae
summary: Toothless, beaked pygostylians of the Early Cretaceous of northern China, best known from the abundant
  Confuciusornis.
diagnosis:
- Toothless jaws with enlarged premaxilla and dentary carrying a horny beak
- Pectoral girdle and forelimbs much as in Archaeopteryx, with large clawed fingers
notes: Usually placed as the sister group of Ornithothoraces. Confuciusornithids had both shafted and unshafted
  feathers; the family contains four genera in the cited revision.
