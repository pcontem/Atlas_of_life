id: omnivoropterygidae
name: Omnivoropterygidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Omnivoropterygidae, family), downloaded 2026-11-27
parent: pygostylia
wikipedia: Omnivoropterygidae
summary: Short-tailed early birds from the Jiufotang Formation of China with teeth in the upper jaw only, including
  Sapeornis.
diagnosis:
- Short skeletal tail
- Unusual skull with teeth in the upper but not the lower jaw
notes: Named by Czerkas and Ji (2002); its junior synonym Sapeornithidae (2006) is often used instead. Possible
  members are reported from the Maastrichtian Maevarano Formation of Madagascar. Their dentition has been taken
  as a sign of an omnivorous diet.
