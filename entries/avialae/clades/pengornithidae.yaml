id: pengornithidae
name: Pengornithidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Pengornithidae, family), downloaded 2026-11-27
parent: enantiornithes
wikipedia: Pengornithidae
summary: Early Cretaceous enantiornitheans from China with many small teeth, stout legs and a short rounded pygostyle.
diagnosis:
- Short, rounded pygostyle instead of the long blade-shaped one of other enantiornitheans
- Hooked outgrowth on the shoulder blade and only two backward projections on the breastbone
notes: Their stiff tail feathers and grasping feet suggest a woodpecker-like tail and climbing habits. Falcatakely
  from the Late Cretaceous of Madagascar may belong here.
