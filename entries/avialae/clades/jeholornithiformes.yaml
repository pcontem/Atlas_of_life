id: jeholornithiformes
name: Jeholornithiformes
rank: clade
taxon_rank: order
taxon_rank_source: Paleobiology Database taxonomy (taxon Jeholornithiformes, order), downloaded 2026-11-27
parent: avialae
wikipedia: Jeholornithidae
summary: Large long-tailed early birds from the Early Cretaceous of China, usually placed as the sister group of
  Pygostylia.
diagnosis:
- Long bony tail, unlike the short pygostyle-tipped tails of more derived birds
- Few small teeth in the jaws
notes: Wang and colleagues (2020) defined the group as the most inclusive clade containing Jeholornis prima but
  not living birds and found moderate support for it in the description of Kompsornis. Whether most of its named
  taxa are distinct from Jeholornis, and whether the group is monophyletic, is still debated.
