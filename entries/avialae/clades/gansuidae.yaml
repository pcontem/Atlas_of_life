wikipedia: Gansuidae
summary: Early Cretaceous shorebird-like ornithuromorphs from China, built around Gansus.
diagnosis:
- Slender toes with a long fourth digit
- Laterally compressed tarsometatarsus, shorter than the third and fourth digits
notes: Established for Gansus by Hou and Liu (1984); the description of Shuilingornis (2024) recovered a clade with
  Gansus, Changzuiornis, Iteravis and Khinganornis, all Aptian.
