wikipedia: Ornithurae
summary: Modern birds and their closest relatives, the ichthyornithines and hesperornithines.
diagnosis:
- Short fused pygostyle tail of modern-bird type ("bird tail" of Haeckel)
- Defined as the smallest clade of Ichthyornis dispar, Hesperornis regalis and Vultur gryphus (Benito et al. 2022)
notes: Coined by Haeckel (1866). The crown group Aves (Neornithes) belongs here; in this atlas it is kept for the
  Aves volumes and appears as a group of the tree outline below Ornithurae.
