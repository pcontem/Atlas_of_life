parent: enantiornithes
wikipedia: Avisauridae
summary: Large late enantiornithines from the Late Cretaceous, known mostly from foot bones.
diagnosis:
- Tarsometatarsus not completely fused, the outer ends of the metatarsals separate
- Inner edge of the third metatarsal trochlea with a downward-pointing plantar projection
notes: Used either for a broad group of advanced enantiornithines (Cau and Arduini 2008) or for a small family close
  to Avisaurus; the atlas follows the narrow usage and places only genera the cited revision assigns to it.
