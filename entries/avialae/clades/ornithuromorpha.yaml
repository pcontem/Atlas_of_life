id: ornithuromorpha
name: Ornithuromorpha
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Ornithuromorpha, unranked clade), downloaded 2026-11-27
parent: ornithothoraces
wikipedia: Euornithes
summary: The branch of birds closer to modern birds than to the enantiornitheans, from Early Cretaceous waders to
  living birds.
diagnosis:
- The first fully modern pygostyles, with a fan of tail feathers (eight rectrices in Yixianornis)
- Gastralia and a pubic symphysis still present in the earliest members
notes: The English Wikipedia article treats it under Euornithes, defined in the PhyloCode (Benito et al. 2022) as
  the largest clade containing Vultur gryphus but not Enantiornithes; PBDB uses Ornithuromorpha (Chiappe 1999).
  Many Early Cretaceous genera from China have unstable positions and are placed directly in the clade.
