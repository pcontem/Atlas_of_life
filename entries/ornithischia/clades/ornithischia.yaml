wikipedia: Ornithischia
summary: Extinct, mainly herbivorous dinosaurs with a bird-like, backward-pointing pubis, ranging from small early
  runners to armoured, horned and duck-billed giants.
diagnosis:
- A predentary bone at the tip of the lower jaw and a palpebral bone above the eye
- An opisthopubic pubis (pointing backward along the ischium), an increased number of sacral vertebrae and no gastralia
- Early members about 1 to 2 m long and bipedal, with forelimbs much shorter than hindlimbs
notes: Named by Seeley in 1888 for the “bird-hipped” pelvis, although birds descend from theropods and are only
  distantly related to the group. Ornithischians include the armoured Thyreophora, the horned and thick-skulled
  Marginocephalia and the Ornithopoda, found on every continent; some lineages are known from filament-like integument
  (Tianyulong, Psittacosaurus, Kulindadromeus). The placement of Heterodontosauria and of several early forms (Lesothosaurus,
  Eocursor, Laquintasaura, Pisanosaurus) is unsettled among recent analyses, so these sit directly in Ornithischia,
  marked incertae sedis where analyses disagree.
