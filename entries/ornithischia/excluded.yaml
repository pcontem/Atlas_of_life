- name: Stormbergia
  author: Butler 2005
  status: junior synonym
  ref: Stormbergia dangershoeki Butler 2005 is a junior subjective synonym of Lesothosaurus diagnosticus (Baron,
    Norman and Barrett 2017, as reported in English Wikipedia, 'Lesothosaurus', revision 1369993104)
  source: English Wikipedia
  parent: Lesothosaurus
  placement: the senior synonym named in the source
- name: Fabrosaurus
  author: Ginsburg 1964
  status: nomen dubium
  ref: Fabrosaurus australis Ginsburg 1964, based on a fragmentary dentary probably from Lesothosaurus, is regarded
    as a nomen dubium (English Wikipedia, "Lesothosaurus", revision 1369993104)
  source: English Wikipedia
  parent: Lesothosaurus
  placement: the genus whose material it probably represents (Lesothosaurus)
