name: Lesothosaurus
rank: genus
parent: ornithischia
incertae_sedis: true
placement_note: Recent analyses recover Lesothosaurus either as the basalmost neornithischian or as an early thyreophoran;
  it is therefore placed directly in Ornithischia (English Wikipedia revision cited, summarising the cladistic studies
  of basal Ornithischia).
authority: Galton 1978
type_species: Lesothosaurus diagnosticus
type_species_note: ''
summary: A lightly built, bipedal Early Jurassic ornithischian from Lesotho and South Africa, among the best known
  early members of the group.
size:
  length_m: [1, 2]
  note: Between 1 and 2 m long, according to the English Wikipedia revision cited.
