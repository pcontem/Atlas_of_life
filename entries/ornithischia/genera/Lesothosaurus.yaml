fossil_material:
  holotype: Syntypes NHMUK PV RU B17 (partial skeleton with skull) and NHMUK PV RU B23 (partial skull), collected
    in Lesotho in 1963-1964.
  material: Scores of specimens from the Upper Elliot Formation, including well-preserved skulls collected in 1967-68,
    and a bonebed described in 2016 with three large individuals.
  completeness: multiple
  exceptional: ''
biology: Lightly built and bipedal, with simpler teeth and jaws than later ornithischians. Low tooth wear suggests
  an opportunistic omnivore that ate mainly small animals when soft plants were scarce; the bonebed may show life
  in groups.
