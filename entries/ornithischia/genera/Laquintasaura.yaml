fossil_material:
  holotype: Not given in the sources used; the material comes from one bonebed in the La Quinta Formation, near
    La Grita and Seboruco, Táchira, Venezuela.
  material: Hundreds of fossil elements representing at least four individuals, all from a single bonebed.
  completeness: multiple
  exceptional: ''
biology: Triangular teeth with striations and sharp denticles may have supported an omnivorous diet, and the animals
  probably lived in groups on a seasonal alluvial plain where the theropod Tachiraptor also lived.
