name: Laquintasaura
rank: genus
parent: ornithischia
incertae_sedis: true
placement_note: Conflicting hypotheses make it either an early-diverging ornithischian or a member of Thyreophora
  (English Wikipedia revision cited); it is placed directly in Ornithischia.
authority: Barrett et al. 2014
type_species: Laquintasaura venezuelae
type_species_note: ''
summary: A lightly built Early Jurassic ornithischian from the La Quinta Formation of Venezuela, known from a single
  bonebed.
size:
  length_m: [1, 1]
  note: About 1 m, estimated from the largest femur (90 mm) by comparison with Hypsilophodon, Heterodontosaurus
    and Hexinlusaurus.
