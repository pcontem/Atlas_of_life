name: Agilisaurus
rank: genus
parent: ornithischia
incertae_sedis: true
placement_note: Basal neornithischian in most analyses, but some recover related taxa as basal ornithopods or elsewhere
  (English Wikipedia revision of Lesothosaurus); placed directly in Ornithischia.
authority: Peng 1990
type_species: Agilisaurus louderbacki
type_species_note: ''
summary: A small, agile Middle Jurassic ornithischian from Sichuan, China, about 1.2 to 1.7 m long with leaf-shaped
  teeth.
size:
  length_m: [1.2, 1.7]
  mass_kg: [40, 40]
  note: 1.2 to 1.7 m long, 60 cm high at the hip and about 40 kg, according to the English Wikipedia revision cited.
