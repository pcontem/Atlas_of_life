fossil_material:
  holotype: MPM-10001A, a relatively complete articulated skeleton missing the rear of the skull, the tail and the
    hands.
  material: A tiny bone fragments and teeth in the matrix, probably from a neonate.
  completeness: near-complete
  exceptional: Teeth and bone fragments of a probable newly hatched individual found with the holotype.
biology: Has mineralized plates along the ribs; a neonate may have been with the adult.
