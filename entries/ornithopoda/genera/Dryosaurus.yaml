fossil_material:
  holotype: Not read in the sources consulted; first remains found by S. W. Williston in 1876 in Albany County,
    Wyoming, and named by O. C. Marsh in 1878.
  material: Many specimens, including a second species, Dryosaurus elderae, named by Carpenter and Galton in 2018.
  completeness: multiple
  exceptional: ''
biology: A long neck, long slender legs and a long stiff tail, a horny beak and cheek teeth with a strong median
  ridge on the outer surface; the genus name refers to a forested habitat.
