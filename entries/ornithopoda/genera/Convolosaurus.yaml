fossil_material:
  holotype: SMU 72834, from the Twin Mountains Formation at Proctor Lake, Comanche County, Texas.
  material: 488 specimens by 2019, representing at least 29 individuals.
  completeness: multiple
  exceptional: A bonebed rich in juveniles, interpreted as a flock caught in one event.
biology: The name means "flocking lizard", after the concentration of juvenile fossils; earlier studies read the
  site as evidence of group behaviour.
