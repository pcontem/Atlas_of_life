name: Ouranosaurus
rank: genus
parent: ankylopollexia
incertae_sedis: true
placement_note: PBDB places Ouranosaurus in Neoiguanodontia, a child of Ankylopollexia, whereas English Wikipedia
  calls it a basal hadrosauriform; the deepest atlas clade both share is Ankylopollexia.
authority: Taquet 1972
type_species: Ouranosaurus nigeriensis
type_species_note: ''
summary: A sail-backed basal hadrosauriform from the Early Cretaceous of Niger, Cameroon and nearby areas, about
  7-8 m long.
