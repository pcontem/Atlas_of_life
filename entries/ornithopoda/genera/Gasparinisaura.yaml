fossil_material:
  holotype: MUCPv-208, from near Cinco Saltos, Río Negro Province, Argentina, found in 1992.
  material: Paratype MUCPv-212 (tail with lower hindlimb) and three juvenile specimens (MUCPv 213, MCSPv 111 and
    MCSPv 112) described in 1997.
  completeness: multiple
  exceptional: Gastroliths found with all three juvenile specimens (described 2008).
biology: A herbivore with about twelve rather large teeth in each jaw and a round, moderately elongated head; gastroliths
  show it used stomach stones.
