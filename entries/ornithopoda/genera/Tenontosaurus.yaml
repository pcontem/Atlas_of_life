fossil_material:
  holotype: Not read in the sources consulted; first fossils found in Big Horn County, Montana, in 1903, and the
    species named by John Ostrom in 1970.
  material: Dozens of specimens from the Cloverly Formation and other units, plus a second species, T. dossi (Winkler
    et al. 1997), known from a few specimens in Texas.
  completeness: multiple
  exceptional: ''
biology: The back and tail were stiffened by a network of bony tendons; its abundant remains have been used to study
  ontogeny, predator-prey relations and the Cloverly ecosystem.
