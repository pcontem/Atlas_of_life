id: rhabdodontomorpha
name: Rhabdodontomorpha
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Rhabdodontomorpha, unranked clade), downloaded 2026-11-16;
  node-based clade of Dieudonné et al. 2016
parent: iguanodontia
wikipedia: Rhabdodontomorpha
summary: Early-diverging iguanodontians of Europe and Gondwana, from small to large plant eaters, including the
  rhabdodontids and the muttaburrasaurids.
diagnosis:
- Dorsal margin of the ilium sigmoidal in dorsal view, with the postacetabular process turned inward and the preacetabular
  process outward
- Ischiac peduncle of the ilium lens-shaped and unusually long front to back, with a noticeably low acetabulum
notes: Named in 2016 by Dieudonné and colleagues, who defined it as the group containing Rhabdodon priscus and Muttaburrasaurus
  langdoni and all descendants of their last common ancestor. Madzia and colleagues redefined it under the PhyloCode
  in 2021. Tenontosaurus and its relatives have been recovered tentatively as basal members, a North American radiation;
  the more inclusive Rhabdodontoidea was named by Poole in 2022. The lineage probably split from other iguanodontians
  in the Middle Jurassic.
