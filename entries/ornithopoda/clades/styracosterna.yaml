parent: ankylopollexia
wikipedia: Ankylopollexia
summary: Derived ankylopollexians, from the thumb-spiked iguanodonts of the Early Cretaceous to the hadrosauroids.
diagnosis:
- Many basal members have a large conical spike as the thumb ungual
- During the Early Cretaceous the members became increasingly quadrupedal and larger, with matching changes in the
  skeleton
notes: 'Hadrosauroidea, and so Hadrosauridae, sits inside it (cladogram after McDonald 2012 on the Hadrosauroidea
  page). PBDB gives it as a child of Ankylopollexia, with Hadrosauriformes (Siamodon, Brighstoneus, Comptonatus
  and Hadrosauroidea) as one of its children. The atlas has no entry for Hadrosauriformes yet: its genera sit here.'
