id: elasmaria
name: Elasmaria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Elasmaria, unranked clade), downloaded 2026-11-16; defined
  as a clade by Madzia et al. 2021 and Fonseca et al. 2024
parent: euiguanodontia
wikipedia: Elasmaria
summary: Cretaceous ornithopods of the former Gondwana, many of them bipedal forms once called hypsilophodonts.
diagnosis:
- Known from Cretaceous deposits of South America, Antarctica and Australia, and possibly Africa
- Named for Macrogryphosaurus and Talenkauen, which carry mineralized plates on the ribs
notes: Coined by Calvo and colleagues in 2007 for Macrogryphosaurus and Talenkauen. A 2016 study describing Morrosaurus
  found the group to be much larger, a variety of Southern Hemisphere ornithopods. Madzia and colleagues defined
  it under the PhyloCode in 2021 and Fonseca and colleagues redefined it in 2024 so that it includes more related
  taxa.
