parent: hadrosauroidea
wikipedia: Hadrosauridae
summary: The duck-billed dinosaurs, herbivorous ornithopods with dental batteries that dominated Late Cretaceous
  Asia and North America.
diagnosis:
- Teeth stacked into complex dental batteries that formed grinding surfaces
- Predentary bone and a backward-pointing pubis, as in other ornithischians
- 'Facultative bipeds: young of some species walked mostly on two legs, adults mostly on four'
notes: 'Named by Cope in 1869. Two principal subfamilies are recognised: Lambeosaurinae, with hollow cranial crests
  or tubes, and Saurolophinae (the Hadrosaurinae of most pre-2010 works), which lacked hollow crests. The name Hadrosaurinae
  was restricted to Hadrosaurus or dropped when Prieto-Márquez (2010) found that genus to lie outside the traditional
  group. Hadrosaurids descend from Late Jurassic or Early Cretaceous iguanodontians and spread in the last stage
  of the Cretaceous to Europe, Africa, South America and possibly Antarctica.'
