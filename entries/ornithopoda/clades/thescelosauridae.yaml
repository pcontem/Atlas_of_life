id: thescelosauridae
name: Thescelosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Thescelosauridae, family), downloaded 2026-11-16
parent: ornithopoda
wikipedia: Thescelosauridae
summary: Small to medium-sized bipedal neornithischians of the Cretaceous of East Asia and North America.
diagnosis:
- Small to medium-sized bipedal neornithischians
- Cretaceous fossils from East Asia and North America
notes: The name was used by Sternberg in 1937 but only defined as a clade in 2013 by Brown and colleagues, for Thescelosaurus
  and Orodromeus. It replaces the traditional Hypsilophodontidae, now understood as an informal grade. Parksosauridae,
  named by Buchholz in 2002, overlaps it, and placement of the group inside Neornithischia differs between analyses;
  here it is kept in Ornithopoda following the volume scope, with disputed members marked incertae sedis.
