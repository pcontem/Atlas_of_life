id: iguanodontidae
name: Iguanodontidae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Iguanodontidae, family, Bonaparte 1850), downloaded 2026-11-25
parent: styracosterna
wikipedia: Iguanodontidae
summary: Large iguanodontians of the Early Cretaceous, the family of Iguanodon, whose monophyly is disputed.
diagnosis:
- Elongated maxillae, a convex skull roof and a reduced antorbital fenestra
- Hoof-like second, third and fourth digits, in some a specialised thumb spike; both bipedal and quadrupedal locomotion
  are evidenced
notes: 'Defined under the PhyloCode (Madzia et al. 2021) as the largest clade containing Iguanodon bernissartensis
  but not Hadrosaurus foulkii. There is no consensus on its phylogeny: it is most often found paraphyletic with
  respect to Hadrosauridae, although some researchers argue for monophyly. PBDB lists Bolong and Barilium in it
  but puts Iguanodon itself directly in Ankylopollexia; here Iguanodon, the type genus, sits in it by definition,
  and Bolong, which English Wikipedia calls a basal hadrosauroid, sits in Styracosterna as incertae sedis.'
