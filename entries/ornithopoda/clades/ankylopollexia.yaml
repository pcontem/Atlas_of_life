id: ankylopollexia
name: Ankylopollexia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Ankylopollexia, unranked clade, Sereno 1986), downloaded
  2026-11-25
parent: dryomorpha
wikipedia: Ankylopollexia
summary: Thumb-spiked iguanodontians of the Late Jurassic to the end of the Cretaceous, from Camptosaurus to the
  duck-billed hadrosaurs.
diagnosis:
- A conical thumb spine is the most likely synapomorphy of the clade (Sereno 1986)
- Herbivores that first appear about 156 million years ago and spread worldwide in the Cretaceous, becoming large
  (the largest, Shantungosaurus, was a hadrosaurid)
notes: Sereno defined it in 1986 through Camptosauridae and Styracosterna; the 2005 phylogenetic definition is the
  last common ancestor of Camptosaurus dispar and Parasaurolophus walkeri and all its descendants. It contains the
  subclades Camptosauridae and Styracosterna, which together with Ankylopollexia form a node-stem triplet. The group
  died out at the end of the Maastrichtian.
