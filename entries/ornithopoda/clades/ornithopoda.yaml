wikipedia: Ornithopoda
summary: Herbivorous ornithischians from small bipedal runners to large duck-billed forms, found worldwide and most
  diverse in the Cretaceous.
diagnosis:
- Birdlike feet; no body armour; an elongated pubis; no mandibular fenestra in the lower jaw
- Primitive members small and bipedal, derived Iguanodontia larger and facultatively or obligately quadrupedal
- A chewing apparatus that became the most elaborate of any non-avian dinosaur, peaking in the hadrosaurids
notes: Named by Marsh in 1881 for the “bird feet” of its members. Early members were about a metre long; the largest,
  such as Shantungosaurus, reached about 15 m and roughly 23 tonnes. The old family Hypsilophodontidae is a paraphyletic
  grade, not a clade, so small bipedal neornithischians are placed by recent analyses rather than lumped here. Dental
  microwear suggests early members browsed and derived iguanodontians fed in bulk on tougher plants. Part of this
  volume sits in the clades below; genera whose position among them is disputed are marked incertae sedis within
  Ornithopoda.
