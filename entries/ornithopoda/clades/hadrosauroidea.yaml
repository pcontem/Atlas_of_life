parent: styracosterna
wikipedia: Hadrosauroidea
summary: The duck-billed dinosaurs (Hadrosauridae) and all dinosaurs closer to them than to Iguanodon, found in
  Asia, Europe, Africa and the Americas.
diagnosis:
- Includes Hadrosauridae and every dinosaur more closely related to Hadrosaurus than to Iguanodon (PhyloCode definition,
  Madzia et al. 2021)
- Remains are known from Asia, Europe, Africa and the Americas
notes: Many primitive members (for example Probactrosaurus and Altirhinus) used to sit in a paraphyletic Iguanodontidae;
  after cladistic analysis the traditional Iguanodontidae has been largely disbanded. Ramírez-Velasco and colleagues
  (2012) found a large polytomy among hadrosauroids more derived than Probactrosaurus but less derived than Hadrosauridae.
  PBDB gives it as a child of Hadrosauriformes and lists Telmatosauridae, Hadrosauridae and about 40 genera in it.
