id: lambeosaurinae
name: Lambeosaurinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Lambeosaurinae, subfamily), downloaded 2026-11-16
parent: hadrosauridae
wikipedia: Lambeosaurinae
summary: Crested hadrosaurids whose skulls carry hollow crests or tubes.
diagnosis:
- Hollow cranial crests or tubes housing nasal passages
- Sub-groups include the aralosaurins, tsintaosaurins, lambeosaurins and parasaurolophins
notes: 'Named in 1923 by Parks. European lambeosaurines vary widely in size: Minqaria adults reached about 3.5 m,
  whereas Pararhabdodon had an adult size similar to relatives on other continents. Recent work recovers a Tsintaosaurini
  clade including Pararhabdodon and Tsintaosaurus.'
