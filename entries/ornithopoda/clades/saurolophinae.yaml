id: saurolophinae
name: Saurolophinae
rank: clade
taxon_rank: subfamily
taxon_rank_source: Paleobiology Database taxonomy (taxon Saurolophinae, subfamily), downloaded 2026-11-16
parent: hadrosauridae
wikipedia: Saurolophinae
summary: Hadrosaurids without hollow cranial crests, the group traditionally called Hadrosaurinae.
diagnosis:
- Largely non-crested hadrosaurids, though solid crests occur in some forms
- Sister group of the crested Lambeosaurinae within Hadrosauridae
notes: Defined as a clade by Prieto-Márquez in 2010, who showed that the type of Hadrosaurinae, Hadrosaurus foulkii,
  almost never fell inside the traditional group. A recent analysis places Hadrosaurus within the group of all non-lambeosaurine
  hadrosaurids, which would resurrect Hadrosaurinae, so the arrangement is disputed.
