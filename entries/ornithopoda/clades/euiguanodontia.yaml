id: euiguanodontia
name: Euiguanodontia
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Euiguanodontia, unranked clade, Coria and Salgado 1996),
  downloaded 2026-11-25
parent: iguanodontia
wikipedia: Ornithopoda
summary: Iguanodontians more derived than the rhabdodontomorphs, grouping Elasmaria, Dryomorpha and a few basal
  genera.
diagnosis:
- In the 2024 analysis of Fonseca and colleagues it includes Elasmaria and Dryomorpha (Dryosauridae plus Ankylopollexia),
  as well as Anabisetia, Diluvicursor, Gasparinisaura, Notohypsilophodon and Iyuku
- Excludes Rhabdodontomorpha, which holds Tenontosauridae and Rhabdodontoidea in that analysis
notes: Named by Coria and Salgado in 1996 (PBDB). The sources give no anatomical diagnosis; the group is defined
  by the phylogeny. PBDB lists Callovosaurus, Iyuku, Dryomorpha and Elasmaria as its direct children.
