id: iguanodontia
name: Iguanodontia
rank: clade
taxon_rank: infraorder
taxon_rank_source: Paleobiology Database taxonomy (taxon Iguanodontia, infraorder, Baur 1891), downloaded 2026-11-25
parent: ornithopoda
wikipedia: Ornithopoda
summary: Ornithopods that include the iguanodonts and the duck-billed hadrosaurs, the most derived, largest and
  most quadrupedal members of the group.
diagnosis:
- Advanced members became quadrupedal and developed large body size, unlike the small bipedal primitive ornithopods
- Defined under the PhyloCode (Madzia et al. 2021) as the smallest clade containing Dryosaurus altus, Iguanodon
  bernissartensis, Rhabdodon priscus and Tenontosaurus tilletti, provided it does not include Hypsilophodon foxii
notes: Sereno defined it in 1998 as the most inclusive group containing Parasaurolophus walkeri but not Hypsilophodon
  foxii; the 2021 definition limits it to its traditionally included species. English Wikipedia lists it as an infraorder
  within a suborder Ornithopoda, whereas Benton (2004) treats Ornithopoda as an infraorder and does not rank Iguanodontia.
  The traditional Iguanodontoidea and Iguanodontidae are a paraphyletic grade leading to the hadrosaurs, so many
  of their genera now sit in Hadrosauroidea.
