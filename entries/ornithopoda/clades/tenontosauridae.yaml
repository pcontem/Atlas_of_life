id: tenontosauridae
name: Tenontosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Tenontosauridae, family, Fonseca et al. 2024), downloaded
  2026-11-25
parent: rhabdodontomorpha
wikipedia: Rhabdodontomorpha
summary: Tenontosaurus and its close relatives, basal rhabdodontomorphs that form a North American radiation.
diagnosis:
- Defined under the PhyloCode as the largest clade containing Tenontosaurus tilletti but not Hypsilophodon foxii,
  Iguanodon bernissartensis and Rhabdodon priscus
- Tentatively recovered as basal members of Rhabdodontomorpha
notes: Iani, described in 2023, is interpreted as a transitional taxon between Tenontosaurus and the rhabdodontids;
  PBDB lists it with Tenontosaurus and Convolosaurus in the family. The sources give no anatomical diagnosis.
