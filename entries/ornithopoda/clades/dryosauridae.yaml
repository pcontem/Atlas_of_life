parent: dryomorpha
wikipedia: Dryosauridae
summary: Fast-running, bipedal herbivorous ornithopods of the Middle Jurassic to Early Cretaceous of Africa, Europe
  and North America.
diagnosis:
- Cursorial, bipedal plant eaters adapted for running
- Fossil record from the Middle Jurassic to the Early Cretaceous in Africa, Europe and North America, perhaps extending
  to other southern continents
notes: Proposed in 1984 by Milner and Norman to unite Dryosaurus, Valdosaurus and possibly Parksosaurus and Mochlodon,
  separating them from the Hypsilophodontidae because they resembled hadrosaurids and iguanodontids more. Several
  genera once treated as dubious or as species of Dryosaurus (Callovosaurus, Dysalotosaurus, Elrhazosaurus, Valdosaurus)
  are now redescribed as valid. Madzia and colleagues defined the family under the PhyloCode in 2021 as the largest
  clade containing Dryosaurus altus but not Iguanodon bernissartensis.
