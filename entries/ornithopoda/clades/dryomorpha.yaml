id: dryomorpha
name: Dryomorpha
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Dryomorpha, unranked clade, Sereno 1986), downloaded 2026-11-25
parent: euiguanodontia
wikipedia: Ornithopoda
summary: Iguanodontians that unite the dryosaurids with the thumb-spiked ankylopollexians.
diagnosis:
- Named by Paul Sereno in 1986 and defined under the PhyloCode as the smallest clade containing Dryosaurus altus
  and Iguanodon bernissartensis
- Contains Dryosauridae and Ankylopollexia, with Oblitosaurus sister to Ankylopollexia, in the 2024 cladogram of
  Fonseca and colleagues
notes: PBDB lists Draconyx, Hesperonyx, Owenodon and Oblitosaurus beside Dryosauridae and Ankylopollexia as its
  children; English Wikipedia includes Hesperonyx in it. The sources give no anatomical diagnosis.
