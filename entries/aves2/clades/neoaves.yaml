summary: All living birds except palaeognaths and Galloanserae, almost 95 percent of living bird species.
diagnosis:
- Defined in the PhyloCode (Sangster et al. 2022) as the most inclusive crown clade containing Passer domesticus
  but not Gallus gallus
- Males lack the penis kept by waterfowl and palaeognaths (Anseriformes revision)
notes: This volume holds the waterbirds and shorebirds (Charadriiformes and Aequornithes); other neoavian orders,
  including the passerines still in the tree outline, follow in later volumes.
