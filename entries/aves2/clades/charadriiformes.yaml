wikipedia: Charadriiformes
summary: Shorebirds, gulls, terns and auks, a diverse order of about 390 living species.
diagnosis:
- Small to medium-large birds living mostly near water and feeding on invertebrates or other small animals
- Some pelagic seabirds, others desert or woodland birds
notes: Families with several genera in the atlas are separated; small families (oystercatchers, seedsnipes, painted-snipes,
  sheathbills, skuas, the crab-plover, ibisbill and plains-wanderer) and fossil genera of uncertain family sit directly
  in the order.
