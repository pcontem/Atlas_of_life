wikipedia: Thyreophora
summary: The armoured ornithischians, carrying rows of keeled bony scutes along the body from the Early Jurassic
  to the end of the Cretaceous, made up of the stegosaurs, the ankylosaurs and their early relatives.
diagnosis:
- Osteoderms (bony growths in the skin) with lateral keels, lined up in longitudinal rows along the body
- Skull and jaw characters including a wide jugal, remodelled dermal skull bone and a down-turned dentary tooth
  row
- Fore limbs much shorter than the hindlimbs; stegosaurs and ankylosaurs were obligate quadrupeds, whereas the early
  Scutellosaurus was probably mostly bipedal
notes: Named by Nopcsa in 1915 and defined as a clade by Sereno in 1998 as the genasaurs closer to Ankylosaurus
  than to Triceratops. It is the sister group of Cerapoda within Genasauria. Most authors keep it unranked, with
  Stegosauria and Ankylosauria as its two major subgroups, though it is sometimes treated as a suborder. Early members
  such as Scutellosaurus and Scelidosaurus have simple, low, keeled scutes; later forms evolved spikes and plates.
