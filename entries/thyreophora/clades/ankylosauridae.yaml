taxon_rank_source: Paleobiology Database taxonomy (taxon Ankylosauridae, family), downloaded 2026-11-16
parent: ankylosauria
wikipedia: Ankylosauridae
summary: The tail-club ankylosaurs of the Cretaceous of North America, Europe and Asia, sister group of the nodosaurids.
diagnosis:
- A tail club made of interlocking distal caudal vertebrae and enlarged, bulbous osteoderms
- A short, domed snout with wedge-shaped, horn-like osteoderms on the skull
- Only two collars of armour plates on the neck, where nodosaurids have three
- An S-shaped narial passage
notes: Barnum Brown named the family and the subfamily Ankylosaurinae in 1908, after Ankylosaurus was found in Montana
  in 1906. The oldest known members date to about 122 million years ago and the family ended at the Cretaceous-Paleogene
  extinction. They were obligate quadrupeds with leaf-shaped teeth and are known only from the Northern Hemisphere.
