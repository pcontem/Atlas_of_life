id: nodosauridae
name: Nodosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Nodosauridae, family), downloaded 2026-11-16
parent: ankylosauria
wikipedia: Nodosauridae
summary: The club-less armoured ankylosaurs of the Late Jurassic to Late Cretaceous of Asia, Europe and North America,
  often with spikes on the shoulders.
diagnosis:
- No mace-like tail club; the tail tip stayed more flexible
- Rows of bony armour nodules and spines (osteoderms) covered in keratin sheaths, often with shoulder spines projecting
  outward
notes: Marsh erected the family in 1890 on the genus Nodosaurus. Sereno defined it in 1998 as the ankylosaurs closer
  to Panoplosaurus than to Ankylosaurus. Some analyses recover it as a paraphyletic grade leading to the ankylosaurids,
  and a 2023 review splits it into several families (see Ankylosauria). The Borealopelta holotype preserves armour
  in life position with skin and keratin showing a reddish, countershaded pattern.
