taxon_rank_source: Paleobiology Database taxonomy (taxon Ankylosauria, unranked clade), downloaded 2026-11-16
parent: thyreophora
wikipedia: Ankylosauria
summary: Heavily armoured, bulky quadrupedal herbivores covered in bony osteoderms, known from the Middle Jurassic
  to the end of the Cretaceous.
diagnosis:
- Small and large bony shields fused together to cover the back and sides, fused to the skull bones on the head
- Bulky quadrupeds with short, powerful limbs
- Dorsal ribs that fit snugly against the vertebrae
notes: 'Named by Osborn in 1923, and usually ranked as a suborder or infraorder in Linnaean schemes. The two main
  families, Nodosauridae and Ankylosauridae, are mainly from the Northern Hemisphere; the more basal Parankylosauria
  are known from Cretaceous southern Gondwana, though they may instead be a separate lineage of thyreophorans outside
  Ankylosauria and Stegosauria. A 2023 review rejects the traditional Ankylosauridae-Nodosauridae split and refers
  the nodosaurids to three families: Panoplosauridae, Polacanthidae and Struthiosauridae. The group is thought to
  have first appeared in North Africa in the Middle Jurassic.'
