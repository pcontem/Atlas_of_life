id: huayangosauridae
name: Huayangosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Huayangosauridae, family), downloaded 2026-11-16
parent: stegosauria
wikipedia: Stegosauria
summary: The Jurassic Chinese family of stegosaurians defined as the taxa closer to Huayangosaurus than to Stegosaurus,
  at or near the base of the stegosaur tree.
diagnosis:
- Teeth in the premaxilla, unlike the remaining stegosaurians
- An antorbital fenestra and a mandibular fenestra, also absent in the other stegosaurians
- Known from the Jurassic of China, first from the Middle Jurassic Shaximiao Formation
notes: Originally named as the subfamily Huayangosaurinae by Dong and colleagues in the description of Huayangosaurus
  (1982); it was later enlarged to include Chungkingosaurus from younger Late Jurassic beds of the Shaximiao Formation
  and was formally defined in 2021. The family is either the sister group of all other stegosaurs or close to the
  origin of the clade, with taxa such as Gigantspinosaurus or Isaberrysaura falling outside the split between it
  and Stegosauridae.
