id: stegosauridae
name: Stegosauridae
rank: clade
taxon_rank: family
taxon_rank_source: Paleobiology Database taxonomy (taxon Stegosauridae, family), downloaded 2026-11-16
parent: stegosauria
wikipedia: Stegosauria
summary: The more diverse family of stegosaurians, named for Stegosaurus and found across the Northern Hemisphere,
  Africa and South America.
diagnosis:
- A large antitrochanter (supracetabular process) on the ilium and a long prepubic process
- A long femur relative to the humerus
- Sacral ribs T-shaped in cross-section, and dorsal vertebrae with an elongated neural arch
notes: The family was erected by Marsh in 1880 on Stegosaurus armatus, a species he named in 1877. Long narrow skulls
  and long hindlimbs relative to the forelimbs occur in stegosaurids, but are not diagnostic because some non-stegosaurid
  stegosaurians share them.
