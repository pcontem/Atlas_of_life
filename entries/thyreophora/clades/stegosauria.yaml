id: stegosauria
name: Stegosauria
rank: clade
taxon_rank: unranked clade
taxon_rank_source: Paleobiology Database taxonomy (taxon Stegosauria, unranked clade), downloaded 2026-11-16
parent: thyreophora
wikipedia: Stegosauria
summary: Plated, herbivorous ornithischians of the Jurassic and Early Cretaceous, known from the Northern Hemisphere,
  Africa and South America, with dorsal plates and paired tail spikes.
diagnosis:
- Quadrupedal herbivores with large, thin, erect dermal plates along the neck, back and tail
- Pairs of spikes at the end of the tail (the thagomizer), used as a defensive weapon
- Small, long, flat and narrow head with a horn-covered beak over the premaxillae and predentary
notes: Named by Marsh in 1877 and made up of two families, the Huayangosauridae and the more diverse Stegosauridae.
  The earliest unequivocal stegosaurians come from the Middle Jurassic (Bajocian-Bathonian) and include Adratiklit,
  Bashanosaurus, Isaberrysaura and Thyreosaurus. The function of the plates (defence, thermoregulation or display)
  is still debated; a histological study suggests the plates served different purposes at different life stages.
