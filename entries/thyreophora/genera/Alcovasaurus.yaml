  note: No PBDB occurrences; the cited Wikipedia revision gives only Late Jurassic, so the ICS bounds of that epoch
    are used.
species: []
formations: []
fossil_material:
  holotype: UW 20503, a partial postcranial skeleton of an adult with 42 vertebrae, sacrum fragments, ischia, a
    pubis portion, a femur, ribs and four tail spines — Alcova Quarry, Wyoming.
  material: Holotype only; it was damaged in the late 1920s and only a femur is certainly extant.
  completeness: fragmentary
  exceptional: ''
biology: The very long tail spines are the distinctive feature; no other biology is documented.
