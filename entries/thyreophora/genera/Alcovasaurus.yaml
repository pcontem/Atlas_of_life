name: Alcovasaurus
rank: genus
parent: stegosauridae
incertae_sedis: true
placement_note: Likely a dacentrurine, and referred to Miragaia by some authors (cited Wikipedia revision); the
  atlas has no Dacentrurinae clade.
authority: Galton and Carpenter 2016
type_species: Alcovasaurus longispinus
type_species_note: Species originally named Stegosaurus longispinus by Gilmore 1914 and made the type of the new
  genus (cited Wikipedia revision).
summary: Alcovasaurus is a Late Jurassic stegosaur from the Morrison Formation of Wyoming with very long tail spines,
  originally named Stegosaurus longispinus.
