fossil_material:
  holotype: MOZ-Pv 6459, a partial skeleton with a nearly complete skull — Los Molles Formation, Neuquén Basin,
    Argentina.
  material: Only the holotype is known; the postcranial material was still unprepared when described.
  completeness: partial
  exceptional: ''
biology: Premaxillary teeth are recurved and the maxillary and dentary teeth lanceolate; similar dentition in living
  iguanid lizards goes with omnivory, so it may have been omnivorous.
