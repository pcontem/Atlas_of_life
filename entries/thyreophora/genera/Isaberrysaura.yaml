name: Isaberrysaura
rank: genus
parent: stegosauria
incertae_sedis: true
placement_note: Described as a basal neornithischian (Salgado et al. 2017); later analyses (Hui et al. 2022; Sánchez-Fenoll
  2025) place it among the stegosaurs.
authority: Salgado et al. 2017
type_species: Isaberrysaura mollensis
type_species_note: Named as the type in the cited sources (the PBDB species list gives this species).
summary: Isaberrysaura is a stegosaur from the Middle Jurassic of Patagonia, notable for an unusual deep skull and
  heterodont teeth.
size:
  length_m: [5, 6]
  note: Estimate given in the cited Wikipedia revision for the single known individual.
