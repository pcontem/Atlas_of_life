fossil_material:
  holotype: AMNH 6523, found in the Djadokhta Formation (Flaming Cliffs, Shabarakh Usu), Mongolia.
  material: At least 24 skeletons, possibly the most of any ankylosaur, including groups of juveniles.
  completeness: multiple
  exceptional: ''
biology: Neck, back and tail were protected by keeled osteoderms; juvenile groups are known.
