fossil_material:
  holotype: The 'Suncor nodosaur', a nearly complete front half with armour in life positions — Clearwater Formation,
    Millennium Mine, Alberta.
  material: One specimen, found in 2011 at an oil sands mine.
  completeness: near-complete
  exceptional: Armour in life positions with keratin sheaths, overlying skin and stomach contents.
biology: Straight tail without club and a pair of long shoulder spines; a flexible keratin layer up to 16 cm covered
  its bony armour.
