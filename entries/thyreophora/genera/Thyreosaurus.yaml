name: Thyreosaurus
rank: genus
parent: stegosauria
incertae_sedis: true
placement_note: Described as a stegosaur from the El Mers III Formation (Zafaty et al. 2024); position within Stegosauria
  not resolved in the sources used.
authority: Zafaty et al. 2024
type_species: Thyreosaurus atlasicus
type_species_note: Named as the type in the cited sources (the PBDB species list gives this species).
summary: Thyreosaurus is a Middle Jurassic stegosaur from Morocco with unusual oblong osteoderms possibly lying
  flat on the back.
size:
  length_m: [6, 6]
  note: Estimated body length of the not fully grown adult holotype (cited Wikipedia revision).
