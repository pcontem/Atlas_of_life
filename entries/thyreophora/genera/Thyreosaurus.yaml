fossil_material:
  holotype: HIIUC-BN00, an associated but disarticulated partial skeleton with nine dorsal vertebrae, 21 ribs, a
    limb bone and six osteoderms — El Mers III Formation, Boulahfa North, Morocco.
  material: Holotype only.
  completeness: fragmentary
  exceptional: ''
biology: Its asymmetrical oblong osteoderms resemble those of nodosaurid ankylosaurs and may have lain recumbent
  instead of upright.
