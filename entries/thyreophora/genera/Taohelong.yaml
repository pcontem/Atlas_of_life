name: Taohelong
rank: genus
parent: ankylosauria
incertae_sedis: true
placement_note: Described as a polacanthine nodosaurid, sister to Polacanthus (Yang et al. 2013); polacanthine placement
  is disputed, so it is placed in Ankylosauria.
authority: Yang et al. 2013
type_species: Taohelong jinchengensis
type_species_note: Only species of the genus (PBDB; cited Wikipedia revision).
summary: Taohelong is an Early Cretaceous armoured dinosaur from Gansu, China, the first polacanthine found in Asia,
  with an irregular sacral shield.
