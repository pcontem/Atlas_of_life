name: Jakapil
rank: genus
parent: thyreophora
incertae_sedis: true
placement_note: Riguetti et al. 2022 recovered it as a basal thyreophoran outside Eurypoda; later analyses (Raven
  2023, Fonseca 2024) are cited by the revision; placed in Thyreophora.
authority: Riguetti et al. 2022
type_species: Jakapil kaniukura
type_species_note: Only species of the genus (PBDB; cited Wikipedia revision).
summary: Jakapil is a small Early Cretaceous thyreophoran from Patagonia with a predentary bone and large low osteoderms,
  probably walking on two legs.
size:
  length_m: [1.5, 1.5]
  mass_kg: [4.5, 7]
  note: Estimates by the describers from femoral circumference; length less than 1.5 m (cited Wikipedia revision).
