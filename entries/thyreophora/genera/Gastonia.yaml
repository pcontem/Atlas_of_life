fossil_material:
  holotype: CEUM 1307, an adult skull about 295 mm long and 283 mm wide — Yellow Cat Quarry, Yellow Cat Member,
    Cedar Mountain Formation, Grand County, Utah.
  material: Hundreds of disarticulated bones and several partial skeletons from Gaston and Dalton Wells quarries;
    G. lorriemcwhinneyae comes from a bonebed in a higher member (Ruby Ranch Member).
  completeness: multiple
  exceptional: ''
biology: Sacral shield with paired keeled "quarter rings" and large shoulder spikes; bonebeds of several individuals
  may reflect group death by drought or drowning (G. lorriemcwhinneyae).
