name: Polacanthus
rank: genus
parent: ankylosauria
incertae_sedis: true
placement_note: Polacanthines are placed in Nodosauridae in some analyses (cited revision of Taohelong) and as a
  separate basal ankylosaur group elsewhere; placed in Ankylosauria.
authority: Fox 1866
type_species: Polacanthus foxii
type_species_note: Taxobox of the cited Wikipedia revision; the only species currently regarded as valid.
summary: Polacanthus is an armoured ankylosaur from the Early Cretaceous of southern England, with a sacral shield
  and many spikes, known from few skeletons.
