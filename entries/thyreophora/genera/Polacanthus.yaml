fossil_material:
  holotype: NHMUK PV R175, an incomplete skeleton without head, neck and forelimbs, with dorsal and tail vertebrae,
    pelvic shield, 22 spikes and ossicles — Upper Wessex Formation, England.
  material: Few remains are known; the skull is poorly known.
  completeness: partial
  exceptional: ''
biology: Armoured quadrupedal herbivore; armour was its main protection.
