name: Minotaurasaurus
rank: genus
parent: ankylosauridae
incertae_sedis: true
placement_note: Suggested to be a synonym of Tarchia, but more recent publications treat it as distinct (cited revision);
  placed in Ankylosauridae.
authority: Miles and Miles 2009
type_species: Minotaurasaurus ramachandrani
type_species_note: Only species of the genus (PBDB; cited Wikipedia revision).
summary: Minotaurasaurus is a medium-sized ankylosaurid known from a bull-like skull of unknown origin, thought
  to come from the Djadokhta Formation of Mongolia.
size:
  length_m: [4.2, 4.2]
  note: Estimate for the immature type specimen (cited Wikipedia revision).
age:
  first_ma: 75
  last_ma: 71
  early_interval: Campanian
  late_interval: ''
  pbdb_occurrences: 0
  note: No PBDB occurrences; the cited Wikipedia revision gives the late Campanian (about 75–71 Ma, Djadokhta Formation),
    although the original provenance was unknown.
species:
- name: Minotaurasaurus ramachandrani
  authority: Miles and Miles 2009
  first_ma: 83.6
  last_ma: 72.2
  interval: Campanian
  reference: original description
formations: []
fossil_material:
  holotype: INBR21004, a skull with lower jaws and predentary, suspected to have been illegally exported from Mongolia.
  material: Two skulls, a cervical vertebra and a cervical half ring.
  completeness: fragmentary
  exceptional: ''
biology: Known only from skulls; the sources used give no behavioural data.
