name: Adratiklit
rank: genus
parent: stegosauria
incertae_sedis: true
placement_note: Described as a stegosaur close to dacentrurines (Maidment et al. 2020); the atlas has no Dacentrurinae
  clade.
authority: Maidment et al. 2020
type_species: Adratiklit boulahfa
type_species_note: Named as the type in the cited sources (the PBDB species list gives this species).
summary: Adratiklit is a Middle Jurassic stegosaur from Morocco, one of the oldest known stegosaurs and the first
  from North Africa.
size:
  length_m: [7, 7]
  note: Estimated body length of up to 7 m in the cited Wikipedia revision.
