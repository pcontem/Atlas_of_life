name: Bashanosaurus
rank: genus
parent: stegosauria
incertae_sedis: true
placement_note: Recovered as one of the basalmost stegosaurs by its describers (Dai et al. 2022); the cited Wikipedia
  revision does not settle whether it belongs in Huayangosauridae, so it is placed in Stegosauria.
authority: Hui et al. 2022
type_species: Bashanosaurus primitivus
type_species_note: Named as the type in the cited sources (the PBDB species list gives this species).
summary: Bashanosaurus is a basal stegosaur from the Middle Jurassic of Chongqing, China, known from three partial
  skeletons.
