fossil_material:
  holotype: CLGPR V00006-1, a partial skeleton with dorsal and caudal vertebrae, scapulocoracoid, hindlimb, ribs
    and three dermal armour pieces — Shaximiao Formation, Yunyang County, China.
  material: Two further individuals (CLGPR V00006-2 and -3) from the same horizon, with dorsal vertebrae, tibia,
    fibula, ribs and a plate.
  completeness: fragmentary
  exceptional: ''
biology: Known only from partial skeletons; the sources give no direct evidence of diet or behaviour beyond its
  stegosaurian armour of plates and spines.
