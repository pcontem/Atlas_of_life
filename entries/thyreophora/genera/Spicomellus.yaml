name: Spicomellus
rank: genus
parent: ankylosauria
incertae_sedis: true
placement_note: First thought stegosaurian from the type rib; the 2025 specimen shows it is an ankylosaur (Maidment
  et al. 2025), but its position inside Ankylosauria is not settled in the sources used.
authority: Maidment et al. 2021
type_species: Spicomellus afer
type_species_note: Only species of the genus (PBDB; cited Wikipedia revision).
summary: Spicomellus is the oldest known ankylosaur, from the Middle Jurassic of Morocco, with extremely elongated
  spikes fused directly to the ribs.
