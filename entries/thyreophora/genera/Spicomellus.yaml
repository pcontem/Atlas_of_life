fossil_material:
  holotype: A dorsal rib fragment fused to a flat osteoderm bearing four spines — El Mers III Formation, Morocco
    (collection number not given in the sources used).
  material: A partial skeleton described in 2025 with cranial bones, vertebrae, ribs bearing fused spikes and both
    scapulocoracoids.
  completeness: partial
  exceptional: ''
biology: Unique among vertebrates in having dermal spikes fused to the ribs; the largest spike is 87 cm long.
