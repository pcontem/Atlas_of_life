name: Chuanqilong
rank: genus
parent: ankylosauridae
incertae_sedis: true
placement_note: Described as a basal ankylosaurid (Han et al. 2014); it shows many similarities with Liaoningosaurus
  and may be a later growth stage of it (cited revision).
authority: Han et al. 2014
type_species: Chuanqilong chaoyangensis
type_species_note: Only species of the genus (PBDB; cited Wikipedia revision).
summary: Chuanqilong is a medium-sized ankylosaur from the Jiufotang Formation of Liaoning, China, described from
  a nearly complete juvenile skeleton.
size:
  length_m: [4.5, 4.5]
  note: Estimate for the immature holotype; it may have been larger (cited Wikipedia revision).
