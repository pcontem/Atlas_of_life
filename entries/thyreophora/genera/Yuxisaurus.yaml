name: Yuxisaurus
rank: genus
parent: thyreophora
incertae_sedis: true
placement_note: Recovered as the sister of Emausaurus or of Scelidosaurus plus Eurypoda (Yao et al. 2022); placed
  in Thyreophora.
authority: Yao et al. 2022
type_species: Yuxisaurus kopchicki
type_species_note: Only species of the genus (PBDB; cited Wikipedia revision).
summary: Yuxisaurus is an early armoured dinosaur from the Early Jurassic of Yunnan, China, proof that thyreophorans
  lived in Asia then.
