fossil_material:
  holotype: HMNS 14 (originally HMNH 001), a nearly complete skull and much of the skeleton — Windy Hill Member,
    lower Morrison Formation, Wyoming.
  material: Several relatively complete skeletons, found in Wyoming and Montana since 1985.
  completeness: multiple
  exceptional: One specimen preserves the first known impression of the horn sheath of a stegosaurian back plate.
biology: A herbivorous quadruped with two rows of plates and four tail spikes; its skull was possibly deeper than
  that of Stegosaurus.
