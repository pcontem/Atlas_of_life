fossil_material:
  holotype: IVPP V6728, a partial skeleton with a relatively complete skull, vertebrae, three plates and a spike
    — lower Shaximiao Formation, Sichuan.
  material: Remains of about twelve individuals were recovered in 1979–80, including the more complete skeleton
    ZDM T7001.
  completeness: multiple
  exceptional: ''
biology: A quadrupedal herbivore with a small skull and a spiked tail; plates were more spike-like than in Stegosaurus.
