fossil_material:
  holotype: IVPP V.4006, a skull-less fragmentary skeleton with pelvis, sacrum, vertebrae, scapulocoracoid, humerus
    and two dermal plates — Lianmuqin Formation, Xinjiang.
  material: Paratype IVPP V.4007 (caudal vertebrae and an ulna), plus a second species, W. ordosensis (IVPP V.6877),
    from the Ejinhoro Formation of Inner Mongolia.
  completeness: fragmentary
  exceptional: ''
biology: Known from partial postcranial remains and plates; behaviour is not documented in the sources used.
