fossil_material:
  holotype: IVPG-D021, a partial skeleton with fragments of the left premaxilla, maxilla, frontals, jugal, squamosal
    and dentary, an atlas, seven dorsal vertebrae and a caudal vertebra — Wangjiashan Formation, Gansu.
  material: Only the holotype is known.
  completeness: fragmentary
  exceptional: ''
biology: As a stegosaur it would have been a quadrupedal herbivore with plates and spines along the neck, back and
  tail; no direct evidence is given.
