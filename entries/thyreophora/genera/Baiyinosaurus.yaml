name: Baiyinosaurus
rank: genus
parent: stegosauria
incertae_sedis: true
placement_note: Described as showing transitional features between basal thyreophorans and stegosaurs (Li et al.
  2024); its position relative to Huayangosauridae is not settled in the sources used.
authority: Li et al. 2024
type_species: Baiyinosaurus baojiensis
type_species_note: Named as the type in the cited sources (the PBDB species list gives this species).
summary: Baiyinosaurus is a basal stegosaur from the Middle Jurassic Wangjiashan Formation of Gansu, China, known
  from a partial skeleton with cranial bones.
