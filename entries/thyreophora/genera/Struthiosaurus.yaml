  holotype: PIWU 2349/6 (S. austriacus), the rear of a skull largely consisting of the braincase — Grünbach Formation,
    Austria.
  material: 'Three valid species: S. austriacus, S. transylvanicus (BMNH R4966, a skull) and S. languedocensis.'
  completeness: fragmentary
  exceptional: ''
biology: Small island-dwelling nodosaurid known from fragmentary bones and armour; the cited revision also covers
  the neuroanatomy.
