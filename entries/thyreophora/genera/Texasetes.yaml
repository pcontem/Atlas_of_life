name: Texasetes
rank: genus
parent: nodosauridae
incertae_sedis: true
placement_note: Arbour et al. 2016 placed Texasetes closer to Edmontonia, while Pawpawsaurus fell near Europelta;
  the two may be synonyms (cited revision).
authority: Coombs 1995
type_species: Texasetes pleurohalio
type_species_note: Only species of the genus (PBDB; cited Wikipedia revision).
summary: Texasetes is a poorly known nodosaurid from the Albian Paw Paw Formation of Texas, perhaps a senior synonym
  of Pawpawsaurus.
