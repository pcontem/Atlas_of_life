fossil_material:
  holotype: AMNH 5895, found in 1906 by an AMNH expedition led by Barnum Brown — Hell Creek Formation, Gilbert Creek,
    Montana.
  material: A handful of specimens from the Hell Creek, Lance, Scollard, Frenchman and Ferris formations; no complete
    skeleton.
  completeness: fragmentary
  exceptional: ''
biology: Fused skull bones, neck half-rings and a large tail club; nasal sinuses may have served heat and water
  balance or vocalisation.
