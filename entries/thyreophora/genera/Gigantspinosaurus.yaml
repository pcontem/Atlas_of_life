name: Gigantspinosaurus
rank: genus
parent: stegosauria
incertae_sedis: true
placement_note: Treated as a valid stegosaur by Maidment and Wei 2006 and redescribed by Hao et al. 2018; its position
  inside Stegosauria is not resolved in the sources used.
authority: Ouyang 1992
type_species: Gigantspinosaurus sichuanensis
type_species_note: Named as the type in the cited sources (the PBDB species list gives this species).
summary: Gigantspinosaurus is a stegosaur from the Late Jurassic of Sichuan, China, known for its very large shoulder
  spines.
