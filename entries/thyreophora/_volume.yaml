built: '2026-11-22'
size_measure: length
method: Ages, authorities, species and formations from the Paleobiology Database; descriptive data paraphrased from
  the cited literature and English Wikipedia; images from Wikimedia Commons and PhyloPic with their licences. Classification
  from recent phylogenetic analyses checked against PBDB (docs/TREE_REVIEW.md). Genus list checked against PBDB,
  Wikipedia and recent literature by the census of 2026-11-22 (data/raw/census/ornithischia). Part A of the Ornithischia
  split (Thyreophora and Marginocephalia).
restoration_checks:
- body armour (scutes, plates, spikes, osteoderm rows) drawn where the material of this genus or its close relatives
  shows it, in the known arrangement
- limb posture (bipedal, facultatively bipedal or obligately quadrupedal) matches the limb and girdle material
- skull shape, beak and tooth row match the material of this genus; tail weaponry (club, thagomizer, flexible tip)
  only as the fossils support it
- skin covering only where preserved skin or armour impressions support it
