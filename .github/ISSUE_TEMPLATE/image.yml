name: Image review or suggestion
description: Review a life restoration or suggest an openly licensed image.
title: "Image: "
labels: [image-review]
body:
  - type: input
    id: entry
    attributes:
      label: Entry
      placeholder: Pteranodon
    validations: { required: true }
  - type: input
    id: image
    attributes:
      label: Image
      description: The file name shown under the image, or the link of a new image (Wikimedia Commons, open-access article…).
    validations: { required: true }
  - type: dropdown
    id: action
    attributes:
      label: What do you propose
      options: [accept — the restoration matches current knowledge, outdated — contradicted by current knowledge, remove — wrong taxon / not allowed (model, AI, licence), add — new image]
    validations: { required: true }
  - type: checkboxes
    id: criteria
    attributes:
      label: Life restorations — general criteria (rule I4)
      description: These apply to every group. Leave a box empty if the point does not hold or you could not check it, and say why below.
      options:
        - label: anatomy and proportions are consistent with the known fossil material
        - label: body covering (scales, feathers, filaments, fur, bare skin) agrees with the evidence for the group
        - label: soft structures (crests, sails, membranes, fins, wattles) are supported by fossils or close relatives, or are clearly speculative
        - label: posture and stance agree with current understanding
        - label: no features contradicted by the sources
  - type: textarea
    id: group_checks
    attributes:
      label: Group-specific points
      description: "Each volume lists the extra points to check for its group under `restoration_checks` in `entries/<volume>/_volume.yaml` (e.g. for pterosaurs: pycnofibres, extent of the wing membrane). Say which you checked and what you found."
  - type: input
    id: licence
    attributes:
      label: Licence (for new images)
      description: Only CC0, public domain, CC BY or CC BY-SA can be copied; anything else can only be linked.
  - type: textarea
    id: notes
    attributes:
      label: Reasons and sources
    validations: { required: true }
