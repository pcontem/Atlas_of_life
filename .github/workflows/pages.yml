name: pages
# Publishes site/ to GitHub Pages when main changes. If media/config.json has a base_url, the images are
# served from the Cloudflare R2 bucket and are not published here; otherwise they come from the `media`
# branch (scripts/media.py), checked against media/manifest.json.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Fetch the site images from the media branch (only when they are not served from R2)
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('media/config.json')).get('base_url') else 1)"; then
            echo "Images are served from R2 ($(python3 -c "import json;print(json.load(open('media/config.json'))['base_url'])")); not publishing them here."
          else
            python3 scripts/media.py pull
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
