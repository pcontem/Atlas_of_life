<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas of Life</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3eee2;--paper2:#e9e2d1;--card:#fbf8f1;--ink:#26251f;--muted:#756f60;--line:#cfc6b1;--accent:#8a3b1d;--accent2:#2f6150;--tri:#8e5f8f;--jur:#3d7f9b;--cre:#6f9a45}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif}
a{color:var(--accent)}
i.sci,.sci{font-style:italic}
header{height:58px;display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--paper)}
header h1{font:600 21px Fraunces,serif;margin:0;letter-spacing:-.01em}
header .sub{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:auto}
nav button{font:inherit;font-size:13px;background:none;border:1px solid transparent;border-radius:6px;padding:6px 11px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--ink);color:var(--paper)}
nav button:hover:not(.on){border-color:var(--line)}
#search{font:inherit;border:1px solid var(--line);background:#fffdf8;border-radius:6px;padding:6px 10px;width:210px}
main{position:absolute;top:58px;left:0;right:0;bottom:0;display:flex}
#side{width:350px;min-width:350px;border-right:1px solid var(--line);overflow:auto;padding:10px 0 40px}
#view{flex:1;overflow:auto}
/* tree */
.node{padding:2px 0}
.row{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 0;cursor:pointer;border-radius:4px;margin-right:8px}
.row:hover{background:var(--paper2)}
.row.sel{background:#e2d6bb}
.tog{width:16px;text-align:center;color:var(--muted);font-size:10px;flex:none}
.cl{font-weight:600}
.cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.is{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 0 2px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.kids{margin-left:9px;border-left:1px dotted var(--line)}
.row{white-space:nowrap}
/* entry */
.ficha{max-width:1060px;margin:0 auto;padding:26px 34px 60px}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumbs a{cursor:pointer;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
.ficha h2{font:600 34px/1.1 Fraunces,serif;margin:0 0 4px;letter-spacing:-.015em}
.auth{color:var(--muted);font-size:14px}
.badge{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin:6px 6px 0 0;background:var(--card)}
.badge.warn{border-color:#c79b62;background:#f7ead3}
.lead{font:400 18px/1.45 Fraunces,serif;margin:16px 0 18px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.card h3{font:600 12px 'IBM Plex Sans';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
figure{margin:0}
.hero{background:#e9e3d3;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:180px;overflow:hidden}
.hero img{max-width:100%;max-height:420px;display:block}
figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.imgtabs{display:flex;gap:6px;margin-bottom:8px}
.imgtabs button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fffdf8;border-radius:5px;padding:3px 9px;cursor:pointer}
.imgtabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{font-size:12px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:12px;padding-top:1px}
dl.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px}
td{border-bottom:1px solid #e3dccb;padding:5px 6px;vertical-align:top}
ol.src{padding-left:18px;margin:0;font-size:12.5px}
ol.src li{margin-bottom:5px}
.kind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px}
ul.diag{margin:0;padding-left:18px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mem{background:#fffdf8;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.mem:hover{border-color:var(--accent)}
.mem .th{height:100px;background:#e9e3d3 center/contain no-repeat;display:flex;align-items:center;justify-content:center}
.mem .th img{max-height:80px;max-width:90%;opacity:.8}
.mem .nm{padding:6px 8px;font-size:13px}
.mem .nm small{display:block;color:var(--muted);font-size:11px}
.stat{display:flex;gap:26px;flex-wrap:wrap}
.stat div b{display:block;font:600 24px Fraunces,serif}
.stat div span{font-size:12px;color:var(--muted)}
.tl svg{width:100%;display:block}
/* timeline view */
.tlv{padding:20px 26px}
.tlv h2{font:600 26px Fraunces,serif;margin:0 0 4px}
.bar{cursor:pointer}
.bar:hover rect.b{stroke:var(--ink);stroke-width:1}
/* list */
.xl{padding:24px 34px;max-width:1000px}
.xl h2{font:600 26px Fraunces,serif;margin:0 0 6px}
.empty{padding:60px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;margin-right:10px;background:#fffdf8}
.seg button{border:none}
main.full #side{display:none}
#view{position:relative}
#cwrap{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#f7f2e6,#efe8d8)}
#csvg{width:100%;height:100%;display:block;cursor:grab}
#csvg:active{cursor:grabbing}
.lk{fill:none;stroke:#bdb39d;stroke-width:1.1}
.nd{cursor:pointer}
.nd text{font-size:12px;fill:#2a2924;paint-order:stroke;stroke:#f3eee2;stroke-width:4px;stroke-linejoin:round}
.nd text.cl{font-weight:600}
.nd text.gn{font-style:italic}
.nd text.fi{fill:#6b2d14}
.nd.sel circle.c{stroke:#c23b22;stroke-width:3}
.nd.sel text{fill:#c23b22}
.ctools{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center}
#csearch{font:inherit;font-size:13px;border:1px solid var(--line);background:#fffdf8;border-radius:6px;padding:5px 10px;width:230px}
.ctools button,#cinfo button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fffdf8;border-radius:6px;padding:5px 10px;cursor:pointer}
.chint{position:absolute;bottom:10px;left:12px;font-size:11.5px;color:var(--muted);background:rgba(251,248,241,.9);padding:4px 8px;border-radius:5px}
#cinfo{position:absolute;right:14px;bottom:14px;width:330px}
#cinfo .ci{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;box-shadow:0 4px 18px rgba(60,50,30,.12)}
#cinfo img{width:84px;height:84px;object-fit:cover;border-radius:6px;flex:none}
#cinfo .cpath{font-size:11px;color:var(--muted)}
#cinfo .cname{font:600 18px Fraunces,serif}
#cinfo button{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fffdf8;border-radius:16px;padding:3px 10px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.chip small{color:var(--muted)}
.chip:hover{border-color:var(--accent)}
#side{display:flex;flex-direction:column;padding:0 !important}
#sbox{position:sticky;top:0;z-index:2;background:var(--paper);padding:10px 10px 8px;border-bottom:1px solid var(--line)}
#ssearch{font:inherit;width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:6px;padding:7px 10px}
#sres{position:absolute;left:10px;right:10px;top:46px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(60,50,30,.15);overflow:hidden}
#sres:empty{display:none}
.sr{padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #ebe4d4}
.sr small{display:block;color:var(--muted);font-size:11px}
.sr.on,.sr:hover{background:#efe6d1}
.sr.more{color:var(--accent);font-size:12px}.sr.none{color:var(--muted);cursor:default}
.fb{font-size:9.5px;font-style:normal;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--accent);border-radius:3px;padding:0 4px;vertical-align:1px}
.tlseg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;margin-top:4px}.tlseg button{font:inherit;font-size:12.5px;background:none;border:none;border-radius:5px;padding:4px 10px;cursor:pointer}.tlseg button.on{background:var(--ink);color:var(--paper)}
#stree{overflow:auto;flex:1;padding:8px 0 40px}
.sup{font-size:11.5px;color:var(--muted);padding:2px 12px 8px;line-height:1.6}.sup a{cursor:pointer;color:var(--muted);border-bottom:1px dotted var(--muted)}
.ixbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
#ixc{font:inherit;border:1px solid var(--line);background:#fffdf8;border-radius:6px;padding:7px 10px;width:260px}
#ixq{font:inherit;border:1px solid var(--line);background:#fffdf8;border-radius:6px;padding:7px 10px;width:260px}
.ixbar .seg button{font:inherit;font-size:13px;background:none;border:none;border-radius:5px;padding:5px 10px;cursor:pointer}
.ixbar .seg button.on{background:var(--ink);color:var(--paper)}
.ixletters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;position:sticky;top:0;background:var(--paper);padding:6px 0;z-index:1}
.ixletters a{cursor:pointer;font-weight:600;padding:2px 7px;border:1px solid var(--line);border-radius:4px;background:#fffdf8;font-size:12px}
.ixg h3{font:600 20px Fraunces,serif;margin:16px 0 6px;border-bottom:1px solid var(--line)}
.ixcols{columns:3 220px;column-gap:24px}
.ixe{display:block;break-inside:avoid;padding:3px 0;cursor:pointer;color:var(--ink);text-decoration:none;font-size:13.5px}
.ixe small{display:block;color:var(--muted);font-size:11px;margin-top:-1px}
.ixe:hover{color:var(--accent)}
@media (max-width:820px){#side{display:none}.grid{grid-template-columns:1fr}.ficha{padding:18px}#search{width:130px}}
</style>
</head>
<body>
<header>
  <div><h1>Atlas of Life</h1><div class="sub">Tree of life</div></div>
  <nav>
    <span class="seg"><button data-v="tree" class="on">Encyclopedia</button><button data-v="clado">Cladogram</button></span>
    <span class="encnav"><button data-v="tree" class="entry">Entry</button><button data-v="index">Index</button><button data-v="time">Timeline</button><button data-v="excluded">Excluded names</button><button data-v="about">About &amp; sources</button></span>
  </nav>
  <datalist id="names"></datalist>
</header>
<main><div id="side"><div id="sbox"><input id="ssearch" type="search" placeholder="Search the encyclopedia…" autocomplete="off"><div id="sres"></div></div><div id="stree"></div></div><div id="view"><div class="empty">Loading…</div></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const ERAS=[["Triassic",251.9,201.4,"#8e5f8f"],["Jurassic",201.4,145,"#3d7f9b"],["Cretaceous",145,66,"#6f9a45"]];
const EPOCHS=[["Early",251.9,247.2],["Middle",247.2,237],["Late",237,201.4],["Early",201.4,174.7],["Middle",174.7,161.5],["Late",161.5,145],["Early",145,100.5],["Late",100.5,66]];
let D,LIFE,byId={},byName={},children={},open=new Set(["vida"]),cur=null,view="tree";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtMa=v=>v==null?"?":(v>=10?v.toFixed(1).replace(/\.0$/,""):v.toFixed(2))+" Ma";
const era=ma=>{for(const e of ERAS)if(ma<=e[1]&&ma>e[2])return e;return ERAS[2]};
const imgKey=(g,k)=>"img/"+g.replace(/[^A-Za-z]/g,"")+"_"+k+".webp";
const silSrc=s=>s?"sil/"+s.page.split("/images/")[1]+".webp":null;

Promise.all([fetch("data.json").then(r=>r.json()),fetch("life.json").then(r=>r.json())]).then(([d,l])=>{D=d;LIFE=l;init()}).catch(e=>{$("#view").innerHTML='<div class="empty">Could not load the data file.</div>'});

function init(){
  const cl={},gn={};D.clades.forEach(c=>cl[c.id]=c);D.genera.forEach(g=>gn[g.name]=g);
  for(const[id,name,parent,st,note,k,f]of LIFE){const n={id,name,parent:parent||null,status:st,note,type:k==="c"?"clade":"genus",ficha:!!f};
    if(f)Object.assign(n,k==="c"?cl[id]:gn[id]);n.parent=parent||null;n.id=id;byId[id]=n;children[id]=[]}
  for(const n of Object.values(byId))if(n.parent)children[n.parent].push(n.id);
  for(const k in children)children[k].sort((a,b)=>{const A=byId[a],B=byId[b];return (A.type===B.type?0:A.type==="clade"?-1:1)||A.name.localeCompare(B.name)});
  const stat=id=>{const n=byId[id];if(n.type==="genus")return{g:1,fad:n.fad??null,lad:n.lad??null,cc:n.formations?n.formations.map(f=>f.country):[],e:n.status==="e"?1:0};
    let s={g:0,fad:0,lad:999,cc:new Set(),e:0};for(const k of children[id]){const t=stat(k);s.g+=t.g;s.e+=t.e;if(t.fad!=null){s.fad=Math.max(s.fad,t.fad);s.lad=Math.min(s.lad,t.lad)}t.cc.forEach(c=>s.cc.add(c))}
    if(!s.fad){s.fad=null;s.lad=null}n.stat=s;return{...s,cc:[...s.cc]}};
  stat("vida");
  const names=new Map();Object.values(byId).forEach(n=>{const k=n.name.toLowerCase();if(!byName[k])byName[k]=n.id;names.set(n.name,1)});
  $("#names").innerHTML=[...names.keys()].map(n=>`<option value="${esc(n)}">`).join("");
  initSearch();
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{const v=b.dataset.v;location.hash=v==="tree"?(cur||"vida"):v==="clado"?"cladogram":v});
  addEventListener("hashchange",route);route();
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(["time","excluded","about","index"].includes(h)){view=h}else if(h==="cladogram"){view="clado"}else{view="tree";cur=byId[h]?h:(cur||"vida");reveal(cur)}
  document.querySelector("main").classList.toggle("full",view==="clado");
  $(".encnav").style.display=view==="clado"?"none":"";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  document.querySelector('.seg [data-v="tree"]').classList.toggle("on",view!=="clado");
  if(view!=="clado")renderSide();
  ({tree:()=>renderFicha(cur),clado:()=>CL.render(cur||"vida"),index:renderIndex,time:renderTime,excluded:renderExcluded,about:renderAbout})[view]();
  $("#view").scrollTop=0;
}
function go(id){if(view==="time"&&byId[id]){cur=id;renderTime()}else location.hash=id}
function path(id){const p=[];let n=byId[id];while(n){p.unshift(n);n=byId[n.parent]}return p}
function reveal(id){path(id).forEach(n=>{if(n.type==="clade")open.add(n.id)})}

/* ---------- side tree ---------- */
function renderSide(){const p=path(cur||"vida").filter(n=>n.type==="clade");const rootN=p.length>7?p[p.length-7]:byId["vida"];
  const up=rootN.id!=="vida"?`<div class="sup">${p.slice(0,p.indexOf(rootN)).slice(-3).map(n=>`<a onclick="go('${n.id}')">${esc(n.name)}</a>`).join(" › ")} <a onclick="go('vida')" title="Go to the root">↑ root</a></div>`:"";
  $("#stree").innerHTML=up+nodeHTML(rootN.id);
  $("#stree").querySelectorAll(".row").forEach(r=>r.onclick=e=>{const id=r.dataset.id;
    if(e.target.classList.contains("tog")&&byId[id].type==="clade"){open.has(id)?open.delete(id):open.add(id);renderSide();return}
    go(id)});
  const s=$("#stree .sel");if(s)s.scrollIntoView({block:"nearest"})}
function nodeHTML(id){const n=byId[id];
  if(n.type==="genus"){const c=n.ficha?era(n.fad||100)[3]:n.status==="v"?"#2f7350":n.status==="e"?"#a8622f":"#b9b09c";return `<div class="node"><div class="row ${cur===id&&view==="tree"?"sel":""}" data-id="${esc(id)}"><span class="tog"></span><span class="dot" style="background:${c}"></span><i>${n.status==="e"&&!n.ficha?"† ":""}${esc(n.name)}</i></div></div>`}
  const isOpen=open.has(id);const kids=children[id];
  const cl=kids.filter(k=>byId[k].type==="clade"),gs=kids.filter(k=>byId[k].type==="genus").sort();
  const isd=gs.filter(g=>byId[g].isd),reg=gs.filter(g=>!byId[g].isd);
  let h=`<div class="node"><div class="row ${cur===id&&view==="tree"?"sel":""}" data-id="${id}"><span class="tog">${isOpen?"▾":"▸"}</span><span class="cl" style="${n.ficha?"":"font-weight:500"}">${esc(n.name)}</span><span class="cnt">${n.stat.g}</span></div>`;
  if(isOpen){h+=`<div class="kids">`+cl.map(nodeHTML).join("")+reg.map(nodeHTML).join("");
    if(isd.length)h+=`<div class="is" style="padding-left:22px">incertae sedis</div>`+isd.map(nodeHTML).join("");h+="</div>"}
  return h+"</div>"}

/* ---------- shared bits ---------- */
function crumbs(id){const p=path(id).slice(0,-1);const lk=n=>`<a onclick="go('${n.id}')">${esc(n.name)}</a>`;
  const short=p.length>6?[lk(p[0]),`<a title="${esc(p.slice(1,-4).map(n=>n.name).join(" › "))}" onclick="this.parentNode.innerHTML=this.parentNode.dataset.full">…</a>`,...p.slice(-4).map(lk)]:p.map(lk);
  return `<div class="crumbs" data-full="${esc(p.map(lk).join(" › "))}">${short.join(" › ")}</div>`}
function timeline(spans,h=58){const W=600,P=12,x=v=>P+(251.9-v)/(251.9-66)*(W-2*P);let s=`<svg viewBox="0 0 ${W} ${h}" style="max-height:${Math.max(70,h*0.9)}px">`;
  for(const[nm,a,b,c]of ERAS)s+=`<rect x="${x(a)}" y="0" width="${x(b)-x(a)}" height="20" fill="${c}" opacity=".85"/><text x="${(x(a)+x(b))/2}" y="14" font-size="11" text-anchor="middle" fill="#fff">${nm}</text>`;
  for(const[nm,a,b]of EPOCHS)s+=`<line x1="${x(a)}" x2="${x(a)}" y1="20" y2="${h-14}" stroke="#d8cfba"/>`;
  spans.forEach((sp,i)=>{if(sp[0]==null)return;const a=x(sp[0]),b=Math.max(x(sp[1]),a+3);s+=`<rect x="${a}" y="${26+i*7}" width="${b-a}" height="6" rx="2" fill="${sp[2]||"var(--accent)"}"/>`});
  [250,200,150,100,66].forEach(v=>s+=`<text x="${x(v)}" y="${h-2}" font-size="10" text-anchor="middle" fill="#756f60">${v}</text>`);
  return s+"</svg>"}
function sources(list){return `<ol class="src">${list.map(s=>`<li><span class="kind">${esc(s.kind)}</span>${esc(s.text)}${s.url?` <a href="${esc(s.url)}" target="_blank" rel="noopener">link</a>`:""}</li>`).join("")}</ol>`}
const lic=(l,u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`:esc(l);
const licName=u=>{const m=String(u).match(/licenses\/([a-z-]+)\/([\d.]+)/);if(m)return "CC "+m[1].toUpperCase()+" "+m[2];if(/zero/.test(u))return "CC0 1.0";if(/mark/.test(u))return "Public domain mark";return u};

/* ---------- size diagram ---------- */
const HUMAN="M50 0c7 0 12 6 12 13s-5 13-12 13-12-6-12-13 5-13 12-13zM34 30h32c8 0 13 6 14 13l7 52c1 5-3 8-7 7-3 0-5-3-6-6l-6-40-2 0v136c0 6-4 9-9 9s-8-3-8-9v-82h-2v82c0 6-4 9-8 9s-9-3-9-9V56l-2 0-6 40c-1 3-3 6-6 6-4 1-8-2-7-7l7-52c1-7 6-13 14-13z"; // ~ 1.8 m tall in a 0..195 box
const WING="M0 24 C30 18 70 12 92 13 L97 6 C99 3 101 3 103 6 L108 13 C130 12 170 18 200 24 C170 26 135 30 110 31 L106 46 L102 40 L98 40 L94 46 L90 31 C65 30 30 26 0 24Z"; // generic front view, wings spread
function sizeDiagram(g){
  const ws=g.ws?g.ws[1]:null,s=g.silhouette;
  if(!ws){const s2=g.silhouette;return `<p class="note">No published wingspan estimate in the sources used — size diagram not drawn.</p>`+(s2?`<figure style="display:flex;gap:12px;align-items:center"><img src="${silSrc(s2)}" alt="" style="max-width:150px;max-height:90px;opacity:.85"><figcaption style="margin:0">Silhouette (not to scale)${s2.genus_level?"":` of a related form: <i>${esc(s2.depicts||"")}</i> (${esc(s2.matched)})`}. By ${esc(s2.attribution)}, ${lic(licName(s2.license),s2.license)}, via <a href="${esc(s2.page)}" target="_blank" rel="noopener">PhyloPic</a>.</figcaption></figure>`:"")}
  const H=210,unit=Math.max(ws,1.8)*1.15,W=520,pxm=Math.min((W-90)/unit,H*0.82/1.8);
  const human=1.8*pxm,hs=human/195;let svg=`<svg viewBox="0 0 ${W} ${H+30}" style="width:100%;max-width:560px">`;
  const ground=H;svg+=`<line x1="0" x2="${W}" y1="${ground}" y2="${ground}" stroke="#bbb1"/>`;
  // grid 1 m
  for(let m=0;m*pxm<W;m++)svg+=`<line x1="${20+m*pxm}" x2="${20+m*pxm}" y1="${ground}" y2="${ground+5}" stroke="#a99f88"/>${m%(ws>6?2:1)===0?`<text x="${20+m*pxm}" y="${ground+16}" font-size="9" text-anchor="middle" fill="#756f60">${m} m</text>`:""}`;
  svg+=`<g transform="translate(${20},${ground-human}) scale(${hs})"><path d="${HUMAN}" fill="#5e5a4f"/></g>`;
  svg+=`<text x="${20+50*hs}" y="${ground-human-6}" font-size="10" text-anchor="middle" fill="#5e5a4f">1.8 m</text>`;
  const x0=20+110*hs+20,wpx=ws*pxm;
  {const hpx=wpx*0.3,y=ground-human*0.62-hpx/2;svg+=`<g transform="translate(${x0},${y}) scale(${wpx/200},${hpx/60})"><path d="${WING}" fill="#7a5a44" opacity=".85"/></g>`}
  svg+=`<line x1="${x0}" x2="${x0+wpx}" y1="${ground-6}" y2="${ground-6}" stroke="var(--accent)" stroke-width="2"/><line x1="${x0}" x2="${x0}" y1="${ground-11}" y2="${ground-1}" stroke="var(--accent)" stroke-width="2"/><line x1="${x0+wpx}" x2="${x0+wpx}" y1="${ground-11}" y2="${ground-1}" stroke="var(--accent)" stroke-width="2"/>`;
  svg+=`<text x="${x0+wpx/2}" y="${ground-14}" font-size="11" text-anchor="middle" fill="var(--accent)">wingspan ${g.ws[0]!==g.ws[1]?"up to ":""}${ws} m</text></svg>`;
  let note="",side="";
  if(s){side=`<figure style="margin-top:10px;display:flex;gap:12px;align-items:center"><img src="${silSrc(s)}" alt="" style="max-width:150px;max-height:90px;opacity:.85"><figcaption style="margin:0">Silhouette (not to scale)${s.genus_level?` of <i>${esc(s.depicts||g.name)}</i>`:` of a related form: <i>${esc(s.depicts||"")}</i> (${esc(s.matched)}) — none exists yet for <i>${esc(g.name)}</i>`}. By ${esc(s.attribution)}, ${lic(licName(s.license),s.license)}, via <a href="${esc(s.page)}" target="_blank" rel="noopener">PhyloPic</a>.</figcaption></figure>`}
  note="Brown outline: schematic pterosaur scaled to the maximum wingspan (not genus-specific). Human figure 1.8 m. ";
  return svg+`<p class="note">${note}${esc(g.wsnote||"")}</p>`+side}

/* ---------- genus entry ---------- */
function renderFicha(id){const n=byId[id];if(!n.ficha)return renderBasic(id);if(n.type==="clade")return renderClade(id);const g=n;
  const imgs=g.images||[];let gi=0;
  const pathC=path(id).slice(0,-1).filter(c=>c.ficha);
  let h=`<div class="ficha">${crumbs(id)}<h2><i>${esc(g.name)}</i></h2><div class="auth">${esc(g.author||"")} · ${esc(g.early)}${g.late?"–"+esc(g.late):""} · ${fmtMa(g.fad)}–${fmtMa(g.lad)}</div>`;
  h+=`${g.type_species?`<span class="badge">Type species: <i>${esc(g.type_species)}</i></span>`:""}<span class="badge">${esc(g.completeness)} material</span>`;
  if(g.isd)h+=`<span class="badge warn">incertae sedis in ${esc(byId[g.clade].name)}</span>`;
  h+=`<p class="lead">${esc(g.sum)}</p><div class="grid"><div>`;
  // images
  h+=`<div class="card"><h3>Image</h3>`;
  if(imgs.length){if(imgs.length>1)h+=`<div class="imgtabs">${imgs.map((im,i)=>`<button data-i="${i}" class="${i?"":"on"}">${im.kind==="life"?"Life restoration":"Fossil"}</button>`).join("")}</div>`;
    h+=`<figure id="fig"></figure>`}else h+=`<p class="note">No openly licensed restoration or fossil photograph was found for this genus. The silhouette below is the only image.</p>`;
  h+=`</div>`;
  h+=`<div class="card"><h3>Size</h3>${sizeDiagram(g)}</div>`;
  h+=`<div class="card"><h3>Biology</h3><p style="margin:0">${esc(g.biology)}</p></div>`;
  h+=`</div><div>`;
  h+=`<div class="card"><h3>Time range</h3><div class="tl">${timeline([[g.fad,g.lad,era(g.fad)[3]]],48)}</div>${g.dates_note?`<p class="note">${esc(g.dates_note)}</p>`:""}</div>`;
  h+=`<div class="card"><h3>Fossil material</h3><dl class="kv"><dt>Holotype</dt><dd>${esc(g.holotype)}</dd><dt>Known material</dt><dd>${esc(g.material)}</dd><dt>Completeness</dt><dd>${esc(g.completeness)}</dd>${g.exceptional?`<dt>Exceptional</dt><dd>${esc(g.exceptional)}</dd>`:""}</dl></div>`;
  h+=`<div class="card"><h3>Classification</h3><p style="margin:0 0 6px">${pathC.map(c=>`<a style="cursor:pointer" onclick="go('${c.id}')">${esc(c.name)}</a>`).join(" › ")}</p>${g.isnote?`<p class="note" style="margin:0">${esc(g.isnote)}</p>`:""}</div>`;
  h+=`</div></div>`;
  // formations
  h+=`<div class="card"><h3>Geological formations (${g.formations.length})</h3><table><tr><th>Formation</th><th>Member / unit</th><th>Country · region</th><th>Interval</th><th>Occ.</th></tr>${g.formations.map(f=>`<tr><td>${esc(f.formation)}${f.group?` <span class="note">(${esc(f.group)} Gr.)</span>`:""}</td><td>${esc(f.members.join(", "))}</td><td>${esc(f.country)}${f.regions.length?" · "+esc(f.regions.join(", ")):""}</td><td>${esc(f.interval)}${f.ma?` <span class="note">${f.ma[1]}–${f.ma[0]} Ma</span>`:""}</td><td>${f.n??""}</td></tr>`).join("")}</table><p class="note">Occurrences from the Paleobiology Database unless noted; “Unnamed unit” = no formation recorded.</p></div>`;
  // species
  h+=`<div class="card"><h3>Species (${g.species.length})</h3><table><tr><th>Species</th><th>Authority</th><th>Interval</th></tr>${g.species.map(s=>`<tr><td><i>${esc(s.name)}</i></td><td>${esc(s.author)}</td><td>${esc(s.interval)}${s.fad?` <span class="note">${fmtMa(s.fad)}–${fmtMa(s.lad)}</span>`:""}</td></tr>`).join("")}</table><p class="note">Valid species only; nomina dubia are listed under “Excluded names”.</p></div>`;
  h+=`<div class="card"><h3>Sources</h3>${sources(g.sources)}</div></div>`;
  $("#view").innerHTML=h;
  const show=i=>{const im=imgs[i];if(!im)return;$("#fig").innerHTML=`<div class="hero"><img src="${imgKey(g.name,im.kind)}" alt="${esc(im.caption)}" onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'note',textContent:'Image unavailable offline — see the source link.'}))"></div><figcaption>${esc(im.caption)}. ${im.artist?"By "+esc(im.artist)+", ":""}${lic(im.license,im.licurl)}${im.date?", "+esc(String(im.date).slice(0,10)):""} — <a href="${esc(im.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>.${im.kind==="life"?" <br>Paleoart as used on English Wikipedia; reconstruction is interpretive and has not been independently reviewed for this atlas.":""}</figcaption>`;
    document.querySelectorAll(".imgtabs button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i))};
  document.querySelectorAll(".imgtabs button").forEach(b=>b.onclick=()=>show(+b.dataset.i));show(0);
}

/* ---------- clade entry ---------- */
function allGenera(id){const out=[];(function r(k){const n=byId[k];if(n.type==="genus")out.push(n);else children[k].forEach(r)})(id);return out}
function thumb(g){const im=(g.images||[])[0];if(im)return `<div class="th" style="background-image:url('${imgKey(g.name,im.kind)}')"></div>`;
  return `<div class="th">${g.silhouette?`<img src="${silSrc(g.silhouette)}" alt="">`:""}</div>`}
function renderClade(id){const c=byId[id],gs=allGenera(id),s=c.stat;
  const direct=children[id].filter(k=>byId[k].type==="genus");
  let h=`<div class="ficha">${crumbs(id)}<h2>${esc(c.name)}</h2><div class="auth">Clade · ${s.g} genera in this volume · ${fmtMa(s.fad)}–${fmtMa(s.lad)}</div><p class="lead">${esc(c.sum)}</p>`;
  h+=`<div class="card"><div class="stat"><div><b>${s.g}</b><span>genera</span></div><div><b>${gs.reduce((a,g)=>a+g.species.length,0)}</b><span>valid species</span></div><div><b>${fmtMa(s.fad).replace(" Ma","")}–${fmtMa(s.lad).replace(" Ma","")}</b><span>million years ago</span></div><div><b>${s.cc.size}</b><span>countries with fossils</span></div></div></div>`;
  h+=`<div class="grid"><div><div class="card"><h3>Diagnostic features</h3><ul class="diag">${c.diag.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div></div><div><div class="card"><h3>Notes on classification</h3><p style="margin:0">${esc(c.notes)}</p></div></div></div>`;
  h+=`<div class="card"><h3>Genera through time</h3><div class="tl">${timeline(gs.sort((a,b)=>b.fad-a.fad).map(g=>[g.fad,g.lad,era(g.fad)[3]]),40+gs.length*7)}</div></div>`;
  const sub=children[id].filter(k=>byId[k].type==="clade");
  if(sub.length)h+=`<div class="card"><h3>Subgroups</h3><div class="members">${sub.map(k=>{const sc=byId[k];const rep=allGenera(k).find(g=>g.images&&g.images.some(i=>i.kind==="life"))||allGenera(k)[0];return `<div class="mem" onclick="go('${k}')">${rep?thumb(rep):""}<div class="nm">${esc(sc.name)}<small>${sc.stat.g} genera</small></div></div>`}).join("")}</div></div>`;
  if(direct.length)h+=`<div class="card"><h3>Genera placed directly here</h3><div class="members">${direct.sort().map(k=>{const g=byId[k];return `<div class="mem" onclick="go('${k}')">${thumb(g)}<div class="nm"><i>${esc(k)}</i><small>${g.isd?"incertae sedis · ":""}${esc(g.early)}</small></div></div>`}).join("")}</div></div>`;
  h+=`<div class="card"><h3>Sources</h3>${sources(c.sources)}</div></div>`;
  $("#view").innerHTML=h}

/* ---------- timeline view ---------- */
let TLMODE="condensed";
function renderTime(){
  const c0=cur||"vida",scope=byId[c0]&&byId[c0].type==="clade"?c0:(byId[c0]?byId[c0].parent:"vida");
  const sc=byId[scope],GN={};D.genera.forEach(g=>{if(g.fad!=null)GN[g.name]=g});
  // aggregate ranges per node
  const R={};(function agg(id){const n=byId[id];if(n.type!=="clade"){const g=GN[id];R[id]=g?{fad:g.fad,lad:g.lad,n:1}:null;return R[id]}
    let r=null;for(const k of children[id]){const x=agg(k);if(!x)continue;r=r?{fad:Math.max(r.fad,x.fad),lad:Math.min(r.lad,x.lad),n:r.n+x.n}:{...x}}R[id]=r;return r})(scope);
  const up=sc.parent&&byId[sc.parent]?`<a style="cursor:pointer" onclick="cur='${sc.parent}';renderTime()">widen to ${esc(byId[sc.parent].name)}</a>`:"";
  const tog=`<span class="seg tlseg">${[["condensed","Condensed (3 levels)"],["all","All genera"]].map(([k,l])=>`<button class="${TLMODE===k?"on":""}" onclick="TLMODE='${k}';renderTime()">${l}</button>`).join("")}</span>`;
  const head=`<h2>${esc(sc.name)} through time</h2><p class="note">Stratigraphic ranges (PBDB) within <b>${esc(sc.name)}</b>${byId[c0].type!=="clade"?`, with <i>${esc(byId[c0].name)}</i> highlighted`:""}. This view follows the entry selected in the encyclopedia. ${up?"· "+up:""}</p>${tog}`;
  if(!R[scope]){$("#view").innerHTML=`<div class="tlv">${head}<div class="card" style="margin-top:12px"><p style="margin:0">No genus of ${esc(sc.name)} has stratigraphic ranges in the atlas yet — so far only the Pterosauria entries carry ages.</p></div></div>`;return}
  // rows
  const rows=[],MAXD=3,ord=ks=>ks.filter(k=>R[k]).sort((p,q)=>R[q].fad-R[p].fad||R[q].lad-R[p].lad);
  if(TLMODE==="all"){Object.keys(GN).filter(g=>path(g).some(n=>n.id===scope)).sort((p,q)=>GN[q].fad-GN[p].fad||GN[q].lad-GN[p].lad).forEach(g=>rows.push({id:g,d:0}))}
  else (function walk(id,d){const ks=ord(children[id]),cs=ks.filter(k=>byId[k].type==="clade"),gs=ks.filter(k=>byId[k].type!=="clade");
    if(!cs.length){if(id===scope)gs.forEach(k=>rows.push({id:k,d}));return}
    cs.forEach(k=>{rows.push({id:k,d});if(d<MAXD)walk(k,d+1)});
    if(gs.length===1)rows.push({id:gs[0],d});
    else if(gs.length){const r={fad:Math.max(...gs.map(k=>R[k].fad)),lad:Math.min(...gs.map(k=>R[k].lad)),n:gs.length};rows.push({id:id,d,grp:gs,rg:r})}})(scope,1);
  const hlPath=new Set(path(c0).map(n=>n.id));
  const A0=R[scope].fad,B0=R[scope].lad,pad=(A0-B0)*0.04+1,A=A0+pad,B=Math.max(B0-pad,0);
  const W=1000,L=230,rowH=15,x=v=>L+(A-v)/(A-B)*(W-L-10),Hh=rows.length*rowH;
  let s=`<svg viewBox="0 0 ${W} ${50+Hh}" style="width:100%;min-width:760px">`;
  for(const[nm,a0,b0,c]of ERAS){const a=Math.min(a0,A),b=Math.max(b0,B);if(a<=b)continue;
    s+=`<rect x="${x(a)}" y="0" width="${x(b)-x(a)}" height="22" fill="${c}"/><text x="${(x(a)+x(b))/2}" y="15" font-size="12" text-anchor="middle" fill="#fff">${x(b)-x(a)>50?nm:""}</text><rect x="${x(a)}" y="22" width="${x(b)-x(a)}" height="${Hh+10}" fill="${c}" opacity=".06"/>`}
  {const span=A-B,st=[1,2,5,10,20,25,50].find(v=>span/v<=12)||50;for(let v=Math.ceil(B/st)*st;v<=A;v+=st)s+=`<line x1="${x(v)}" x2="${x(v)}" y1="22" y2="${32+Hh}" stroke="#000" opacity=".07"/><text x="${x(v)}" y="${46+Hh}" font-size="9.5" text-anchor="middle" fill="#7a7266">${v} Ma</text>`}
  const kids=children[scope].filter(k=>byId[k].type==="clade"&&R[k]),pal=["#a35a2d","#2f6150","#55607a","#7a4d7a","#8a7a2a","#2a6a8a","#8a3a3a","#4d6a2a"];
  const colOf=id=>{const p=path(id);const i=kids.findIndex(k=>p.some(n=>n.id===k));return i<0?"#9a9184":pal[i%pal.length]};
  const shown=new Set(rows.filter(r=>!r.grp).map(r=>r.id));
  const deepest=rows.filter(r=>!r.grp&&hlPath.has(r.id)).map(r=>r.id).pop();
  rows.forEach((r,i)=>{const n=byId[r.id],isC=r.grp?true:n.type==="clade",y=30+i*rowH,rg=r.rg||R[r.id],a=x(rg.fad),b=Math.max(x(rg.lad),a+3);
    const on=r.grp?r.grp.includes(c0):(r.id===c0||(byId[c0].type!=="clade"&&!shown.has(c0)&&!rows.some(q=>q.grp&&q.grp.includes(c0))&&r.id===deepest));
    const lab=r.grp?`${rg.n} other genera`:isC?`${esc(n.name.length>26?n.name.slice(0,25)+"…":n.name)} (${rg.n})`:esc(n.name),ix=(r.d?r.d-1:0)*12;
    const tip=r.grp?r.grp.join(", "):n.name+(isC?` — ${rg.n} genera`:"");
    s+=`<g class="bar" style="cursor:pointer" onclick="${r.grp?`cur='${r.grp.includes(c0)?c0:r.grp[0]}'`:`cur='${r.id}'`};renderTime()"><title>${esc(tip)}: ${rg.fad}–${rg.lad} Ma</title>${on?`<rect x="0" y="${y-2}" width="${W}" height="${rowH}" fill="#c0392b" opacity=".12"/>`:""}<text x="${10+ix}" y="${y+9}" font-size="${isC?11:10.5}" ${r.grp?'font-style="italic" fill="#7a7266"':isC?'font-weight="600"':'font-style="italic"'} ${on?'fill="#b03a1e" data-on="1"':""}>${lab}</text><rect x="${a}" y="${y+(isC?0:1)}" width="${b-a}" height="${isC?11:9}" rx="2" fill="${on?"#c0392b":r.grp?colOf(r.grp[0]):colOf(r.id)}" opacity="${isC?.55:1}"/></g>`});
  s+="</svg>";
  const leg=kids.map(k=>`<span style="white-space:nowrap"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${pal[kids.indexOf(k)%pal.length]}"></span> <a style="cursor:pointer" onclick="cur='${k}';renderTime()">${esc(byId[k].name)}</a></span>`).join(" &nbsp; ");
  $("#view").innerHTML=`<div class="tlv">${head}<p class="note">${leg}${leg?' &nbsp; <span style="white-space:nowrap"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#9a9184"></span> other</span> · ':""}Pale bars = whole range of a group (genus count in brackets). Click a row to select it; switch to <b>Entry</b> to read it.</p><div style="overflow:auto">${s}</div></div>`;
  const sb=document.querySelector(".tlv [data-on]");if(sb)sb.scrollIntoView({block:"center"});
  renderSide()}

/* ---------- excluded ---------- */
function renderExcluded(){const x=D.excluded.slice().sort((a,b)=>a.name.localeCompare(b.name));
  $("#view").innerHTML=`<div class="xl"><h2>Excluded names</h2><p class="note">Names not accepted as valid taxa and therefore left out of the tree: <i>nomina dubia</i> (not diagnosable) and <i>nomina nuda</i> (published without a valid description), as recorded by the Paleobiology Database, plus spelling corrections to the original list.</p><table><tr><th>Name</th><th>Author</th><th>Status</th><th>Source</th></tr>${x.map(e=>`<tr><td><i>${esc(e.name)}</i></td><td>${esc(e.author)}</td><td>${esc(e.status)}</td><td class="note">${esc(e.ref||e.source)}</td></tr>`).join("")}</table></div>`}

/* ---------- about ---------- */
function renderAbout(){const n=D.genera.length,li=D.genera.filter(g=>(g.images||[]).some(i=>i.kind==="life")).length,fo=D.genera.filter(g=>(g.images||[]).length&&!(g.images||[]).some(i=>i.kind==="life")).length,gl=D.genera.filter(g=>g.silhouette&&g.silhouette.genus_level).length;
  $("#view").innerHTML=`<div class="xl"><h2>About this volume</h2>
  <p>Pilot volume of the Atlas of Life: ${n} pterosaur genera and ${D.clades.length} clades, built ${esc(D.meta.built)}.</p>
  <div class="card"><h3>Coverage</h3><dl class="kv"><dt>Genera</dt><dd>${n}</dd><dt>Life restoration</dt><dd>${li} genera</dd><dt>Fossil image only</dt><dd>${fo} genera</dd><dt>No image</dt><dd>${n-li-fo} genera (silhouette only)</dd><dt>Genus-level silhouette</dt><dd>${gl} genera; the rest use a silhouette of a related form, labelled as such</dd><dt>With wingspan</dt><dd>${D.genera.filter(g=>g.ws).length} genera</dd></dl></div>
  <div class="card"><h3>Method</h3><ul class="diag"><li>Authority, age range, species list and geological occurrences: <a href="https://paleobiodb.org" target="_blank" rel="noopener">Paleobiology Database</a> (data service 1.2, downloaded 15 Nov 2026). Only taxa marked valid are included.</li><li>Descriptions, sizes, fossil material and biology: paraphrased from the original descriptions and redescriptions cited in each entry, via the English Wikipedia articles (exact revision linked).</li><li>Placement: each genus sits under the most inclusive clade on which analyses agree; disputed placements are marked <i>incertae sedis</i> with the competing hypotheses.</li><li>Images: Wikimedia Commons (life restorations and fossil photographs, with author and licence) and <a href="https://www.phylopic.org" target="_blank" rel="noopener">PhyloPic</a> silhouettes. No AI-generated images.</li></ul></div>
  <div class="card"><h3>Known limitations</h3><ul class="diag"><li>Life restorations are those used on English Wikipedia; they have not been independently reviewed for this atlas, and some may be outdated.</li><li>PBDB records can lag behind recent taxonomic changes (e.g. the proposed synonymy of <i>Aurorazhdarcho</i> with <i>Gnathosaurus</i>).</li><li>PBDB stratigraphic ranges include tentatively referred occurrences and can therefore be wider than the securely dated record (see the note on each entry).</li><li>Twelve recently named or renamed genera are not yet in PBDB; their ages are given as stage brackets.</li></ul></div></div>`}
/* ---------- basic entry for groups not yet covered ---------- */
function renderBasic(id){const n=byId[id],kids=children[id],cl=kids.filter(k=>byId[k].type==="clade"),gs=kids.filter(k=>byId[k].type==="genus");
  const st=n.status==="e"?"Extinct":n.status==="v"?"Living (extant)":"";
  let h=`<div class="ficha">${crumbs(id)}<h2>${n.type==="genus"?"<i>"+esc(n.name)+"</i>":esc(n.name)}</h2><div class="auth">${n.type==="clade"?"Clade":"Genus"}${st?" · "+st:""}</div>`;
  h+=`<div class="card" style="margin-top:16px;background:#f7f0e0"><p style="margin:0">This ${n.type==="clade"?"group":"genus"} is in the tree of life but does not have a full entry yet — only the Pterosauria volume has been written so far. ${n.note?`<br><br><b>Note:</b> ${esc(n.note)}`:""}</p></div>`;
  if(n.type==="clade"){const s=n.stat;
    h+=`<div class="card"><div class="stat"><div><b>${s.g}</b><span>genera listed</span></div><div><b>${s.e}</b><span>extinct</span></div><div><b>${s.g-s.e}</b><span>living or unspecified</span></div><div><b>${cl.length}</b><span>direct subgroups</span></div></div></div>`;
    if(cl.length)h+=`<div class="card"><h3>Subgroups</h3><div class="chips">${cl.map(k=>`<a class="chip" onclick="go('${k}')">${esc(byId[k].name)} <small>${byId[k].stat.g}</small></a>`).join("")}</div></div>`;
    if(gs.length)h+=`<div class="card"><h3>Genera placed directly here (${gs.length})</h3><div class="chips">${gs.map(k=>`<a class="chip" onclick="go('${k}')"><i>${byId[k].status==="e"?"† ":""}${esc(byId[k].name)}</i></a>`).join("")}</div></div>`}
  h+=`<p class="note">Tree data from the earlier version of the atlas (your genus list and clade backbone).</p></div>`;
  $("#view").innerHTML=h}


/* ---------- encyclopedia search & index ---------- */
let ALL=[];
function matches(q,limit){q=q.trim().toLowerCase();if(q.length<2)return[];
  const r=[];for(const n of ALL){const k=n.name.toLowerCase();const i=k.indexOf(q);if(i<0)continue;r.push([(i===0?0:1)+(n.ficha?0:2),n])}
  r.sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name));return r.slice(0,limit).map(x=>x[1])}
function parentName(n){const p=byId[n.parent];return p?p.name:""}
function initSearch(){ALL=Object.values(byId).sort((a,b)=>a.name.localeCompare(b.name));
  const inp=$("#ssearch"),res=$("#sres");let hits=[],hi=0;
  const show=()=>{hits=matches(inp.value,14);hi=0;
    res.innerHTML=hits.length?hits.map((n,i)=>`<div class="sr${i===hi?" on":""}" data-id="${n.id}">${n.type==="genus"?"<i>"+esc(n.name)+"</i>":esc(n.name)}${n.ficha?' <span class="fb">entry</span>':""}<small>${n.type==="clade"?"clade":"genus"} · ${esc(parentName(n))}</small></div>`).join("")+(inp.value.trim().length>=2?`<div class="sr more" data-more="1">All results in the index →</div>`:""):(inp.value.trim().length>=2?`<div class="sr none">No match</div>`:"");
    res.querySelectorAll(".sr[data-id]").forEach(d=>d.onmousedown=e=>{e.preventDefault();pick(d.dataset.id)});
    const m=res.querySelector("[data-more]");if(m)m.onmousedown=e=>{e.preventDefault();IDXQ=inp.value;res.innerHTML="";location.hash="index";if(view==="index")renderIndex()}};
  const pick=id=>{inp.value="";res.innerHTML="";go(id)};
  inp.addEventListener("input",show);inp.addEventListener("blur",()=>setTimeout(()=>res.innerHTML="",150));
  inp.addEventListener("keydown",e=>{if(!hits.length)return;if(e.key==="ArrowDown"){hi=Math.min(hi+1,hits.length-1)}else if(e.key==="ArrowUp"){hi=Math.max(hi-1,0)}else if(e.key==="Enter"){pick(hits[hi].id);return}else return;
    e.preventDefault();res.querySelectorAll(".sr[data-id]").forEach((d,i)=>d.classList.toggle("on",i===hi))});
  $("#names").innerHTML=[...new Set(ALL.map(n=>n.name))].map(n=>`<option value="${esc(n)}">`).join("");
}
let IDXQ="",IDXF="ficha",IDXC="";
function renderIndex(){
  $("#view").innerHTML=`<div class="xl" style="max-width:1100px"><h2>Index</h2><p class="note">Every clade and genus in the atlas, A–Z. Entries marked <span class="fb">entry</span> have a full encyclopedia page; the others have a basic page.</p>
    <div class="ixbar"><input id="ixq" type="search" placeholder="Filter by name…" value="${esc(IDXQ)}"><span class="seg">${[["ficha","Full entries"],["clade","Clades"],["genus","Genera"],["all","All"]].map(([k,l])=>`<button data-f="${k}" class="${IDXF===k?"on":""}">${l}</button>`).join("")}</span><span id="ixn" class="note"></span></div>
    <div class="ixbar" style="margin-top:0"><input id="ixc" type="search" placeholder="Filter by clade…" list="clnames" value="${esc(IDXC?byId[IDXC].name:"")}" autocomplete="off"><datalist id="clnames">${ALL.filter(n=>n.type==="clade").map(n=>`<option value="${esc(n.name)}">`).join("")}</datalist><span id="ixcn" class="note"></span></div>
    <div id="ixletters" class="ixletters"></div><div id="ixlist"></div></div>`;
  const draw=()=>{const q=IDXQ.trim().toLowerCase();
    let inC=null;if(IDXC){inC=new Set();(function r(k){inC.add(k);(children[k]||[]).forEach(r)})(IDXC);inC.delete(IDXC)}
    $("#ixcn").innerHTML=IDXC?`Showing everything inside <b>${esc(byId[IDXC].name)}</b> · <a style="cursor:pointer" id="ixcclr">clear</a>`:"Pick a clade to list all genera inside it.";
    const cl=$("#ixcclr");if(cl)cl.onclick=()=>{IDXC="";$("#ixc").value="";draw()};
    const L=ALL.filter(n=>(IDXF==="all"||(IDXF==="ficha"?n.ficha:n.type===IDXF))&&(!q||n.name.toLowerCase().includes(q))&&(!inC||inC.has(n.id)));
    $("#ixn").textContent=L.length+" entries";
    const groups={};for(const n of L){const c=n.name[0].toUpperCase();(groups[c]=groups[c]||[]).push(n)}
    const ks=Object.keys(groups).sort();
    $("#ixletters").innerHTML=ks.map(k=>`<a data-l="${k}">${k}</a>`).join("");
    $("#ixlist").innerHTML=ks.map(k=>`<div class="ixg" id="ix-${k}"><h3>${k}</h3><div class="ixcols">${groups[k].slice(0,1500).map(n=>`<a class="ixe" onclick="go('${n.id}')">${n.type==="genus"?"<i>"+(n.status==="e"&&!n.ficha?"† ":"")+esc(n.name)+"</i>":"<b>"+esc(n.name)+"</b>"}${n.ficha?' <span class="fb">entry</span>':""}<small>${esc(parentName(n))}</small></a>`).join("")}</div></div>`).join("")||`<p class="note">Nothing matches.</p>`;
    $("#ixletters").querySelectorAll("a").forEach(a=>a.onclick=()=>document.getElementById("ix-"+a.dataset.l).scrollIntoView({behavior:"smooth"}))};
  $("#ixq").addEventListener("input",e=>{IDXQ=e.target.value;draw()});
  const setF=f=>{IDXF=f;document.querySelectorAll(".ixbar [data-f]").forEach(x=>x.classList.toggle("on",x.dataset.f===f))};
  $("#ixc").addEventListener("input",e=>{const v=e.target.value.trim().toLowerCase();
    if(!v){if(IDXC){IDXC="";draw()}return}
    const c=ALL.find(n=>n.type==="clade"&&n.name.toLowerCase()===v);if(c&&c.id!==IDXC){IDXC=c.id;setF("genus");draw()}});
  document.querySelectorAll(".ixbar [data-f]").forEach(b=>b.onclick=()=>{IDXF=b.dataset.f;document.querySelectorAll(".ixbar [data-f]").forEach(x=>x.classList.toggle("on",x===b));draw()});
  draw();
}

/* ---------- cladogram ---------- */
const CL=(()=>{let svg,g,zoom,t=null,sel=null,timer=null,pos={};
  const DX=22,DY=270;
  function visTree(id){const n=byId[id];return{id,children:n.type==="clade"&&open.has(id)?children[id].map(visTree):null}}
  function render(focusId){
    $("#view").innerHTML=`<div id="cwrap"><svg id="csvg"><defs><clipPath id="cc"><circle r="10"/></clipPath></defs><g id="cg"></g></svg>
      <div class="ctools"><input id="csearch" type="search" placeholder="Search a clade or genus…" list="names" autocomplete="off"><button data-a="go">Search</button><button data-a="prune" title="Close every node except the path to the highlighted one">Prune</button><button data-a="root">Root</button><button data-a="collapse">Collapse all</button></div>
      <div class="chint">Search: opens all subgroups of a clade and collapses the rest · Prune: closes everything except the path to the highlighted node · Click: select · Double-click: open / close a group · Switch to Encyclopedia (top menu) to read the selected node · Drag and scroll to move and zoom</div><div id="cinfo"></div></div>`;
    svg=d3.select("#csvg");g=d3.select("#cg");
    zoom=d3.zoom().scaleExtent([0.08,3]).on("zoom",e=>{t=e.transform;g.attr("transform",t)});
    svg.call(zoom).on("dblclick.zoom",null);
    const runSearch=()=>{const v=$("#csearch").value.trim().toLowerCase();if(v.length<2){if(v.length)$("#cinfo").innerHTML=`<div class="ci"><div>Type at least two letters.</div></div>`;return}const id=byName[v]||Object.keys(byName).filter(k=>k.startsWith(v)).map(k=>byName[k])[0];
      if(id)isolate(id);else $("#cinfo").innerHTML=`<div class="ci"><div>No clade or genus matches “${esc(v)}”.</div></div>`};
    $("#csearch").addEventListener("change",runSearch);$("#csearch").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});
    document.querySelectorAll(".ctools button").forEach(b=>b.onclick=()=>{const a=b.dataset.a;
      if(a==="go")runSearch();else if(a==="collapse"){open=new Set(["vida"]);draw();center("vida")}else if(a==="root"){center("vida")}else if(a==="prune")prune()});
    if(t)svg.call(zoom.transform,t);
    // sync with the encyclopedia: the entry being read becomes the highlighted node
    if(focusId&&byId[focusId]){reveal(focusId);sel=focusId;draw();center(focusId);info(focusId)}
    else{draw();if(!t)center("vida");if(sel)info(sel)}
  }
  function draw(anchor){
    const root=d3.hierarchy(visTree("vida"));d3.tree().nodeSize([DX,DY]).separation((a,b)=>{const o=x=>x.children?1.6:1;return Math.max(o(a),o(b))*(a.parent===b.parent?1:1.25)})(root);
    const old=anchor&&pos[anchor];pos={};root.each(d=>pos[d.data.id]=[d.y,d.x]);
    const L=g.selectAll("path.lk").data(root.links(),d=>d.target.data.id);
    L.join("path").attr("class","lk").attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
    const N=g.selectAll("g.nd").data(root.descendants(),d=>d.data.id).join(enter=>{const e=enter.append("g").attr("class","nd");
        e.append("circle").attr("class","c");e.append("image").attr("class","im");e.append("text").attr("class","tx");e.append("title");return e});
    N.attr("transform",d=>`translate(${d.y},${d.x})`).each(function(d){const n=byId[d.data.id],el=d3.select(this),isC=n.type==="clade",closed=isC&&!open.has(n.id)&&children[n.id].length;
      const img=n.ficha&&n.images&&n.images.length?imgKey(n.name,n.images[0].kind):null;
      const col=n.status==="v"?"#2f7350":n.status==="e"?"#a8622f":"#8b8371";
      el.classed("sel",n.id===sel).classed("ficha",n.ficha);
      el.select("circle.c").attr("r",img?11:isC?5:3.5).attr("fill",closed?col:"#fbf8f1").attr("stroke",col).attr("stroke-width",isC?1.6:1.2);
      el.select("image.im").attr("href",img).attr("x",-10).attr("y",-10).attr("width",20).attr("height",20).attr("preserveAspectRatio","xMidYMid slice").attr("clip-path","url(#cc)").style("display",img?null:"none");
      const inner=isC&&open.has(n.id)&&children[n.id].length;
      el.select("text.tx").attr("x",inner?-4:img?15:9).attr("dy",inner?"-0.75em":"0.32em").attr("text-anchor","start").attr("class","tx"+(isC?" cl":" gn")+(n.ficha?" fi":""))
        .text((n.status==="e"&&!isC&&!n.ficha?"† ":"")+(n.name.length>32?n.name.slice(0,30)+"…":n.name)+(closed?`  (${n.stat.g})`:""));
      el.select("title").text(n.name+(n.ficha?" — full entry available":"")+"\nClick: select"+(isC?" · Double-click: open/close":""));
    }).on("click",(e,d)=>{e.stopPropagation();const id=d.data.id;if(sel===id)return;sel=id;cur=id;draw();info(id)})
      .on("dblclick",(e,d)=>{e.stopPropagation();const id=d.data.id;sel=id;cur=id;
        if(byId[id].type==="clade"&&children[id].length){open.has(id)?open.delete(id):open.add(id);draw(id)}else draw();info(id)});
    if(old&&pos[anchor]){const nw=pos[anchor],k=t?t.k:1;svg.call(zoom.translateBy,(old[0]-nw[0]),(old[1]-nw[1]))}
  }
  function center(id){const p=pos[id];if(!p)return;const r=$("#csvg").getBoundingClientRect(),k=t?Math.max(t.k,0.6):0.9;
    svg.call(zoom.transform,d3.zoomIdentity.translate(r.width*0.45-p[0]*k,r.height/2-p[1]*k).scale(k))}
  function isolate(id){const n=byId[id];open=new Set();let p=byId[n.parent];while(p){open.add(p.id);p=byId[p.parent]}
    if(n.type==="clade")(function r(k){if(byId[k].type!=="clade")return;open.add(k);children[k].forEach(r)})(id);
    sel=id;cur=id;draw();fit(id);info(id)}
  function prune(){const id=sel||cur||"vida";const keep=new Set();let p=byId[byId[id].parent];while(p){keep.add(p.id);p=byId[p.parent]}
    if(open.has(id))keep.add(id);keep.add("vida");open=keep;sel=id;cur=id;draw();center(id);info(id)}
  function fit(id){const ids=[];(function r(k){if(!pos[k])return;ids.push(k);if(byId[k].type==="clade"&&open.has(k))children[k].forEach(r)})(id);
    const xs=ids.map(k=>pos[k][0]),ys=ids.map(k=>pos[k][1]);const x0=Math.min(...xs),x1=Math.max(...xs)+220,y0=Math.min(...ys)-20,y1=Math.max(...ys)+20;
    const r=$("#csvg").getBoundingClientRect();const k=Math.max(0.08,Math.min(1.2,Math.min((r.width-380)/(x1-x0||1),(r.height-60)/(y1-y0||1))));
    svg.call(zoom.transform,d3.zoomIdentity.translate(30-x0*k,(r.height-(y1-y0)*k)/2-y0*k).scale(k))}
  function focus(id){reveal(id);if(byId[id].type==="clade")open.add(id);sel=id;draw();center(id);info(id)}
  function info(id){const n=byId[id];if(!n){return}const path=(()=>{const p=[];let m=byId[n.parent];while(m&&p.length<4){p.unshift(m.name);m=byId[m.parent]}return p.join(" › ")})();
    const im=n.ficha&&n.images&&n.images[0];
    $("#cinfo").innerHTML=`<div class="ci">${im?`<img src="${imgKey(n.name,im.kind)}" alt="">`:""}<div><div class="cpath">${esc(path)}</div><div class="cname">${n.type==="genus"?"<i>":""}${esc(n.name)}${n.type==="genus"?"</i>":""}</div>
      <div class="note">${n.type==="clade"?n.stat.g+" genera":""}${n.ficha&&n.type==="genus"?esc(n.early||"")+" · "+(n.ws?"wingspan "+n.ws[1]+" m":""):""}${!n.ficha&&n.status?(n.status==="e"?" · extinct":" · living"):""}</div>
      ${n.ficha?`<p style="margin:6px 0 0;font-size:13px">${esc(n.sum)}</p>`:n.note?`<p style="margin:6px 0 0;font-size:13px">${esc(n.note)}</p>`:""}
      <div class="note" style="margin-top:6px">Switch to <b>Encyclopedia</b> above to read ${n.ficha?"its entry":"its basic page"}.</div></div></div>`}
  function show(id){location.hash="cladogram";setTimeout(()=>isolate(id),30)}
  return{render,focus,show,isolate};
})();

</script>
