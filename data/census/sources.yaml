# Where the census (scripts/fetch/census.py) looks for each group's genera. One key per group: a volume folder
# (entries/<group>) or a clade that may become a volume. Edit by hand.
#   pbdb        base taxon of the PBDB query (all descendants, rank genus)
#   wikipedia   categories (without "Category:") whose pages are read, sub-categories followed to `depth`;
#               a category that does not exist is reported in the census with existing ones found by search; Wikipedia names
#               them "Prehistoric <group> genera" / "Prehistoric <group>s" (Pterosaur genera is an exception)
#               probe: example pages whose categories are listed in the report (how Wikipedia files the group)
#   literature  words searched with "new genus" in Crossref and Europe PMC
pterosauria:
  pbdb: Pterosauria
  wikipedia: { categories: [Pterosaur genera, Pterosaurs], depth: 2 }
  literature: [pterosaur, Pterosauria, azhdarchid, pterodactyloid]
pseudosuchia:
  pbdb: Pseudosuchia
  wikipedia: { categories: [Prehistoric pseudosuchian genera, Prehistoric crocodylomorphs], depth: 3 }
  literature: [pseudosuchian, crocodylomorph, crocodyliform, crocodile, alligatoroid, notosuchian, thalattosuchian, aetosaur, rauisuchian]
sauropodomorpha:
  pbdb: Sauropodomorpha
  wikipedia: { categories: [Prehistoric sauropodomorph genera, Prehistoric sauropodomorphs, Prehistoric sauropods], depth: 3, probe: [Diplodocus, Plateosaurus, Brachiosaurus] }
  literature: [sauropod, sauropodomorph, titanosaur, diplodocid, prosauropod]
ornithischia:
  pbdb: Ornithischia
  wikipedia: { categories: [Prehistoric ornithischian genera, Prehistoric ornithischians], depth: 3, probe: [Triceratops, Stegosaurus, Iguanodon] }
  literature: [ornithischian, ceratopsian, hadrosaurid, ankylosaur, stegosaur, ornithopod, pachycephalosaur]
theropoda:
  pbdb: Theropoda
  wikipedia: { categories: [Prehistoric theropod genera, Prehistoric theropods], depth: 3, probe: [Tyrannosaurus, Velociraptor, Allosaurus] }
  literature: [theropod, tyrannosaurid, dromaeosaurid, oviraptorosaur, spinosaurid, abelisaurid, troodontid, megalosaurid]
