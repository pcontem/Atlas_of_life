# Where the census (scripts/fetch/census.py) looks for each group's genera. One key per group: a volume folder
# (entries/<group>) or a clade that may become a volume. Edit by hand.
#   pbdb        base taxon of the PBDB query (all descendants, rank genus)
#   wikipedia   categories (without "Category:") whose pages are read, sub-categories followed to `depth`;
#               a category that does not exist is reported in the census with existing ones found by search; Wikipedia names
#               them "Prehistoric <group> genera" / "Prehistoric <group>s" (Pterosaur genera is an exception)
#               probe: example pages whose categories are listed in the report (how Wikipedia files the group)
#   literature  words searched with "new genus" in Crossref and Europe PMC
pterosauria:
  pbdb: Pterosauria
  wikipedia: { categories: [Pterosaur genera, Pterosaurs], depth: 2 }
  literature: [pterosaur, Pterosauria, azhdarchid, pterodactyloid]
pseudosuchia:
  pbdb: Pseudosuchia
  wikipedia: { categories: [Prehistoric pseudosuchian genera, Prehistoric crocodylomorphs], depth: 3 }
  literature: [pseudosuchian, crocodylomorph, crocodyliform, crocodile, alligatoroid, notosuchian, thalattosuchian, aetosaur, rauisuchian]
sauropodomorpha:
  pbdb: Sauropodomorpha
  wikipedia: { categories: [Sauropodomorpha, Diplodocoidea, Macronaria, Titanosauria, Diplodocidae, Brachiosauridae, Mamenchisauridae, Rebbachisauridae, Dicraeosauridae, Camarasauridae, Saltasauridae, Euhelopodidae, Turiasauria], depth: 4, probe: [Diplodocus, Plateosaurus, Brachiosaurus, Mamenchisaurus] }
  literature: [sauropod, sauropodomorph, titanosaur, diplodocid, prosauropod]
ornithischia:
  pbdb: Ornithischia
  wikipedia: { categories: [Ornithischia, Thyreophora, Ankylosauria, Ankylosauridae, Nodosauridae, Stegosauria, Stegosauridae, Ornithopoda, Hadrosauridae, Iguanodontia, Hypsilophodontidae, Heterodontosauridae, Marginocephalia, Ceratopsia, Ceratopsidae, Pachycephalosauria, Neornithischia], depth: 4, probe: [Triceratops, Stegosaurus, Iguanodon, Edmontosaurus, Ankylosaurus, Pachycephalosaurus] }
  literature: [ornithischian, ceratopsian, hadrosaurid, ankylosaur, stegosaur, ornithopod, pachycephalosaur]
theropoda:
  pbdb: Theropoda
  wikipedia: { categories: [Prehistoric theropods, Carnosauria, Tyrannosauroidea, Coelurosauria], depth: 4, probe: [Tyrannosaurus, Velociraptor, Allosaurus] }
  literature: [theropod, tyrannosaurid, dromaeosaurid, oviraptorosaur, spinosaurid, abelisaurid, troodontid, megalosaurid]
theropoda1:
  # Theropoda I (volume plan of 2026-11-25): everything in Theropoda except Maniraptora (which includes Aves).
  pbdb: Theropoda^Maniraptora
  wikipedia: { categories: [Coelophysoidea, Ceratosauria, Abelisauridae, Noasauridae, Megalosauroidea, Megalosauridae, Spinosauridae, Carnosauria, Carcharodontosauridae, Megaraptora, Tyrannosauroidea, Compsognathidae, Ornithomimosauria, Tetanurae, Herrerasauria], depth: 3, probe: [Coelophysis, Carnotaurus, Spinosaurus, Giganotosaurus, Tyrannosaurus, Gallimimus] }
  literature: [theropod, coelophysoid, ceratosaur, abelisaurid, megalosaurid, spinosaurid, allosauroid, carcharodontosaurid, megaraptoran, tyrannosauroid, compsognathid, ornithomimosaur]
theropoda2:
  # Theropoda II (volume plan of 2026-11-25): non-avian maniraptorans (Maniraptora without birds; PBDB keeps most birds under Aves, outside its Avialae, so both are excluded; PBDB puts Alvarezsauroidea and Therizinosauria outside its Maniraptora, the literature inside, so they are added).
  pbdb: Maniraptora^Aves^Avialae,Alvarezsauroidea,Therizinosauria
  wikipedia: { categories: [Maniraptora, Alvarezsauridae, Alvarezsauroidea, Therizinosauria, Oviraptorosauria, Oviraptoridae, Caenagnathidae, Paraves, Scansoriopterygidae, Anchiornithidae, Dromaeosauridae, Unenlagiidae, Microraptoria, Troodontidae], depth: 3, probe: [Velociraptor, Oviraptor, Therizinosaurus, Shuvuuia, Troodon, Microraptor, Anchiornis, Yi (dinosaur)] }
  literature: [maniraptoran, alvarezsaurid, therizinosaur, oviraptorosaur, oviraptorid, caenagnathid, paravian, dromaeosaurid, troodontid, unenlagiid, microraptorine, scansoriopterygid]
